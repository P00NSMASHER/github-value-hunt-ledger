name: AI Business OS CI

on:
  push:
    branches:
      - "ai-business-os-step-*"
  pull_request:
    paths:
      - "ai_business_os/**"
      - ".github/workflows/ai-business-os-step1.yml"

jobs:
  ai-business-os:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run full AI Business OS test suite
        run: python -m unittest discover -s ai_business_os -p "test_*.py"
