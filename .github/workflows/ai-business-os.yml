name: AI Business OS Canonical CI

on:
  push:
    branches: [main]
    paths:
      - "ai_business_os/**"
      - "business_os/**"
      - "supabase/migrations/ai_business_os/**"
      - ".github/workflows/ai-business-os.yml"
  pull_request:
    paths:
      - "ai_business_os/**"
      - "business_os/**"
      - "supabase/migrations/ai_business_os/**"
      - ".github/workflows/ai-business-os.yml"

permissions:
  contents: read

jobs:
  canonical:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Compile canonical package
        run: python -m compileall -q ai_business_os
      - name: Canonical AI Business OS regression suite
        run: python -m unittest discover -s ai_business_os -p "test_*.py" -v
