name: Catalog append helper

on:
  push:
    branches: [main]
    paths:
      - '.github/catalog_append_payload.json'

permissions:
  contents: write

concurrency:
  group: catalog-append-main
  cancel-in-progress: false

jobs:
  append:
    if: github.actor != 'github-actions[bot]'
    outputs:
      proposal_ready: ${{ steps.persist.outputs.proposal_ready }}
      branch: ${{ steps.persist.outputs.branch }}
      base_sha: ${{ steps.persist.outputs.base_sha }}
      head_sha: ${{ steps.persist.outputs.head_sha }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Preserve triggered payload and update checkout
        shell: bash
        env:
          RETALLY_BEFORE_SHA: ${{ github.event.before }}
          RETALLY_SOURCE_SHA: ${{ github.sha }}
        run: |
          cp .github/catalog_append_payload.json /tmp/catalog_append_payload.json
          git pull --rebase origin main
          python -m tools.retally_payload_incremental \
            --kind catalog \
            --before "$RETALLY_BEFORE_SHA" \
            --after "$RETALLY_SOURCE_SHA" \
            --input /tmp/catalog_append_payload.json \
            --output /tmp/catalog_append_delta.json
      - name: Append catalog payload idempotently
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          ROOT = Path.cwd().resolve()
          ALLOWED_FILES = {
              'CAPABILITIES.md', 'COMPONENTS.md', 'DATASETS.md', 'OPPORTUNITIES.md',
              'REJECTED.md', 'SEARCH_QUEUE.md', 'TECHNOLOGY_RADAR.md',
          }
          ALLOWED_PREFIXES = ('hunters/', 'lanes/', 'referrals/')

          def safe_repo_path(rel: str) -> tuple[Path, str]:
              raw = Path(rel)
              if raw.is_absolute() or '..' in raw.parts:
                  raise SystemExit(f'unsafe path: {rel}')
              normalized = raw.as_posix()
              if normalized not in ALLOWED_FILES and not any(
                  normalized.startswith(prefix) for prefix in ALLOWED_PREFIXES
              ):
                  raise SystemExit(f'path not allowlisted: {rel}')
              resolved = (ROOT / raw).resolve()
              if resolved != ROOT and ROOT not in resolved.parents:
                  raise SystemExit(f'path escapes repository: {rel}')
              return resolved, normalized

          payload = json.loads(Path('/tmp/catalog_append_delta.json').read_text())
          marker = payload.get('marker', '')
          append = payload.get('append')
          if not isinstance(marker, str) or not marker or len(marker) > 500:
              raise SystemExit('marker must be a non-empty string <= 500 characters')
          if not isinstance(append, dict) or not append:
              raise SystemExit('append must be a non-empty object')

          changed = []
          for rel, addition in append.items():
              if not isinstance(rel, str) or not isinstance(addition, str):
                  raise SystemExit('append paths and additions must be strings')
              path, normalized = safe_repo_path(rel)
              if not path.exists():
                  raise SystemExit(f'catalog target does not exist: {rel}')
              current = path.read_text()
              if marker in current:
                  continue
              path.write_text(
                  current.rstrip() + '\n\n' + marker + '\n' + addition.strip() + '\n'
              )
              changed.append(normalized)

          Path('.catalog_append_changed').write_text(
              '\n'.join(changed) + ('\n' if changed else '')
          )
          PY
      - name: Commit catalog updates
        id: persist
        env:
          PR_MODE: ${{ vars.RETALLY_CATALOG_PR_ENABLED }}
        shell: bash
        run: |
          if [ ! -s .catalog_append_changed ]; then
            echo 'Nothing new to append.'
            exit 0
          fi
          git config user.name 'github-value-hunt-bot'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          while IFS= read -r file || [ -n "$file" ]; do git add -- "$file"; done < .catalog_append_changed
          git commit -m 'Catalog compliance and recovery proof findings'
          git pull --rebase origin main
          if [ "$PR_MODE" = "true" ]; then
            BRANCH="automation/retally-catalog-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            BASE_SHA="$(git rev-parse HEAD^)"
            HEAD_SHA="$(git rev-parse HEAD)"
            git push origin "HEAD:refs/heads/$BRANCH"
            {
              echo "proposal_ready=true"
              echo "branch=$BRANCH"
              echo "base_sha=$BASE_SHA"
              echo "head_sha=$HEAD_SHA"
            } >> "$GITHUB_OUTPUT"
          else
            git push
          fi

  submit-pr:
    needs: append
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      vars.RETALLY_CATALOG_PR_ENABLED == 'true' &&
      needs.append.outputs.proposal_ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Verify isolated catalog evidence before dispatching real CI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROPOSED_BRANCH: ${{ needs.append.outputs.branch }}
          PROPOSED_BASE: ${{ needs.append.outputs.base_sha }}
          PROPOSED_HEAD: ${{ needs.append.outputs.head_sha }}
        run: >-
          python -m tools.retally_automated_pr_proposal
          --lane catalog
          --branch "$PROPOSED_BRANCH"
          --base-sha "$PROPOSED_BASE"
          --head-sha "$PROPOSED_HEAD"
