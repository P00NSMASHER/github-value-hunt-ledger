name: CMS TiC Ledger Tests

on:
  push:
    branches:
      - cms-tic-payer-rate-ledger
      - main
    paths:
      - production/cms_tic_ledger/TEST_NOW

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: production/cms_tic_ledger
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: production/cms_tic_ledger/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest -v test_tic_ledger.py
