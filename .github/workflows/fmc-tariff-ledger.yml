name: FMC Tariff Rule Ledger

on:
  workflow_dispatch:
    inputs:
      shard_count:
        description: Number of deterministic FMC directory shards
        required: true
        default: "12"
        type: string
      workers_per_shard:
        description: Concurrent HTTP workers inside each shard
        required: true
        default: "4"
        type: string
      max_depth:
        description: Link-discovery depth from each FMC tariff location
        required: true
        default: "3"
        type: string
      max_pages_per_location:
        description: Safety cap per FMC tariff location
        required: true
        default: "100"
        type: string
      artifact_retention_days:
        description: Raw snapshot artifact retention
        required: true
        default: "7"
        type: string
  push:
    branches: [main]
    paths:
      - production/fmc_tariff_ledger/RUN_NOW

permissions:
  contents: read

concurrency:
  group: fmc-tariff-rule-ledger
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: production/fmc_tariff_ledger
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: production/fmc_tariff_ledger/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -v -p 'test_*.py'

  matrix:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.make.outputs.shards }}
    steps:
      - id: make
        env:
          SHARD_COUNT: ${{ inputs.shard_count || '12' }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          n = int(os.environ["SHARD_COUNT"])
          if n < 1 or n > 64:
              raise SystemExit("shard_count must be 1..64")
          print("shards=" + json.dumps(list(range(n))))
          PY

  crawl:
    needs: [test, matrix]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: ${{ fromJSON(needs.matrix.outputs.shards) }}
    defaults:
      run:
        working-directory: production/fmc_tariff_ledger
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: production/fmc_tariff_ledger/requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: Crawl deterministic FMC shard
        env:
          SHARD_COUNT: ${{ inputs.shard_count || '12' }}
          WORKERS: ${{ inputs.workers_per_shard || '4' }}
          MAX_DEPTH: ${{ inputs.max_depth || '3' }}
          MAX_PAGES: ${{ inputs.max_pages_per_location || '100' }}
          SHARD: ${{ matrix.shard }}
        run: |
          mkdir -p "output/shard-${SHARD}"
          python run.py crawl \
            --out "output/shard-${SHARD}" \
            --db ledger.sqlite \
            --workers "${WORKERS}" \
            --max-depth "${MAX_DEPTH}" \
            --max-pages-per-location "${MAX_PAGES}" \
            --shard-count "${SHARD_COUNT}" \
            --shard-index "${SHARD}"
      - name: Validate shard database
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          python run.py summary \
            --db "output/shard-${SHARD}/ledger.sqlite" \
            > "output/shard-${SHARD}/summary.json"
          python -m json.tool "output/shard-${SHARD}/summary.json"
      - name: Upload immutable shard snapshots
        uses: actions/upload-artifact@v4
        with:
          name: fmc-shard-${{ matrix.shard }}
          path: production/fmc_tariff_ledger/output/shard-${{ matrix.shard }}/
          retention-days: ${{ inputs.artifact_retention_days || 7 }}
          compression-level: 0
          if-no-files-found: error

  merge:
    needs: crawl
    if: always() && needs.crawl.result == 'success'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: production/fmc_tariff_ledger
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Download every shard
        uses: actions/download-artifact@v4
        with:
          pattern: fmc-shard-*
          path: production/fmc_tariff_ledger/downloaded
      - name: Merge metadata ledgers and content-addressed evidence
        run: |
          mkdir -p merged
          python run.py merge \
            --input-root downloaded \
            --db merged/fmc_tariff_ledger.sqlite
          python - <<'PY'
          from pathlib import Path
          import shutil

          root = Path("downloaded")
          dest = Path("merged")
          copied = 0
          deduped = 0
          for src in root.rglob("blobs/sha256/*/*"):
              if not src.is_file():
                  continue
              parts = src.parts
              try:
                  idx = parts.index("blobs")
              except ValueError:
                  continue
              target = dest.joinpath(*parts[idx:])
              target.parent.mkdir(parents=True, exist_ok=True)
              if target.exists():
                  deduped += 1
                  continue
              shutil.copy2(src, target)
              copied += 1
          print(f"raw evidence copied={copied} deduped={deduped}")
          PY
          python run.py summary \
            --db merged/fmc_tariff_ledger.sqlite \
            > merged/summary.json
          python -m json.tool merged/summary.json
      - name: Upload merged carrier-rule ledger
        uses: actions/upload-artifact@v4
        with:
          name: fmc-tariff-rule-ledger-merged
          path: production/fmc_tariff_ledger/merged/
          retention-days: ${{ inputs.artifact_retention_days || 7 }}
          compression-level: 0
          if-no-files-found: error
