name: FMC Tariff Rule Ledger

on:
  workflow_dispatch:
    inputs:
      shard_count:
        description: Number of deterministic FMC directory shards
        required: true
        default: "12"
        type: string
      workers_per_shard:
        description: Concurrent HTTP workers inside each shard
        required: true
        default: "4"
        type: string
      max_depth:
        description: Link-discovery depth from each FMC tariff location
        required: true
        default: "3"
        type: string
      max_pages_per_location:
        description: Safety cap per FMC tariff location
        required: true
        default: "100"
        type: string
      artifact_retention_days:
        description: Raw snapshot artifact retention
        required: true
        default: "7"
        type: string
  push:
    branches: [main]
    paths:
      - production/fmc_tariff_ledger/RUN_NOW

permissions:
  contents: read

concurrency:
  group: fmc-tariff-rule-ledger
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: production/fmc_tariff_ledger
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: production/fmc_tariff_ledger/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -v -p 'test_*.py'

  matrix:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.make.outputs.shards }}
    steps:
      - id: make
        env:
          SHARD_COUNT: ${{ inputs.shard_count || '12' }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          n = int(os.environ["SHARD_COUNT"])
          if n < 1 or n > 64:
              raise SystemExit("shard_count must be 1..64")
          print("shards=" + json.dumps(list(range(n))))
          PY

  crawl:
    needs: [test, matrix]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: ${{ fromJSON(needs.matrix.outputs.shards) }}
    defaults:
      run:
        working-directory: production/fmc_tariff_ledger
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: production/fmc_tariff_ledger/requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: Crawl deterministic FMC shard
        env:
          SHARD_COUNT: ${{ inputs.shard_count || '12' }}
          WORKERS: ${{ inputs.workers_per_shard || '4' }}
          MAX_DEPTH: ${{ inputs.max_depth || '3' }}
          MAX_PAGES: ${{ inputs.max_pages_per_location || '100' }}
          SHARD: ${{ matrix.shard }}
        run: |
          mkdir -p "output/shard-${SHARD}"
          python run.py crawl \
            --out "output/shard-${SHARD}" \
            --db ledger.sqlite \
            --workers "${WORKERS}" \
            --max-depth "${MAX_DEPTH}" \
            --max-pages-per-location "${MAX_PAGES}" \
            --shard-count "${SHARD_COUNT}" \
            --shard-index "${SHARD}"
      - name: Validate shard database
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          python run.py summary \
            --db "output/shard-${SHARD}/ledger.sqlite" \
            > "output/shard-${SHARD}/summary.json"
          python -m json.tool "output/shard-${SHARD}/summary.json"
      - name: Prepare compact shard metadata
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          mkdir -p "metadata/shard-${SHARD}"
          cp "output/shard-${SHARD}/ledger.sqlite" "metadata/shard-${SHARD}/ledger.sqlite"
          cp "output/shard-${SHARD}/summary.json" "metadata/shard-${SHARD}/summary.json"
          if test -f "output/shard-${SHARD}/stats.json"; then
            cp "output/shard-${SHARD}/stats.json" "metadata/shard-${SHARD}/stats.json"
          fi
          if test -f "output/shard-${SHARD}/fmc_directory_manifest.json"; then
            cp "output/shard-${SHARD}/fmc_directory_manifest.json" "metadata/shard-${SHARD}/fmc_directory_manifest.json"
          fi
      - name: Upload immutable shard snapshots
        uses: actions/upload-artifact@v4
        with:
          name: fmc-shard-${{ matrix.shard }}
          path: production/fmc_tariff_ledger/output/shard-${{ matrix.shard }}/
          retention-days: ${{ inputs.artifact_retention_days || 7 }}
          compression-level: 0
          if-no-files-found: error
      - name: Upload compact shard metadata
        uses: actions/upload-artifact@v4
        with:
          name: fmc-metadata-shard-${{ matrix.shard }}
          path: production/fmc_tariff_ledger/metadata/shard-${{ matrix.shard }}/
          retention-days: ${{ inputs.artifact_retention_days || 7 }}
          compression-level: 6
          if-no-files-found: error

  merge:
    needs: crawl
    if: always() && needs.crawl.result == 'success'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: production/fmc_tariff_ledger
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Download compact shard metadata
        uses: actions/download-artifact@v4
        with:
          pattern: fmc-metadata-shard-*
          path: production/fmc_tariff_ledger/metadata
      - name: Merge metadata ledgers
        run: |
          mkdir -p merged
          python run.py merge \
            --input-root metadata \
            --db merged/fmc_tariff_ledger.sqlite
          python run.py summary \
            --db merged/fmc_tariff_ledger.sqlite \
            > merged/summary.json
          python gap_report.py \
            --db merged/fmc_tariff_ledger.sqlite \
            --output merged/publisher_gap_report.json \
            > /dev/null
          python retry_plan.py \
            --db merged/fmc_tariff_ledger.sqlite \
            --output merged/retry_plan.json \
            > /dev/null
          python -m json.tool merged/summary.json
          python -m json.tool merged/publisher_gap_report.json > /dev/null
          python -m json.tool merged/retry_plan.json > /dev/null
          FIRST_MANIFEST=$(find metadata -name fmc_directory_manifest.json -print -quit || true)
          if test -n "$FIRST_MANIFEST"; then
            cp "$FIRST_MANIFEST" merged/fmc_directory_manifest.json
          fi
      - name: Upload merged carrier-rule ledger
        uses: actions/upload-artifact@v4
        with:
          name: fmc-tariff-rule-ledger-merged
          path: production/fmc_tariff_ledger/merged/
          retention-days: ${{ inputs.artifact_retention_days || 7 }}
          compression-level: 6
          if-no-files-found: error
