name: FMC Tariff Ledger Recover and Merge

on:
  workflow_run:
    workflows: ["FMC Tariff Rule Ledger"]
    types: [completed]
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Completed FMC Tariff Rule Ledger workflow run ID
        required: true
        type: string
      shard_count:
        description: Number of source shard artifacts
        required: true
        default: "12"
        type: string
      retention_days:
        description: Retention for recovered metadata artifacts
        required: true
        default: "7"
        type: string
      copy_raw_evidence:
        description: Duplicate raw shard artifacts into the recovery run
        required: true
        default: false
        type: boolean
  push:
    branches: [main]
    paths:
      - production/fmc_tariff_ledger/MERGE_NOW

permissions:
  contents: read
  actions: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      source_run_id: ${{ steps.cfg.outputs.source_run_id }}
      shards: ${{ steps.cfg.outputs.shards }}
      retention_days: ${{ steps.cfg.outputs.retention_days }}
      copy_raw_evidence: ${{ steps.cfg.outputs.copy_raw_evidence }}
    steps:
      - uses: actions/checkout@v4
      - id: cfg
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_RUN_ID: ${{ inputs.source_run_id }}
          INPUT_SHARDS: ${{ inputs.shard_count }}
          INPUT_RETENTION: ${{ inputs.retention_days }}
          INPUT_COPY_RAW: ${{ inputs.copy_raw_evidence }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          WORKFLOW_RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          from pathlib import Path

          event = os.environ.get('EVENT_NAME')
          if event == 'workflow_run':
              # Recover even when the legacy source run is marked failed solely
              # because its oversized final merge failed. Missing/failed shard
              # artifacts will fail explicitly in rehydrate instead.
              run_id = os.environ.get('WORKFLOW_RUN_ID', '').strip()
              shard_count = 12
              retention = 90
          elif event == 'workflow_dispatch':
              run_id = os.environ.get('INPUT_RUN_ID', '').strip()
              shard_count = int(os.environ.get('INPUT_SHARDS') or '12')
              retention = int(os.environ.get('INPUT_RETENTION') or '90')
          else:
              cfg = {}
              for line in Path('production/fmc_tariff_ledger/MERGE_NOW').read_text().splitlines():
                  if '=' in line:
                      k, v = line.split('=', 1)
                      cfg[k.strip()] = v.strip()
              run_id = cfg['source_run_id']
              shard_count = int(cfg.get('shard_count', '12'))
              retention = int(cfg.get('retention_days', '7'))
              copy_raw = cfg.get('copy_raw_evidence', 'false').lower() == 'true'

          if not run_id.isdigit():
              raise SystemExit('source_run_id must be numeric')
          if not 1 <= shard_count <= 64:
              raise SystemExit('shard_count must be 1..64')
          if not 1 <= retention <= 90:
              raise SystemExit('retention_days must be 1..90')

          print(f'source_run_id={run_id}')
          print('shards=' + json.dumps(list(range(shard_count))))
          print(f'retention_days={retention}')
          print('copy_raw_evidence=' + ('true' if copy_raw else 'false'))
          PY

  rehydrate:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: ${{ fromJSON(needs.prepare.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: production/fmc_tariff_ledger/requirements.txt
      - run: python -m pip install -r production/fmc_tariff_ledger/requirements.txt
      - name: Download source shard artifact
        uses: actions/download-artifact@v4
        with:
          name: fmc-shard-${{ matrix.shard }}
          path: source
          run-id: ${{ needs.prepare.outputs.source_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Revalidate shared-publisher evidence and extract compact metadata
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          test -f source/ledger.sqlite
          test -f source/summary.json
          cp source/summary.json source/summary_prevalidation.json
          python production/fmc_tariff_ledger/revalidate.py \
            --db source/ledger.sqlite \
            --artifact-root source \
            --report source/revalidation.json
          python production/fmc_tariff_ledger/reparse.py \
            --db source/ledger.sqlite \
            --artifact-root source \
            --report source/reparse.json
          python production/fmc_tariff_ledger/run.py summary \
            --db source/ledger.sqlite \
            > source/summary.json
          python -m json.tool source/revalidation.json
          python -m json.tool source/reparse.json
          python -m json.tool source/summary.json
          mkdir -p metadata/shard-${SHARD}
          cp source/ledger.sqlite metadata/shard-${SHARD}/ledger.sqlite
          cp source/summary.json metadata/shard-${SHARD}/summary.json
          cp source/summary_prevalidation.json metadata/shard-${SHARD}/summary_prevalidation.json
          cp source/revalidation.json metadata/shard-${SHARD}/revalidation.json
          cp source/reparse.json metadata/shard-${SHARD}/reparse.json
          if test -f source/stats.json; then
            cp source/stats.json metadata/shard-${SHARD}/stats.json
          fi
          if test -f source/fmc_directory_manifest.json; then
            cp source/fmc_directory_manifest.json metadata/shard-${SHARD}/fmc_directory_manifest.json
          fi
          du -sh source metadata/shard-${SHARD}
      - name: Re-upload durable raw evidence shard
        if: needs.prepare.outputs.copy_raw_evidence == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: fmc-evidence-shard-${{ matrix.shard }}
          path: source/
          retention-days: ${{ needs.prepare.outputs.retention_days }}
          compression-level: 0
          if-no-files-found: error
      - name: Upload compact metadata shard
        uses: actions/upload-artifact@v4
        with:
          name: fmc-metadata-shard-${{ matrix.shard }}
          path: metadata/shard-${{ matrix.shard }}/
          retention-days: ${{ needs.prepare.outputs.retention_days }}
          compression-level: 6
          if-no-files-found: error

  merge_metadata:
    needs: [prepare, rehydrate]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: production/fmc_tariff_ledger
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: production/fmc_tariff_ledger/requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: Download compact metadata shards only
        uses: actions/download-artifact@v4
        with:
          pattern: fmc-metadata-shard-*
          path: production/fmc_tariff_ledger/metadata
      - name: Merge rule ledgers
        env:
          SOURCE_RUN_ID: ${{ needs.prepare.outputs.source_run_id }}
          SHARD_COUNT: ${{ inputs.shard_count || '12' }}
          COPY_RAW: ${{ needs.prepare.outputs.copy_raw_evidence }}
        run: |
          mkdir -p merged
          python run.py merge \
            --input-root metadata \
            --db merged/fmc_tariff_ledger.sqlite
          python run.py summary \
            --db merged/fmc_tariff_ledger.sqlite \
            > merged/summary.json
          python -m json.tool merged/summary.json
          FIRST_MANIFEST=$(find metadata -name fmc_directory_manifest.json -print -quit || true)
          if test -n "$FIRST_MANIFEST"; then
            cp "$FIRST_MANIFEST" merged/fmc_directory_manifest.json
          fi
          python - <<'PY'
          import json, os
          from pathlib import Path
          payload = {
              'source_workflow_run_id': os.environ['SOURCE_RUN_ID'],
              'recovery_workflow_run_id': os.environ.get('GITHUB_RUN_ID'),
              'source_shard_count': int(os.environ.get('SHARD_COUNT', '12')),
              'raw_evidence_artifact_pattern': 'fmc-evidence-shard-*' if os.environ.get('COPY_RAW') == 'true' else None,
              'metadata_artifact_pattern': 'fmc-metadata-shard-*',
              'raw_evidence_embedded_in_merged_artifact': False,
          }
          Path('merged/provenance.json').write_text(json.dumps(payload, indent=2) + '\n')
          PY
      - name: Upload compact merged carrier-rule ledger
        uses: actions/upload-artifact@v4
        with:
          name: fmc-tariff-rule-ledger-merged
          path: production/fmc_tariff_ledger/merged/
          retention-days: ${{ needs.prepare.outputs.retention_days }}
          compression-level: 6
          if-no-files-found: error
