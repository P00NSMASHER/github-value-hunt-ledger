name: FMC Tariff Ledger Recover and Merge

on:
  workflow_run:
    workflows: ["FMC Tariff Rule Ledger"]
    types: [completed]
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Completed FMC Tariff Rule Ledger workflow run ID
        required: true
        type: string
      shard_count:
        description: Number of source shard artifacts
        required: true
        default: "12"
        type: string
      retention_days:
        description: Retention for recovered metadata artifacts
        required: true
        default: "90"
        type: string
      copy_raw_evidence:
        description: Duplicate raw shard artifacts into the recovery run
        required: true
        default: false
        type: boolean
  push:
    branches: [main]
    paths:
      - production/fmc_tariff_ledger/MERGE_NOW

# Same source run is serialized across automatic and operator replay.
# Existing manual MERGE_NOW remains supported but must pass the source gate.
run-name: FMC recover source ${{ github.event.workflow_run.id || inputs.source_run_id || 'MERGE_NOW' }}
concurrency:
  group: fmc-tariff-recover-${{ github.event.workflow_run.id || inputs.source_run_id || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  prepare:
    # Never admit a workflow_run from a fork, unreviewed branch, or non-main
    # manual dispatch to the potentially expensive recovery matrix.
    if: >-
      ${{ github.ref == 'refs/heads/main' &&
          (github.event_name != 'workflow_run' ||
           (github.event.workflow_run.head_branch == 'main' &&
            github.event.workflow_run.head_repository.full_name == github.repository)) }}
    runs-on: ubuntu-latest
    outputs:
      should_process: ${{ steps.source_gate.outputs.should_process }}
      source_run_id: ${{ steps.cfg.outputs.source_run_id }}
      shards: ${{ steps.cfg.outputs.shards }}
      shard_count: ${{ steps.cfg.outputs.shard_count }}
      retention_days: ${{ steps.cfg.outputs.retention_days }}
      copy_raw_evidence: ${{ steps.cfg.outputs.copy_raw_evidence }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - id: cfg
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_RUN_ID: ${{ inputs.source_run_id }}
          INPUT_SHARDS: ${{ inputs.shard_count }}
          INPUT_RETENTION: ${{ inputs.retention_days }}
          INPUT_COPY_RAW: ${{ inputs.copy_raw_evidence }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          WORKFLOW_RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, sys
          from pathlib import Path

          event = os.environ.get('EVENT_NAME')
          if event == 'workflow_run':
              # Recover even when the legacy source run is marked failed solely
              # because its oversized final merge failed. Missing/failed shard
              # artifacts will fail explicitly in rehydrate instead.
              run_id = os.environ.get('WORKFLOW_RUN_ID', '').strip()
              shard_count = 12
              retention = 90
              copy_raw = False
          elif event == 'workflow_dispatch':
              run_id = os.environ.get('INPUT_RUN_ID', '').strip()
              shard_count = int(os.environ.get('INPUT_SHARDS') or '12')
              retention = int(os.environ.get('INPUT_RETENTION') or '90')
              copy_raw = (os.environ.get('INPUT_COPY_RAW') or 'false').lower() == 'true'
          else:
              cfg = {}
              for line in Path('production/fmc_tariff_ledger/MERGE_NOW').read_text().splitlines():
                  if '=' in line:
                      k, v = line.split('=', 1)
                      cfg[k.strip()] = v.strip()
              run_id = cfg['source_run_id']
              shard_count = int(cfg.get('shard_count', '12'))
              retention = int(cfg.get('retention_days', '90'))
              copy_raw = cfg.get('copy_raw_evidence', 'false').lower() == 'true'

          if not run_id.isdigit():
              raise SystemExit('source_run_id must be numeric')
          if not 1 <= shard_count <= 64:
              raise SystemExit('shard_count must be 1..64')
          if not 1 <= retention <= 90:
              raise SystemExit('retention_days must be 1..90')

          print(f'source_run_id={run_id}')
          print('shards=' + json.dumps(list(range(shard_count))))
          print(f'shard_count={shard_count}')
          print(f'retention_days={retention}')
          print('copy_raw_evidence=' + ('true' if copy_raw else 'false'))
          PY

      - name: Verify source provenance, shard availability and duplicate success
        id: source_gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ steps.cfg.outputs.source_run_id }}
          SOURCE_SHARD_COUNT: ${{ steps.cfg.outputs.shard_count }}
          EVENT_NAME: ${{ github.event_name }}
          AUTOMATIC_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          current_main="$(git ls-remote origin refs/heads/main | cut -f1)"
          [[ "$current_main" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::Cannot verify current main HEAD"; exit 1;
          }
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" > "$RUNNER_TEMP/fmc-source-run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/artifacts?per_page=100" > "$RUNNER_TEMP/fmc-source-artifacts.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/fmc-tariff-recover-merge.yml/runs?per_page=100" > "$RUNNER_TEMP/fmc-recovery-runs.json"
          export MAIN_HEAD="$current_main"
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          from pathlib import Path

          root = Path(os.environ['RUNNER_TEMP'])
          source = json.loads((root/'fmc-source-run.json').read_text())
          artifacts = json.loads((root/'fmc-source-artifacts.json').read_text())
          recoveries = json.loads((root/'fmc-recovery-runs.json').read_text())
          run_id = int(os.environ['SOURCE_RUN_ID'])
          count = int(os.environ['SOURCE_SHARD_COUNT'])
          repo = os.environ['GITHUB_REPOSITORY']
          if source.get('id') != run_id or source.get('name') != 'FMC Tariff Rule Ledger':
              raise SystemExit('Source ID is not the named FMC Tariff Rule Ledger workflow')
          if source.get('repository', {}).get('full_name') != repo or source.get('head_branch') != 'main':
              raise SystemExit('Source run must originate from this repository main')
          if source.get('status') != 'completed':
              raise SystemExit('Source run must have completed')
          if os.environ['EVENT_NAME'] == 'workflow_run':
              if source.get('head_sha') != os.environ['AUTOMATIC_HEAD_SHA']:
                  raise SystemExit('Event/source SHA mismatch')
              if source.get('head_sha') != os.environ['MAIN_HEAD']:
                  raise SystemExit('Automatic recovery source is no longer exact-main; use reviewed manual recovery')
          available = {a['name'] for a in artifacts.get('artifacts', [])
                       if not a.get('expired') and isinstance(a.get('name'), str)}
          missing = [f'fmc-shard-{i}' for i in range(count) if f'fmc-shard-{i}' not in available]
          if missing:
              raise SystemExit(f'Source artifacts missing or expired: {len(missing)} shard(s)')
          title = f'FMC recover source {run_id}'
          duplicate = any(
              r.get('id') != int(os.environ['GITHUB_RUN_ID'])
              and r.get('display_title') == title
              and r.get('conclusion') == 'success'
              for r in recoveries.get('workflow_runs', [])
          )
          if duplicate:
              print('FMC source already successfully recovered: no duplicate artifacts issued.', file=sys.stderr)
              print('should_process=false')
          else:
              print('should_process=true')
          PY

  rehydrate:
    needs: prepare
    if: needs.prepare.outputs.should_process == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: ${{ fromJSON(needs.prepare.outputs.shards) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: production/fmc_tariff_ledger/requirements.txt
      - run: python -m pip install -r production/fmc_tariff_ledger/requirements.txt
      - name: Download source shard artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: fmc-shard-${{ matrix.shard }}
          path: source
          run-id: ${{ needs.prepare.outputs.source_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Revalidate shared-publisher evidence and extract compact metadata
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          test -f source/ledger.sqlite
          test -f source/summary.json
          cp source/summary.json source/summary_prevalidation.json
          python production/fmc_tariff_ledger/revalidate.py \
            --db source/ledger.sqlite \
            --artifact-root source \
            --report source/revalidation.json
          python production/fmc_tariff_ledger/reparse.py \
            --db source/ledger.sqlite \
            --artifact-root source \
            --report source/reparse.json
          python production/fmc_tariff_ledger/retry_transient.py \
            --db source/ledger.sqlite \
            --artifact-root source \
            --timeout 20 \
            --limit 100 \
            --report source/retry_transient.json
          python production/fmc_tariff_ledger/run.py summary \
            --db source/ledger.sqlite \
            > source/summary.json
          python -m json.tool source/revalidation.json
          python -m json.tool source/reparse.json
          python -m json.tool source/retry_transient.json
          python -m json.tool source/summary.json
          mkdir -p metadata/shard-${SHARD}
          cp source/ledger.sqlite metadata/shard-${SHARD}/ledger.sqlite
          cp source/summary.json metadata/shard-${SHARD}/summary.json
          cp source/summary_prevalidation.json metadata/shard-${SHARD}/summary_prevalidation.json
          cp source/revalidation.json metadata/shard-${SHARD}/revalidation.json
          cp source/reparse.json metadata/shard-${SHARD}/reparse.json
          cp source/retry_transient.json metadata/shard-${SHARD}/retry_transient.json
          if test -f source/stats.json; then
            cp source/stats.json metadata/shard-${SHARD}/stats.json
          fi
          if test -f source/fmc_directory_manifest.json; then
            cp source/fmc_directory_manifest.json metadata/shard-${SHARD}/fmc_directory_manifest.json
          fi
          du -sh source metadata/shard-${SHARD}
      - name: Re-upload durable raw evidence shard
        if: needs.prepare.outputs.copy_raw_evidence == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fmc-evidence-shard-${{ matrix.shard }}
          path: source/
          retention-days: ${{ needs.prepare.outputs.retention_days }}
          compression-level: 0
          if-no-files-found: error
      - name: Upload compact metadata shard
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fmc-metadata-shard-${{ matrix.shard }}
          path: metadata/shard-${{ matrix.shard }}/
          retention-days: ${{ needs.prepare.outputs.retention_days }}
          compression-level: 6
          if-no-files-found: error

  merge_metadata:
    needs: [prepare, rehydrate]
    if: needs.prepare.outputs.should_process == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: production/fmc_tariff_ledger
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: production/fmc_tariff_ledger/requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: Download compact metadata shards only
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: fmc-metadata-shard-*
          path: production/fmc_tariff_ledger/metadata
      - name: Merge rule ledgers
        env:
          SOURCE_RUN_ID: ${{ needs.prepare.outputs.source_run_id }}
          SHARD_COUNT: ${{ needs.prepare.outputs.shard_count }}
          COPY_RAW: ${{ needs.prepare.outputs.copy_raw_evidence }}
        run: |
          mkdir -p merged
          python run.py merge \
            --input-root metadata \
            --db merged/fmc_tariff_ledger.sqlite
          python quality_rollup.py \
            --input-root metadata \
            --output merged/quality_rollup.json \
            > /dev/null
          python evidence_inventory.py \
            --input-root metadata \
            --source-run-id "$SOURCE_RUN_ID" \
            --output merged/evidence_inventory.json \
            > /dev/null
          python run.py summary \
            --db merged/fmc_tariff_ledger.sqlite \
            > merged/summary.json
          python gap_report.py \
            --db merged/fmc_tariff_ledger.sqlite \
            --output merged/publisher_gap_report.json \
            > /dev/null
          python retry_plan.py \
            --db merged/fmc_tariff_ledger.sqlite \
            --output merged/retry_plan.json \
            > /dev/null
          python -m json.tool merged/summary.json
          python -m json.tool merged/quality_rollup.json > /dev/null
          python -m json.tool merged/evidence_inventory.json > /dev/null
          python -m json.tool merged/publisher_gap_report.json > /dev/null
          python -m json.tool merged/retry_plan.json > /dev/null
          FIRST_MANIFEST=$(find metadata -name fmc_directory_manifest.json -print -quit || true)
          if test -n "$FIRST_MANIFEST"; then
            cp "$FIRST_MANIFEST" merged/fmc_directory_manifest.json
          fi
          python - <<'PY'
          import json, os
          from pathlib import Path
          payload = {
              'source_workflow_run_id': os.environ['SOURCE_RUN_ID'],
              'recovery_workflow_run_id': os.environ.get('GITHUB_RUN_ID'),
              'source_shard_count': int(os.environ.get('SHARD_COUNT', '12')),
              'raw_evidence_artifact_pattern': 'fmc-evidence-shard-*' if os.environ.get('COPY_RAW') == 'true' else None,
              'metadata_artifact_pattern': 'fmc-metadata-shard-*',
              'raw_evidence_embedded_in_merged_artifact': False,
          }
          Path('merged/provenance.json').write_text(json.dumps(payload, indent=2) + '\n')
          PY
      - name: Upload compact merged carrier-rule ledger
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fmc-tariff-rule-ledger-merged
          path: production/fmc_tariff_ledger/merged/
          retention-days: ${{ needs.prepare.outputs.retention_days }}
          compression-level: 6
          if-no-files-found: error
