name: FMC Tariff Ledger Tests

on:
  pull_request:
    paths:
      - 'production/fmc_tariff_ledger/**'
      - '.github/workflows/fmc-tariff-*.yml'
  push:
    branches: [main]
    paths:
      - 'production/fmc_tariff_ledger/**'
      - '.github/workflows/fmc-tariff-*.yml'

permissions:
  contents: read

concurrency:
  group: fmc-tariff-tests-${{ github.sha }}
  cancel-in-progress: false

jobs:
  unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: production/fmc_tariff_ledger
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: production/fmc_tariff_ledger/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -v -p 'test_*.py'
