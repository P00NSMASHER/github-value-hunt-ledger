name: FMC Tariff Ledger Tests

on:
  pull_request:
    paths:
      - 'production/fmc_tariff_ledger/**'
      - '.github/workflows/fmc-tariff-*.yml'
  push:
    branches: [main]
    paths:
      - 'production/fmc_tariff_ledger/**'
      - '.github/workflows/fmc-tariff-*.yml'

permissions:
  contents: read

concurrency:
  group: fmc-tariff-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: production/fmc_tariff_ledger
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: production/fmc_tariff_ledger/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -v -p 'test_*.py'
