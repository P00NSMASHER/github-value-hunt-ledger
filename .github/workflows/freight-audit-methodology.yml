name: RecoveryOS Blind Audit Methodology

on:
  pull_request:
    paths:
      - 'freight/audit_acceptance.py'
      - 'freight/test_audit_acceptance.py'
      - 'freight/AUDIT_ACCEPTANCE_POLICY_V2.json'
      - 'freight/AUDIT_ACCEPTANCE_PROTOCOL_V2.md'
      - 'freight/PILOT_REPORT_TEMPLATE.md'
      - 'freight/PHASE3_CUSTOMER_PROOF_PACKAGE.md'
      - 'freight/PHASE3_IMPLEMENTATION_RUNBOOK.md'
      - '.github/workflows/freight-audit-methodology.yml'
  push:
    branches: [main]
    paths:
      - 'freight/audit_acceptance.py'
      - 'freight/test_audit_acceptance.py'
      - 'freight/AUDIT_ACCEPTANCE_POLICY_V2.json'
      - 'freight/AUDIT_ACCEPTANCE_PROTOCOL_V2.md'
      - 'freight/PILOT_REPORT_TEMPLATE.md'
      - 'freight/PHASE3_CUSTOMER_PROOF_PACKAGE.md'
      - 'freight/PHASE3_IMPLEMENTATION_RUNBOOK.md'
      - '.github/workflows/freight-audit-methodology.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  methodology:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'production/requirements-ci.txt'
      - run: python -m pip install --disable-pip-version-check -r production/requirements-ci.txt
      - name: Blind methodology regression tests
        run: PYTHONPATH=. python -m pytest -q freight/test_audit_acceptance.py
      - name: Compile methodology engine
        run: PYTHONPATH=. python -m py_compile freight/audit_acceptance.py
