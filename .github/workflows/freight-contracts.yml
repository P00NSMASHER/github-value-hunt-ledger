name: Freight Commercial Contracts

on:
  push:
    paths:
      - 'freight/**'
      - 'production/prototype.py'
      - 'production/test_prototype.py'
      - 'production/requirements-ci.txt'
      - '.github/workflows/freight-contracts.yml'
      - '.github/workflows/technology-intelligence.yml'
  pull_request:
    paths:
      - 'freight/**'
      - 'production/prototype.py'
      - 'production/test_prototype.py'
      - 'production/requirements-ci.txt'
      - '.github/workflows/freight-contracts.yml'
      - '.github/workflows/technology-intelligence.yml'

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'production/requirements-ci.txt'
      - run: python -m pip install --disable-pip-version-check -r production/requirements-ci.txt
      - name: Hunter/model contracts
        run: cd production && python -m pytest -q test_prototype.py
      - name: Freight commercial proof contracts
        run: PYTHONPATH=. python -m pytest -q freight/test_contracts.py freight/test_settlement_store.py freight/test_release_gate.py freight/test_gap_registry.py freight/test_readiness.py freight/test_pilot_reporting.py freight/test_deal_economics.py freight/test_outcome_adapter.py freight/test_commercial_learning.py freight/test_input_guard.py freight/test_pilot_package.py freight/test_release_provenance.py freight/test_audit_ledger.py freight/test_data_lifecycle.py freight/test_sbom.py freight/test_release_attestation.py freight/test_audit_store.py freight/test_backup_restore.py freight/test_diligence_bundle.py freight/test_rights_evidence.py freight/test_incident_response.py freight/test_research_ci_governance.py freight/test_synthetic_rehearsal.py
      - name: Controlled-pilot rights gate
        run: PYTHONPATH=. python freight/release_gate.py --stage pilot
      - name: Controlled-pilot rights evidence gate
        run: PYTHONPATH=. python freight/rights_evidence.py --stage pilot
      - name: Canonical freight gap register
        run: PYTHONPATH=. python freight/gap_registry.py --list-active-search
      - name: Ready-pilot diagnostic fixture
        run: PYTHONPATH=. python freight/readiness.py freight/fixtures/readiness_ready.json
      - name: Full synthetic commercial rehearsal
        run: PYTHONPATH=. python freight/synthetic_rehearsal.py
      - name: Generate deterministic release provenance
        run: PYTHONPATH=. python freight/release_provenance.py > /tmp/freight-release-provenance.json
      - name: Verify deterministic release provenance
        run: PYTHONPATH=. python freight/release_provenance.py --verify /tmp/freight-release-provenance.json
      - name: Generate component inventory
        run: PYTHONPATH=. python freight/release_provenance.py --components > /tmp/freight-component-inventory.json
      - name: Generate deterministic CycloneDX SBOM
        run: PYTHONPATH=. python freight/sbom.py > /tmp/freight-cyclonedx.json
      - name: Verify deterministic CycloneDX SBOM
        run: PYTHONPATH=. python freight/sbom.py --verify /tmp/freight-cyclonedx.json
      - name: Generate unsigned DSSE attestation payload
        run: PYTHONPATH=. python freight/release_attestation.py > /tmp/freight-attestation.json
      - name: Verify unsigned DSSE attestation payload
        run: PYTHONPATH=. python freight/release_attestation.py --verify /tmp/freight-attestation.json
      - name: Generate deterministic diligence bundle
        run: PYTHONPATH=. python freight/diligence_bundle.py /tmp/freight-diligence.zip
      - name: Verify deterministic diligence bundle
        run: PYTHONPATH=. python freight/diligence_bundle.py --verify /tmp/freight-diligence.zip
