name: Freight Synthetic Customer Lifecycle Smoke
on:
  pull_request:
    paths:
      - 'freight/customer_lifecycle_product_probe.py'
      - 'freight/test_customer_lifecycle_product_probe.py'
      - 'freight/customer_scope_recovery_guard.py'
      - 'freight/test_customer_scope_recovery_guard.py'
      - 'freight/CUSTOMER_LIFECYCLE_LAB.md'
      - '.github/workflows/freight-customer-lifecycle-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-customer-domain:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout pull request exact head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Execute real domain payment tests with fictional objects
        run: python -m unittest -v freight.test_customer_lifecycle_product_probe freight.test_customer_scope_recovery_guard
      - name: Explicit scope
        run: |
          echo 'Simulation only. No customer data, email, payment, provider calls, or production deployment.'
          echo 'Tested payment-domain transitions are not a substitute for customer lifecycle staging integration.'
