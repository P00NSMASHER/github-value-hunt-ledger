name: Freight Execution Store Smoke

on:
  push:
    branches:
      - freight-action-execution-store-r2
    paths:
      - 'freight/carrier_action_execution.py'
      - 'freight/carrier_action_execution_store.py'
      - 'freight/carrier_action_execution_schema.sql'
      - 'freight/test_carrier_action_execution_store.py'
      - '.github/workflows/freight-execution-store-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check -r production/requirements-ci.txt
      - name: Carrier execution persistence contracts
        run: PYTHONPATH=. python -m pytest -q freight/test_carrier_action_execution.py freight/test_carrier_action_execution_store.py
