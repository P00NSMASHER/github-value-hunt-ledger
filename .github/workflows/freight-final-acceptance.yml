name: RETALLY Final Laboratory and Financial Acceptance
on:
  pull_request:
    paths:
      - 'freight/phase5/final_acceptance.py'
      - 'freight/phase5/test_final_acceptance.py'
      - 'freight/phase5/RETALLY_FINAL_RESEARCH_HANDOFF.md'
      - '.github/workflows/freight-final-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-head-final-review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact proposed head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Use Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install pinned verifier and research dependencies
        run: |
          python -m pip install -r production/requirements-ci.txt
          python -m pip install cryptography==46.0.4
      - name: Reject falsified source history and financial security claims
        run: |
          PYTHONPATH=. python -m pytest -q -rs \
            freight/phase5/test_final_acceptance.py \
            freight/phase5/test_phase5h_control_overlay.py \
            freight/phase5/test_phase5g_control_overlay.py \
            freight/phase5/test_phase5e_receipt.py \
            freight/phase5/test_phase5c_oracle.py \
            freight/phase5/test_phase5d_bc_qa.py \
            freight/phase5/test_phase5d_d07_receipt.py \
            freight/test_lab_hunter_research_registry.py
      - name: Build final capstone from pinned evidence and inherited dashboard
        run: |
          PYTHONPATH=. python -m freight.phase5.final_acceptance --out /tmp/retally-final
      - name: Independently gate the generated final handoff
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('/tmp/retally-final')
          data=json.loads((root/'final_acceptance.json').read_text())
          assert data['ci_head']==__import__('os').environ['GITHUB_SHA'], 'SOURCE_SHA_MISMATCH'
          assert len(data['pr_chain'])==14
          assert len(data['frozen_source_git_blobs'])==5
          assert len(data['release_gates'])==12
          assert len(data['blocked_gates'])==6
          assert data['release_decision']=='DO_NOT_RELEASE_FINANCIAL_PRODUCTION'
          assert data['original_findings']['historical_open']==26
          assert data['research_labs_executed']==14
          assert data['hosted_qa_db_principal']=='neondb_owner'
          assert data['actual_company_revenue_cents']==0
          assert data['actual_customer_recovery_cents']==0
          assert data['live_floot_verified_during_this_ci'] is False
          assert data['synthetic_customer_A_financials']['net_earned_fee_cents']==150
          assert data['synthetic_customers_BC']['simulated_customer_recovered_cents']==0
          assert (root/'index.html').is_file()
          assert (root/'FINAL_ENGINEERING_HANDOFF.md').is_file()
          print('RELEASE_BLOCKED_BY_INDEPENDENT_FINANCIAL_SECURITY_GATES')
          PY
      - name: Preserve one final owner-facing research handoff
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: retally-final-laboratory-research-acceptance
          path: |
            /tmp/retally-final/index.html
            /tmp/retally-final/final_acceptance.json
            /tmp/retally-final/FINAL_ENGINEERING_HANDOFF.md
          if-no-files-found: error
          retention-days: 30
      - name: Explicit production safety note
        run: |
          echo 'This is research/fictional QA acceptance, not a production deployment.'
          echo 'External issuer and restricted Floot verifier credentials are still blocked.'
          echo 'No PR merges, customer contacts, bank activity, production writes, or task changes.'
