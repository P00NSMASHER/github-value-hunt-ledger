name: Freight Lab Findings and Hunt Reuse Audit
on:
  pull_request:
    paths:
      - 'freight/research/LAB_FINDINGS_CUMULATIVE.json'
      - 'freight/research/HUNTED_CODE_REUSE_CANDIDATES.json'
      - 'freight/test_lab_hunter_research_registry.py'
      - '.github/workflows/freight-lab-hunt-reuse-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research-consistency:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install pinned project CI tools
        run: python -m pip install -r production/requirements-ci.txt
      - name: Verify historical findings and donor disclosure
        run: PYTHONPATH=. python -m pytest -q freight/test_lab_hunter_research_registry.py
      - name: Status boundary
        run: |
          echo 'Research registry consistency only. Financial vulnerabilities remain OPEN.'
          echo 'No production changes, bank transactions, emails or automatic merges.'
