name: RETALLY Phase 3 Commercial and Executable-Lab Acceptance
on:
  pull_request:
    paths:
      - 'freight/lab_phase3_*.py'
      - 'freight/test_lab_phase3_*.py'
      - 'freight/LAB_PHASE3_EXECUTION.md'
      - '.github/workflows/freight-lab-phase3.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research-contract-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout complete exact source history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install pinned isolated test dependencies
        run: |
          python -m pip install -r production/requirements-ci.txt
          python -m pip install cryptography==46.0.4
      - name: Check historical chain and 26 open issues
        run: PYTHONPATH=. python -m freight.lab_phase3_release_manifest --root . --check-git-ancestry
      - name: Exercise original settlement module and independent oracle
        run: PYTHONPATH=. python -m pytest -q freight/test_settlement_store.py freight/test_lab_phase2_existing_settlement_bridge.py freight/test_lab_assurance_real_store.py
      - name: Execute real domain rating-to-recovery chain and simulated founding pilot
        run: |
          PYTHONPATH=. python -W error::ResourceWarning -m unittest -v \
            freight.test_lab_phase3_economics \
            freight.test_lab_phase3_trust \
            freight.test_lab_phase3_release_manifest \
            freight.test_lab_phase3_real_chain \
            freight.test_lab_phase3_simulated_pilot \
            freight.test_lab_phase3_console
      - name: Preserve previous evidence and 14-lab routing contract
        run: |
          PYTHONPATH=. python -W error::ResourceWarning -m unittest -q \
            freight.test_lab_assurance \
            freight.test_lab_operations_intelligence \
            freight.test_lab_phase2_pipeline \
            freight.test_lab_customer_scenarios \
            freight.test_lab_experiment_ledger
          PYTHONPATH=. python -m pytest -q freight/test_lab_hunter_research_registry.py
      - name: Build and inspect standalone offline dashboard
        run: |
          PYTHONPATH=. python -m freight.lab_phase3_console --output /tmp/retally-phase3-control
          python - <<'PY'
          from pathlib import Path
          import json
          p=Path('/tmp/retally-phase3-control')
          j=json.loads((p/'phase3_dashboard.json').read_text())
          assert j['historical_open_findings']==26
          assert j['routed_tasks_not_executed']==49
          assert j['actual_company_revenue_cents']==0
          assert j['pilot']['simulated_customer_count']==3
          assert j['hosted_staging_certified'] is False
          assert '<script id="evidence"' in (p/'index.html').read_text()
          print('PASS: static synthetic control center and explicit non-claims')
          PY
      - name: Bound final result
        run: |
          echo 'DO NOT MERGE OR DEPLOY. No customer/bank/carrier sources or production DB touched.'
          echo 'Simulation pilot is not customer acquisition or actual revenue.'
