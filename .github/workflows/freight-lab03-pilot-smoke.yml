name: Freight Lab03 First Customer Synthetic Blind Pilot
on:
  pull_request:
    paths:
      - 'freight/pilot_lab03_methodology_probe.py'
      - 'freight/test_pilot_lab03_methodology_probe.py'
      - '.github/workflows/freight-lab03-pilot-smoke.yml'
      - 'freight/LAB03_FIRST_CUSTOMER_EVIDENCE.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-acceptance-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up pinned Python version
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install only existing pinned repo test dependencies
        run: python -m pip install -r production/requirements-ci.txt
      - name: Exercise actual audit methodology with fictional role and source inputs
        run: PYTHONPATH=. python -m pytest -q freight/test_pilot_lab03_methodology_probe.py
      - name: Reiterate customer proof boundary
        run: |
          echo 'SYNTHETIC_METHOD_SMOKE_ONLY, never real customer proof.'
          echo 'No carrier communication, bank action, new cron, production deployment or customer data.'
