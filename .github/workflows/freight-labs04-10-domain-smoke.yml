name: Freight Laboratories 04-10 Actual Domain Smoke
on:
  pull_request:
    paths:
      - 'freight/test_labs04_10_product_integration.py'
      - 'freight/LABS04_10_SYNTHETIC_EVIDENCE.md'
      - '.github/workflows/freight-labs04-10-domain-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actual-domain-synthetic-test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout immutable revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install pinned CI test requirements
        run: python -m pip install -r production/requirements-ci.txt
      - name: Run actual Python domain modules with fictional data
        run: PYTHONPATH=. python -m pytest -q freight/test_labs04_10_product_integration.py
      - name: Explicit evidence boundary
        run: |
          echo 'Synthetic actual-code smoke only. No host application integration or customer data.'
          echo 'No email, real carrier action, payments, purchases, schedules or deployment.'
