name: Freight Labs 11-14 Synthetic Domain Smoke
on:
  pull_request:
    paths:
      - 'freight/labs11_14.py'
      - 'freight/test_labs11_14.py'
      - 'freight/test_labs11_14_actual_domain.py'
      - 'freight/LABS11_14_EVIDENCE.md'
      - '.github/workflows/freight-labs11-14-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-domain:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Execute isolated synthetic tests
        run: python -m unittest -v freight.test_labs11_14
      - name: Install repository test dependencies
        run: python -m pip install -r production/requirements-ci.txt
      - name: Probe actual repository domains with fictional evidence
        run: PYTHONPATH=. python -m pytest -q freight/test_labs11_14_actual_domain.py
      - name: State claim boundary
        run: |
          echo 'Offline synthetic-only simulation. NO customer outcome, SOC2, penetration test, or bank transfer proved.'
          echo 'No schedule, external API, payment, email, carrier contact, production change, or deployment.'
