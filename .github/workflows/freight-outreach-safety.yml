name: Freight outreach safeguards
on:
  pull_request:
    paths:
      - 'freight/outreach*'
      - 'freight/free_growth_engine.py'
      - 'freight/test_free_growth_engine.py'
      - 'freight/*OUTBOUND*'
      - '.github/workflows/freight-outreach-safety.yml'
  push:
    branches: [main, fix/freight-outreach-safety-20261007]
    paths:
      - 'freight/outreach*'
      - 'freight/free_growth_engine.py'
      - 'freight/test_free_growth_engine.py'
      - 'freight/*OUTBOUND*'
      - '.github/workflows/freight-outreach-safety.yml'
permissions:
  contents: read
jobs:
  safeguard-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: node freight/outreach_guard.test.mjs
      - run: node --check freight/outreach_preflight.mjs
      - run: node freight/outreach_preflight.test.mjs
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - run: python -m pytest -q freight/test_free_growth_engine.py
