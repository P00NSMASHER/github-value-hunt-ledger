name: Freight outreach safeguards
on:
  pull_request:
    paths:
      - 'freight/outreach*'
      - 'freight/free_growth_engine.py'
      - 'freight/test_free_growth_engine.py'
      - 'freight/*OUTBOUND*'
      - '.github/workflows/freight-outreach-safety.yml'
  push:
    branches: [main, fix/freight-outreach-safety-20261007]
    paths:
      - 'freight/outreach*'
      - 'freight/free_growth_engine.py'
      - 'freight/test_free_growth_engine.py'
      - 'freight/*OUTBOUND*'
      - '.github/workflows/freight-outreach-safety.yml'
permissions:
  contents: read
jobs:
  safeguard-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node freight/outreach_guard.test.mjs
      - run: node --check freight/outreach_preflight.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - run: python -m pytest -q freight/test_free_growth_engine.py
