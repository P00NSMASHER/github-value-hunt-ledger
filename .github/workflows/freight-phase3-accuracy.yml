name: RecoveryOS Phase 3 Accuracy

on:
  pull_request:
    paths:
      - 'freight/accuracy_benchmark.py'
      - 'freight/accuracy_evidence.py'
      - 'freight/test_phase3_accuracy.py'
      - 'freight/fixtures/phase3_accuracy_gold_v1.json'
      - 'freight/PHASE3_ACCURACY_BASELINE.json'
      - 'freight/PHASE3_STEP3_ACCURACY.md'
      - '.github/workflows/freight-phase3-accuracy.yml'
  push:
    branches: [main]
    paths:
      - 'freight/accuracy_benchmark.py'
      - 'freight/accuracy_evidence.py'
      - 'freight/test_phase3_accuracy.py'
      - 'freight/fixtures/phase3_accuracy_gold_v1.json'
      - 'freight/PHASE3_ACCURACY_BASELINE.json'
      - 'freight/PHASE3_STEP3_ACCURACY.md'
      - '.github/workflows/freight-phase3-accuracy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  accuracy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'production/requirements-ci.txt'
      - run: python -m pip install --disable-pip-version-check -r production/requirements-ci.txt
      - name: Accuracy harness regression tests
        run: PYTHONPATH=. python -m pytest -q freight/test_phase3_accuracy.py
      - name: Execute frozen synthetic gold benchmark
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python -m freight.accuracy_benchmark \
            --fixture freight/fixtures/phase3_accuracy_gold_v1.json \
            --output /tmp/recoveryos-phase3-accuracy.json \
            --summary | tee /tmp/recoveryos-phase3-accuracy-summary.json
          echo '### RecoveryOS Phase 3 accuracy benchmark' >> "$GITHUB_STEP_SUMMARY"
          echo '~~~json' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/recoveryos-phase3-accuracy-summary.json >> "$GITHUB_STEP_SUMMARY"
          echo '~~~' >> "$GITHUB_STEP_SUMMARY"
          echo '===RECOVERYOS_PHASE3_ACCURACY_REPORT_BEGIN==='
          cat /tmp/recoveryos-phase3-accuracy.json
          echo '===RECOVERYOS_PHASE3_ACCURACY_REPORT_END==='
