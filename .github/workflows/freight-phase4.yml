name: RETALLY Phase 4 Bounded Lab Execution
on:
  pull_request:
    paths:
      - 'freight/lab_phase4_director.py'
      - 'freight/test_lab_phase4_director.py'
      - 'freight/lab_phase4_control_center.py'
      - 'freight/lab_phase4_experiments.py'
      - 'freight/test_lab_phase4_experiments.py'
      - 'freight/lab_phase4_mock_provider.py'
      - 'freight/test_lab_phase4_mock_provider.py'
      - 'freight/PHASE4_EXECUTION.md'
      - '.github/workflows/freight-phase4.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase4-isolated-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install pinned project test dependencies
        run: python -m pip install -r production/requirements-ci.txt
      - name: Test fourteen laboratory actual-code callsites and original domain chain
        run: PYTHONPATH=. python -m pytest -q freight/test_lab_phase4_director.py freight/test_lab_phase4_experiments.py freight/test_lab_phase4_mock_provider.py freight/test_lab_phase3_real_chain.py freight/test_lab_phase3_economics.py freight/test_lab_phase3_simulated_pilot.py freight/test_lab_phase3_trust.py
      - name: Produce bounded synthetic execution report
        run: |
          PYTHONPATH=. python -m freight.lab_phase4_control_center --out /tmp/retally-phase4
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('/tmp/retally-phase4/phase4_control.json').read_text())
          assert d['actual_revenue_cents']==0
          assert d['historical_findings_open']==26
          assert len(d['lab_runs'])==14
          assert d['source_context']['hosted_Floot_API_executed'] is False
          assert len(d['receipt_sha256'])==64
          assert 'not production' in Path('/tmp/retally-phase4/index.html').read_text().lower()
          print('Scope: synthetic Python modules, NOT production or bank evidence')
          print('Executed labs:',d['executed_labs'])
          print('Blocked labs:',d['failed_or_blocked_labs'])
          PY
      - name: Confirm no external payment provider or hosted customer impact
        run: |
          python - <<'PY'
          from freight.lab_phase4_mock_provider import MockProviderLedger
          from freight.lab_phase4_experiments import load_findings,select_experiments
          assert len(select_experiments(load_findings(),max_experiments=4))==4
          assert MockProviderLedger.__module__=="freight.lab_phase4_mock_provider"
          print("Boun​ded local campaign; mock SQLite only, no provider network calls")
          PY
      - name: Upload generated research-only dashboard and receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: retally-phase4-research-dashboard
          path: |
            /tmp/retally-phase4/index.html
            /tmp/retally-phase4/phase4_control.json
          if-no-files-found: error
          retention-days: 14
      - name: Preserve audit registry and earlier research gates
        run: PYTHONPATH=. python -m pytest -q freight/test_lab_hunter_research_registry.py freight/test_lab_phase2_existing_settlement_bridge.py
      - name: Prevent accidental action claims
        run: |
          echo 'No database/network outside isolated synthetic fixtures.'
          echo 'No Floot production app, external carrier/bank/customer, or scheduled actions.'
