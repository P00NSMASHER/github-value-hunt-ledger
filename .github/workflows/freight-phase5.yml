name: RETALLY Phase 5 Disposable PostgreSQL Financial Acceptance
on:
  pull_request:
    paths:
      - 'freight/phase5/**'
      - '.github/workflows/freight-phase5.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: retally
          POSTGRES_PASSWORD: synthetic-ci-only-password
          POSTGRES_DB: retally_phase5_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U retally -d retally_phase5_ci"
          --health-interval 4s
          --health-timeout 4s
          --health-retries 20
    env:
      RETALLY_PHASE5_CI_DSN: postgresql://retally:synthetic-ci-only-password@localhost:5432/retally_phase5_ci
    steps:
      - name: Checkout exact proposed revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install pinned independent test dependencies
        run: |
          python -m pip install -r production/requirements-ci.txt
          python -m pip install 'psycopg[binary]==3.2.9' 'cryptography==46.0.4'
      - name: Execute genuine PostgreSQL concurrent callback and evidence tests
        run: PYTHONPATH=. python -m pytest -q -rs freight/phase5/test_isolated_postgres.py
      - name: Execute signed synthetic cash, reversal, fee and refund in disposable PostgreSQL
        run: PYTHONPATH=. python -m pytest -q -rs freight/phase5/test_phase5c_postgres.py
      - name: Reproduce owner-DML signature bypass and assert revoked signer is blocked
        run: PYTHONPATH=. python -m pytest -q -rs freight/phase5/test_phase5e_admission_boundary.py
      - name: Exercise restricted financial database roles and explicit crypto bypass
        run: PYTHONPATH=. python -m pytest -q -rs freight/phase5/test_phase5f_roles.py
      - name: Verify Phase 4 laboratory stack and Ed25519 source boundaries
        run: |
          PYTHONPATH=. python -m pytest -q -rs \
            freight/test_lab_phase4_director.py \
            freight/test_lab_phase4_experiments.py \
            freight/test_lab_phase4_mock_provider.py \
            freight/test_lab_phase3_trust.py \
            freight/test_lab_phase3_simulated_pilot.py \
            freight/test_lab_phase3_real_chain.py
      - name: Preserve all 26 historical unresolved findings
        run: PYTHONPATH=. python -m pytest -q freight/test_lab_hunter_research_registry.py
      - name: Mark simulated-only scope
        run: |
          echo 'PostgreSQL is a disposable GitHub Actions service, NOT hosted Floot production.'
          echo 'Real isolated QA cluster separately verified; provider events use SIM-only IDs.'
          echo 'No signed real buyer/bank/carrier authority, no production revenue, no historical auto-closure.'
