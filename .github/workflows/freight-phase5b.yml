name: RETALLY Phase 5B Hosted-QA Evidence Boundary
on:
  pull_request:
    paths:
      - 'freight/phase5/phase5b_*'
      - 'freight/phase5/PHASE5B_APPLICATION_ACCEPTANCE.md'
      - 'freight/phase5/test_phase5b_handler_acceptance.py'
      - '.github/workflows/freight-phase5b.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Exact-head checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install exact pinned research dependencies
        run: python -m pip install -r production/requirements-ci.txt
      - name: Audit the staging observation's limitations
        run: PYTHONPATH=. python -W error::ResourceWarning -m unittest -v freight.phase5.test_phase5b_handler_acceptance
      - name: Preserve earlier experiment and historical-register regressions
        run: PYTHONPATH=. python -m pytest -q freight/test_lab_phase4_experiments.py freight/test_lab_phase4_mock_provider.py freight/test_lab_hunter_research_registry.py
      - name: Explicit host acceptance boundary
        run: |
          echo 'CI verifies stored QA observations, not live Floot PostgreSQL.'
          echo 'Live endpoint HTTP and database tests were separately observed on unpublished QA.'
          echo 'No production writes, no authenticated external carrier/bank source, no historical closure.'
