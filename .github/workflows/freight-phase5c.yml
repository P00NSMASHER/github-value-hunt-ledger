name: RETALLY Phase 5C Signed Cash and Contingency Proof
on:
  pull_request:
    paths:
      - 'freight/phase5/phase5c_*'
      - 'freight/phase5/test_phase5c_oracle.py'
      - '.github/workflows/freight-phase5c.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  independent-synthetic-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact draft head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Configure Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install pinned independent verifier
        run: |
          python -m pip install -r production/requirements-ci.txt
          python -m pip install cryptography==46.0.4
      - name: Independently verify signed PostgreSQL fixture and negative mutations
        run: |
          PYTHONPATH=. python -m pytest -q -rs freight/phase5/test_phase5c_oracle.py
          PYTHONPATH=. python -m freight.phase5.phase5c_oracle > /tmp/retally-phase5c-verification.json
          python - <<'PY'
          import json
          from pathlib import Path
          receipt=json.loads(Path('/tmp/retally-phase5c-verification.json').read_text())
          assert receipt['status']=='PASS_SIGNED_SYNTHETIC_QA_ONLY'
          assert receipt['real_customer_recovery_cents']==0
          assert receipt['historical_findings_closed']==0
          t=receipt['totals']
          assert (t['net_recovered_cents'],t['net_earned_fee_cents'],t['fee_refunded_cents'])==(500,150,100)
          print('Synthetic signed financial replay, not authentic customer settlement.')
          PY
      - name: Regression of actual settlement and historic finding controls
        run: PYTHONPATH=. python -m pytest -q freight/test_lab_phase3_real_chain.py freight/test_lab_phase4_experiments.py freight/test_lab_hunter_research_registry.py
      - name: Preserve all unresolved boundaries
        run: |
          echo 'No production data, real bank/carrier keys or customer records.'
          echo 'QA signed material is fictional, not full hosted financial certification.'
