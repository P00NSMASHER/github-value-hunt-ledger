name: RETALLY Phase 5D Original Defect and No-Recovery Staging Evidence
on:
  pull_request:
    paths:
      - 'freight/phase5/phase5d_*'
      - 'freight/phase5/test_phase5d_*'
      - 'freight/phase5/phase5e_*'
      - 'freight/phase5/test_phase5e_*'
      - '.github/workflows/freight-phase5d.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase5d-historical-and-staged-no-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Configure Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install pinned verifier dependencies
        run: |
          python -m pip install -r production/requirements-ci.txt
          python -m pip install cryptography==46.0.4
      - name: Check original D-07 repair receipt metadata, not original source execution
        run: PYTHONPATH=. python -m pytest -q -rs freight/phase5/test_phase5d_d07_receipt.py
      - name: Independently verify isolated signed no-recovery customers B and C
        run: PYTHONPATH=. python -m pytest -q -rs freight/phase5/test_phase5d_bc_qa.py
      - name: Preserve actual staged fictional Customer A financial oracle and three-customer model
        run: |
          PYTHONPATH=. python -m pytest -q -rs freight/phase5/test_phase5c_oracle.py freight/phase5/test_phase5c_control_overlay.py
          PYTHONPATH=. python -m pytest -q -rs freight/test_lab_phase3_simulated_pilot.py freight/test_lab_hunter_research_registry.py
      - name: Build enhanced existing owner control center with three fictional QA cases
        run: |
          PYTHONPATH=. python -m pytest -q -rs freight/phase5/test_phase5d_control_overlay.py
          PYTHONPATH=. python -m freight.phase5.phase5d_control_overlay --out /tmp/retally-phase5d
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('/tmp/retally-phase5d/phase5d_executive.json').read_text())
          assert d['phase5d']['accepted_real_customer_count']==0
          assert d['phase5d']['customer_B']['fee_earned_cents']==0
          assert d['phase5d']['customer_C']['fee_earned_cents']==0
          assert d['phase5d']['d07_historical_register_status']=='OPEN_UNVERIFIED'
          print('Three customer evidence classifications; no real financial claims')
          PY
      - name: Preserve exact-head research dashboard and evidence JSON
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: retally-phase5d-original-defect-three-customer-dashboard
          path: |
            /tmp/retally-phase5d/index.html
            /tmp/retally-phase5d/phase5d_executive.json
          if-no-files-found: error
          retention-days: 14
      - name: Verify Phase 5E signer admission receipt and update operator dashboard
        run: |
          PYTHONPATH=. python -m pytest -q -rs freight/phase5/test_phase5e_receipt.py freight/phase5/test_phase5e_control_overlay.py
          PYTHONPATH=. python -m freight.phase5.phase5e_control_overlay --out /tmp/retally-phase5e
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('/tmp/retally-phase5e/phase5e_executive.json').read_text())
          assert data['phase5e']['direct_owner_sql_signature_bypass']=='OPEN_UNMITIGATED'
          assert data['phase5e']['historical_findings_closed']==0
          assert data['phase5e']['real_customer_recovery_cents']==0
          print('Both revoked-signer repair and direct-owner bypass remain independently labeled')
          PY
      - name: Preserve final evidence-labeled Phase 5E dashboard
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: retally-phase5e-financial-evidence-boundary-dashboard
          path: |
            /tmp/retally-phase5e/index.html
            /tmp/retally-phase5e/phase5e_executive.json
          if-no-files-found: error
          retention-days: 14
      - name: Enforce release and original-source boundaries
        run: |
          echo 'D-07 original before/after executed separately on exact recovered archive, not in CI.'
          echo 'Customer B/C contracts and zero-cash rows came from actual unpublished Floot QA PostgreSQL.'
          echo 'GitHub CI cryptographically checks frozen QA documents but does not reconnect to Floot.'
          echo 'No real customer, carrier, bank, production finance, merge, deployment or scheduled task changes.'
