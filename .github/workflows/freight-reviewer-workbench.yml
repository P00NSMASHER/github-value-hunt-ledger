name: Freight Reviewer Workbench

on:
  push:
    paths:
      - 'freight/**'
      - 'production/requirements-ci.txt'
      - '.github/workflows/freight-reviewer-workbench.yml'
  pull_request:
    paths:
      - 'freight/**'
      - 'production/requirements-ci.txt'
      - '.github/workflows/freight-reviewer-workbench.yml'

permissions:
  contents: read

jobs:
  reviewer-handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check -r production/requirements-ci.txt
      - name: Offline renderer and strict buyer decision handoff
        run: PYTHONPATH=. python -m pytest -q freight/test_reviewer_workbench.py freight/test_buyer_review_workflow.py freight/test_audit_result_bundle.py
