name: RecoveryOS Public Sites

on:
  pull_request:
    paths:
      - 'freight/**'
      - 'recoveryworks/site/**'
      - 'company_sites/**'
      - '.github/workflows/freight-site-pages.yml'
  push:
    branches:
      - main
    paths:
      - 'freight/**'
      - 'recoveryworks/site/**'
      - 'company_sites/**'
      - '.github/workflows/freight-site-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: freight-recovery-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'production/requirements-ci.txt'
      - run: python -m pip install --disable-pip-version-check -r production/requirements-ci.txt
      - name: Verify controlled demo and public build
        run: >-
          PYTHONPATH=. python -m pytest -q
          freight/test_synthetic_rehearsal.py
          freight/test_synthetic_pilot_bundle.py
          freight/test_recovery_stack.py
          freight/test_commercial_terms.py
          freight/test_lead_qualification.py
          freight/test_recovery_engagement.py
          freight/site/test_build.py
          freight/site/test_worksheet.py
          freight/site/test_home_worksheet_discovery.py
          freight/site/test_social_preview.py
          freight/site/test_asset_integrity.py
          freight/site/test_live_audit_incident.py
          freight/site/test_verify_production_site.py
          freight/site/test_public_repo_privacy.py
          freight/site/test_rebase_public_urls.py
          freight/site/group/test_group.py
          freight/site/test_legacy_pages_canonical.py
          freight/marketing/test_indexnow_notify.py
          freight/brand/test_brand_finishing.py
          recoveryworks/test_public_site.py
      - name: Check browser script syntax
        run: |
          node --check freight/site/commercial-config.js
          node --check freight/site/site.js
          node --check freight/site/group/group.js
          node --check freight/site/worksheet.js
          node --check freight/site/ltl-evidence-comparator.js
          node --test freight/site/test_ltl_evidence_comparator.cjs
          node --test freight/site/test_worksheet.cjs
          node --test freight/site/test_worksheet_campaign.cjs
          node --check recoveryworks/site/site.js
      - name: Exercise the exact publication boundary
        env:
          FREIGHT_CONTACT_EMAIL: sales@freightfixture.com
          FREIGHT_CONTACT_VERIFIED: '1'
          FREIGHT_CONTINGENCY_RECOVERY_RATE: '0.30'
        run: |
          python freight/site/build.py --output /tmp/freight-recovery-public
          python -m freight.synthetic_pilot_bundle --verify /tmp/freight-recovery-public/synthetic-pilot-demo.zip
          test "$(find /tmp/freight-recovery-public -type f | wc -l)" -eq "$(python -c 'from freight.site.build import PUBLIC_FILES;print(len(PUBLIC_FILES))')"
          test "$(find /tmp/freight-recovery-public -mindepth 1 -maxdepth 1 -type f | wc -l)" -eq "$(python -c 'from freight.site.build import PUBLIC_FILES;print(sum("/" not in p for p in PUBLIC_FILES))')"
          test "$(find /tmp/freight-recovery-public -mindepth 1 -maxdepth 1 -type d | wc -l)" -eq 1
          test "$(find /tmp/freight-recovery-public -type l | wc -l)" -eq 0
          python -m freight.site.legacy_pages_canonical /tmp/freight-recovery-public
          grep -F 'rel="canonical" href="https://www.retallyrecovery.com/"' /tmp/freight-recovery-public/index.html
      - name: Exercise the RecoveryOS publication boundary
        env:
          RECOVERYOS_CONTACT_EMAIL: sales@recoveryfixture.com
          RECOVERYOS_CONTACT_VERIFIED: '1'
        run: |
          python recoveryworks/site/build.py --output /tmp/recoveryos-public
          test "$(find /tmp/recoveryos-public -type f | wc -l)" -eq 15
          test "$(find /tmp/recoveryos-public -type l | wc -l)" -eq 0
      - name: Verify independent company publication boundaries
        working-directory: company_sites
        run: |
          python -m unittest discover -s . -p 'test_*.py' -v
          python build.py group --output /tmp/retally-group-public
          python build.py recoveryworks --output /tmp/retally-recoveryworks-public
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          for company in ("group", "recoveryworks"):
              output = Path("/tmp") / f"retally-{company}-public"
              info = json.loads((output / "build-info.json").read_text())
              assert info["company"] == company
              assert info["source_commit"] == os.environ["GITHUB_SHA"]
              assert info["source_commit_kind"] == "git_commit"
              assert info["canonical_url"] == f"https://{company}.retallyrecovery.com/"
          PY
      - name: Validate actual Cloudflare Pages publication bundle
        env:
          FREIGHT_CONTACT_EMAIL: jay@retallyrecovery.com
          FREIGHT_CONTACT_VERIFIED: '1'
        run: |
          python -m freight.site.cloudflare_build
          test "$(find cf-retally-public -type f | wc -l)" -eq "$(python -c 'from freight.site.cloudflare_build import EXPECTED_FILES;print(EXPECTED_FILES)')"
          test "$(find cf-retally-public -type l | wc -l)" -eq 0
          grep -F 'https://www.retallyrecovery.com/' cf-retally-public/index.html
          grep -F 'jay@retallyrecovery.com' cf-retally-public/index.html

  deploy:
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main' &&
      vars.FREIGHT_CONTACT_VERIFIED == '1' &&
      vars.FREIGHT_CONTACT_EMAIL != ''
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - name: Build the public-only site
        env:
          FREIGHT_CONTACT_EMAIL: jay@retallyrecovery.com
          FREIGHT_CONTACT_VERIFIED: ${{ vars.FREIGHT_CONTACT_VERIFIED }}
          FREIGHT_CONTINGENCY_RECOVERY_RATE: ${{ vars.FREIGHT_CONTINGENCY_RECOVERY_RATE || '0.30' }}
          RECOVERYOS_CONTACT_EMAIL: jay@retallyrecovery.com
          RECOVERYOS_CONTACT_VERIFIED: ${{ vars.FREIGHT_CONTACT_VERIFIED }}
        run: |
          python freight/site/build.py --output /tmp/freight-recovery-public
          python recoveryworks/site/build.py --output /tmp/recoveryos-public
          mkdir /tmp/freight-recovery-public/recoveryos
          cp -R /tmp/recoveryos-public/. /tmp/freight-recovery-public/recoveryos/
          python -m freight.site.legacy_pages_canonical /tmp/freight-recovery-public
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: /tmp/freight-recovery-public
          retention-days: 1
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e

