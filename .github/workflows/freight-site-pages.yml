name: RecoveryOS Public Sites

on:
  pull_request:
    paths:
      - 'freight/**'
      - 'recoveryworks/site/**'
      - '.github/workflows/freight-site-pages.yml'
  push:
    branches:
      - main
    paths:
      - 'freight/**'
      - 'recoveryworks/site/**'
      - '.github/workflows/freight-site-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: freight-recovery-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'production/requirements-ci.txt'
      - run: python -m pip install --disable-pip-version-check -r production/requirements-ci.txt
      - name: Verify controlled demo and public build
        run: >-
          PYTHONPATH=. python -m pytest -q
          freight/test_synthetic_rehearsal.py
          freight/test_synthetic_pilot_bundle.py
          freight/site/test_build.py
          recoveryworks/test_public_site.py
      - name: Check browser script syntax
        run: |
          node --check freight/site/site.js
          node --check recoveryworks/site/site.js
      - name: Exercise the exact publication boundary
        env:
          FREIGHT_CONTACT_EMAIL: sales@freightfixture.com
          FREIGHT_CONTACT_VERIFIED: '1'
        run: |
          python freight/site/build.py --output /tmp/freight-recovery-public
          python -m freight.synthetic_pilot_bundle --verify /tmp/freight-recovery-public/synthetic-pilot-demo.zip
          test "$(find /tmp/freight-recovery-public -type f | wc -l)" -eq 33
          test "$(find /tmp/freight-recovery-public -mindepth 1 -maxdepth 1 -type f | wc -l)" -eq 5
          test "$(find /tmp/freight-recovery-public -mindepth 1 -maxdepth 1 -type d | wc -l)" -eq 1
          test "$(find /tmp/freight-recovery-public -type l | wc -l)" -eq 0
      - name: Exercise the RecoveryOS publication boundary
        env:
          RECOVERYOS_CONTACT_EMAIL: sales@recoveryfixture.com
          RECOVERYOS_CONTACT_VERIFIED: '1'
        run: |
          python recoveryworks/site/build.py --output /tmp/recoveryos-public
          test "$(find /tmp/recoveryos-public -type f | wc -l)" -eq 15
          test "$(find /tmp/recoveryos-public -type l | wc -l)" -eq 0

  deploy:
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main' &&
      vars.FREIGHT_CONTACT_VERIFIED == '1' &&
      vars.FREIGHT_CONTACT_EMAIL != ''
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - name: Build the public-only site
        env:
          FREIGHT_CONTACT_EMAIL: ${{ vars.FREIGHT_CONTACT_EMAIL }}
          FREIGHT_CONTACT_VERIFIED: ${{ vars.FREIGHT_CONTACT_VERIFIED }}
          RECOVERYOS_CONTACT_EMAIL: ${{ vars.FREIGHT_CONTACT_EMAIL }}
          RECOVERYOS_CONTACT_VERIFIED: ${{ vars.FREIGHT_CONTACT_VERIFIED }}
        run: |
          python freight/site/build.py --output /tmp/freight-recovery-public
          python recoveryworks/site/build.py --output /tmp/recoveryos-public
          mkdir /tmp/freight-recovery-public/recoveryos
          cp -R /tmp/recoveryos-public/. /tmp/freight-recovery-public/recoveryos/
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: /tmp/freight-recovery-public
          retention-days: 1
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
