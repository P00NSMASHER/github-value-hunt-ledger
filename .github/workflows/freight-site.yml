name: Freight Site Contracts

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'freight/site/**'
      - '.github/workflows/freight-site.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'freight/site/**'
      - '.github/workflows/freight-site.yml'

permissions:
  contents: read

concurrency:
  group: freight-site-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Publication-boundary tests
        run: python freight/site/test_build.py
      - name: JavaScript syntax
        run: node --check freight/site/site.js
      - name: Build exact public bundle
        env:
          FREIGHT_CONTACT_EMAIL: sales@freightfixture.com
          FREIGHT_CONTACT_VERIFIED: '1'
        run: |
          python freight/site/build.py --output "$RUNNER_TEMP/freight-site-public"
          test "$(find "$RUNNER_TEMP/freight-site-public" -maxdepth 1 -type f | wc -l | tr -d ' ')" = "4"
          test -f "$RUNNER_TEMP/freight-site-public/index.html"
          test -f "$RUNNER_TEMP/freight-site-public/site.css"
          test -f "$RUNNER_TEMP/freight-site-public/site.js"
          test -f "$RUNNER_TEMP/freight-site-public/_headers"
