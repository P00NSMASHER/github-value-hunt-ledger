name: RecoveryOS Unified Five Step Synthetic Domain Gate
on:
  pull_request:
    paths:
      - 'freight/unified_labs_domain_bridge.py'
      - 'freight/test_unified_labs_domain_bridge.py'
      - 'freight/UNIFIED_LABS.md'
      - '.github/workflows/freight-unified-five-step.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  domain-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout immutable head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install pinned repository test dependencies
        run: python -m pip install -r production/requirements-ci.txt
      - name: Execute actual RecoveryOS Python rating and payment objects
        run: PYTHONPATH=. python -m pytest -q freight/test_unified_labs_domain_bridge.py
      - name: Safety boundary
        run: |
          echo 'Synthesized evidence only, live customer/settlement proof not tested.'
          echo 'No production database, customer contact, carrier requests, payments or deployment.'
