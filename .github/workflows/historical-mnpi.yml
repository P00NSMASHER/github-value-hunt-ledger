name: Historical MNPI Research

on:
  push:
    paths:
      - "historical_mnpi/**"
      - ".github/workflows/historical-mnpi.yml"
  pull_request:
    paths:
      - "historical_mnpi/**"
      - ".github/workflows/historical-mnpi.yml"

permissions:
  contents: read

jobs:
  source-registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Compile
        run: python -m compileall -q historical_mnpi
      - name: Test source registry
        run: python -m unittest historical_mnpi.test_source_registry -v
