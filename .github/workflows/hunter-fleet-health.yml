name: Hunter Fleet Health

on:
  schedule:
    - cron: "37 * * * *"
  # Event-driven fallback: verify every completed authenticated recovery
  # scout, including a failed worker; do not rely solely on cron delivery.
  # This is not another recurring scout timer or a modification to its crons.
  workflow_run:
    workflows: ["Active Project Technology Scouts"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - ".github/workflows/hunter-fleet-health.yml"
      - "tools/hunter_fleet_health.py"
      - "tests/test_hunter_fleet_health.py"
  workflow_dispatch:
    inputs:
      inject_failure:
        description: Prove the monitor fails closed
        required: false
        default: false
        type: boolean

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: hunter-fleet-health
  cancel-in-progress: true

jobs:
  audit:
    # This workflow also observes scheduled scouts; avoid noisy duplicate
    # audits on those events while retaining the existing hourly timer.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.event == 'repository_dispatch' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m unittest tests.test_hunter_fleet_health -v
      - name: Audit live fleet
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INJECT: ${{ inputs.inject_failure }}
        shell: bash
        run: |
          set +e
          args=()
          [ "$INJECT" = true ] && args+=(--inject-failure)
          python -m tools.hunter_fleet_health "${args[@]}"
          status=$?
          cat hunter-fleet-health.md >> "$GITHUB_STEP_SUMMARY"
          exit $status
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hunter-fleet-health-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            hunter-fleet-health.json
            hunter-fleet-health.md
          retention-days: 30
          if-no-files-found: error
