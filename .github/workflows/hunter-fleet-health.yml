name: Hunter Fleet Health

on:
  schedule:
    - cron: "37 * * * *"
  workflow_dispatch:
    inputs:
      inject_failure:
        description: Prove the monitor fails closed
        required: false
        default: false
        type: boolean

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: hunter-fleet-health
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m unittest tests.test_hunter_fleet_health -v
      - name: Audit live fleet
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INJECT: ${{ inputs.inject_failure }}
        shell: bash
        run: |
          set +e
          args=()
          [ "$INJECT" = true ] && args+=(--inject-failure)
          python -m tools.hunter_fleet_health "${args[@]}"
          status=$?
          cat hunter-fleet-health.md >> "$GITHUB_STEP_SUMMARY"
          exit $status
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hunter-fleet-health-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            hunter-fleet-health.json
            hunter-fleet-health.md
          retention-days: 30
          if-no-files-found: error
