name: inspect 402ad free form
on:
  push:
    branches:
      - ops/x402-free-distribution-20261002
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect public free submit form wiring
        shell: python
        run: |
          import re, urllib.request
          base='https://402.ad'
          html=urllib.request.urlopen(base+'/submit',timeout=30).read().decode('utf-8','replace')
          print('HTML_LEN',len(html))
          scripts=re.findall(r'<script[^>]+src=["\\\']([^"\\\']+)["\\\']',html)
          print('SCRIPTS',scripts)
          for src in scripts:
            u=src if src.startswith('http') else base+src
            try:
              js=urllib.request.urlopen(u,timeout=30).read().decode('utf-8','replace')
            except Exception as exc:
              print('FETCH_ERR',u,type(exc).__name__,exc); continue
            hits=set()
            for pat in [r'["\\\']([^"\\\']*(?:submit|submission)[^"\\\']*)["\\\']',r'fetch\\(([^)]{1,300})\\)',r'axios\\.post\\(([^)]{1,300})\\)']:
              for m in re.finditer(pat,js,re.I):
                hits.add(m.group(0)[:500])
            if hits:
              print('BUNDLE',u,'HITS',len(hits))
              for h in sorted(hits):
                print('HIT',h)
