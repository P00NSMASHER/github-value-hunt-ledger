name: Integrator sync helper

on:
  push:
    branches: [main]
    paths:
      - '.github/integrator_sync_payload.md'

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preserve triggered payload and update checkout
        shell: bash
        run: |
          cp .github/integrator_sync_payload.md /tmp/integrator_sync_payload.md
          git pull --rebase origin main
      - name: Apply integrator payload
        shell: bash
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          text = Path('/tmp/integrator_sync_payload.md').read_text()
          lines = text.splitlines()
          if not lines or not lines[0].startswith('MARKER: '):
              raise SystemExit('payload must start with MARKER: ')
          marker = lines[0][len('MARKER: '):].strip()
          body = '\n'.join(lines[1:])
          pattern = re.compile(r'^=== (APPEND|REPLACE|SUBSTITUTE) (.+?) ===$', re.M)
          matches = list(pattern.finditer(body))
          if not matches:
              raise SystemExit('payload contains no operations')

          changed = []
          for i, match in enumerate(matches):
              mode, rel = match.group(1), match.group(2)
              start = match.end()
              end = matches[i + 1].start() if i + 1 < len(matches) else len(body)
              content = body[start:end].strip()
              path = Path(rel)
              current = path.read_text() if path.exists() else ''

              if mode == 'APPEND':
                  if marker in current:
                      continue
                  desired = current.rstrip() + '\n\n' + marker + '\n' + content + '\n'
              elif mode == 'REPLACE':
                  desired = content.rstrip() + '\n'
              else:
                  delimiter = '\n--- NEW ---\n'
                  if delimiter not in content:
                      raise SystemExit(f'SUBSTITUTE {rel} requires --- NEW --- delimiter')
                  old, new = content.split(delimiter, 1)
                  old = old.strip()
                  new = new.strip()
                  count = current.count(old)
                  if count == 0:
                      # Treat an already-applied substitution as idempotent.
                      if new in current:
                          continue
                      raise SystemExit(f'SUBSTITUTE text not found in {rel}')
                  if count != 1:
                      raise SystemExit(f'SUBSTITUTE text occurs {count} times in {rel}')
                  desired = current.replace(old, new, 1)

              if current == desired:
                  continue
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(desired)
              changed.append(rel)

          Path('.integrator_sync_changed').write_text('\n'.join(changed) + ('\n' if changed else ''))
          PY
      - name: Commit integrator updates
        shell: bash
        run: |
          if [ ! -s .integrator_sync_changed ]; then
            echo 'Nothing new to apply.'
            exit 0
          fi
          git config user.name 'github-value-hunt-integrator'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          while IFS= read -r file || [ -n "$file" ]; do git add "$file"; done < .integrator_sync_changed
          git commit -m 'Integrator portfolio synthesis and search direction'
          git pull --rebase origin main
          git push
