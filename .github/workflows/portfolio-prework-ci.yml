name: Portfolio Prework CI

on:
  push:
    branches:
      - portfolio-parallel-prep
    paths:
      - "portfolio_prework/**"
      - ".github/workflows/portfolio-prework-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot-generator-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run portfolio prework unit tests
        run: python -m unittest portfolio_prework/test_build_portfolio_snapshot.py
