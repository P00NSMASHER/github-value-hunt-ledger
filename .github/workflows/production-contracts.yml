name: Production Contract Tests

on:
  push:
    paths:
      - 'production/prototype.py'
      - 'production/test_prototype.py'
      - '.github/workflows/production-contracts.yml'
  pull_request:
    paths:
      - 'production/prototype.py'
      - 'production/test_prototype.py'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip pytest
      - run: cd production && python -m pytest -q test_prototype.py
