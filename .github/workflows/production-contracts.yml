name: Production Contract Tests

on:
  push:
    paths:
      - 'production/prototype.py'
      - 'production/test_prototype.py'
      - 'production/requirements-ci.txt'
      - '.github/workflows/production-contracts.yml'
  pull_request:
    paths:
      - 'production/prototype.py'
      - 'production/test_prototype.py'
      - 'production/requirements-ci.txt'
      - '.github/workflows/production-contracts.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'production/requirements-ci.txt'
      - run: python -m pip install --disable-pip-version-check -r production/requirements-ci.txt
      - run: cd production && python -m pytest -q test_prototype.py
