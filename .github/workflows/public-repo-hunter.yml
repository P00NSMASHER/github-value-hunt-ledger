name: Active Project Technology Scouts
# Provider-visible worker/slot identity permits exact missed-run reconciliation.
run-name: >-
  Hunter ${{ github.event.schedule || github.event.client_payload.worker || inputs.worker || 'SOURCE_PUSH' }} slot=${{ github.event.client_payload.scheduled_slot || 'native' }}

on:
  # One bounded source-run when this workflow/manifest is changed on main.
  # This is not a new schedule and cannot run for unrelated commits.
  push:
    branches: [main]
    paths:
      - '.github/workflows/public-repo-hunter.yml'
      - 'automation/hunter_schedule.json'
  workflow_dispatch:
    inputs:
      worker:
        description: Active project research worker
        required: true
        default: ALL
        type: choice
        options:
          - ALL
          - HUNTER-01
          - HUNTER-02
          - HUNTER-03
          - HUNTER-04
          - HUNTER-05
          - HUNTER-06
          - HUNTER-07
          - HUNTER-08
          - HUNTER-09
          - HUNTER-10
          - HUNTER-11
          - HUNTER-12
          - HUNTER-13
          - HUNTER-14
          - INTEGRATOR
  repository_dispatch:
    types: [retally-scout-recovery-v1]
  schedule:
    - cron: "7 2,14 * * *"
    - cron: "15 2,14 * * *"
    - cron: "23 2,14 * * *"
    - cron: "31 2,14 * * *"
    - cron: "39 2,14 * * *"
    - cron: "47 2,14 * * *"
    - cron: "55 2,14 * * *"
    - cron: "3 3,15 * * *"
    - cron: "11 3,15 * * *"
    - cron: "19 3,15 * * *"
    - cron: "27 3,15 * * *"
    - cron: "35 3,15 * * *"
    - cron: "43 3,15 * * *"
    - cron: "51 3,15 * * *"
    - cron: "7 4,16 * * *"

permissions:
  contents: write
  pull-requests: read

concurrency:
  # Preserve this lock identifier so in-flight old and new jobs cannot overlap.
  group: starblox-roblox-accelerator-main-writer
  cancel-in-progress: false

jobs:
  scout:
    if: >-
      github.event_name != 'repository_dispatch' ||
      (github.actor == 'portfolio-brain-v8-runtime[bot]' &&
       github.event.client_payload.expected_main == github.sha)
    outputs:
      worker: ${{ steps.route.outputs.worker }}
      proposal_ready: ${{ steps.persist.outputs.proposal_ready }}
      branch: ${{ steps.persist.outputs.branch }}
      base_sha: ${{ steps.persist.outputs.base_sha }}
      head_sha: ${{ steps.persist.outputs.head_sha }}
      semantic_fingerprint: ${{ steps.persist.outputs.semantic_fingerprint }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Resolve role
        id: route
        shell: bash
        env:
          SCHEDULE: ${{ github.event.schedule }}
          MANUAL: ${{ inputs.worker }}
          EVENT_NAME: ${{ github.event_name }}
          RECOVERY_WORKER: ${{ github.event.client_payload.worker }}
          RECOVERY_SLOT: ${{ github.event.client_payload.scheduled_slot }}
          RECOVERY_MAIN: ${{ github.event.client_payload.expected_main }}
          EVENT_SHA: ${{ github.sha }}
          EVENT_ACTOR: ${{ github.actor }}
        run: |
          worker="$MANUAL"
          if [ "$EVENT_NAME" = "schedule" ]; then worker=""; fi
          if [ "$EVENT_NAME" = "repository_dispatch" ]; then
            test "$EVENT_ACTOR" = "portfolio-brain-v8-runtime[bot]" || { echo "Unauthorized recovery actor" >&2; exit 1; }
            test "$RECOVERY_MAIN" = "$EVENT_SHA" || { echo "Recovery main moved" >&2; exit 1; }
            [[ "$RECOVERY_WORKER" =~ ^(HUNTER-(0[1-9]|1[0-4])|INTEGRATOR)$ ]] || { echo "Invalid recovery worker" >&2; exit 1; }
            if [ -n "$RECOVERY_SLOT" ]; then
              [[ "$RECOVERY_SLOT" =~ ^20[0-9]{2}-[01][0-9]-[0-3][0-9]T[0-2][0-9]:[0-5][0-9]:00Z$ ]] || { echo "Invalid recovery slot format" >&2; exit 1; }
            fi
            worker="$RECOVERY_WORKER"
          fi
          case "$SCHEDULE" in
            "7 2,14 * * *") worker="HUNTER-01";;
            "15 2,14 * * *") worker="HUNTER-02";;
            "23 2,14 * * *") worker="HUNTER-03";;
            "31 2,14 * * *") worker="HUNTER-04";;
            "39 2,14 * * *") worker="HUNTER-05";;
            "47 2,14 * * *") worker="HUNTER-06";;
            "55 2,14 * * *") worker="HUNTER-07";;
            "3 3,15 * * *") worker="HUNTER-08";;
            "11 3,15 * * *") worker="HUNTER-09";;
            "19 3,15 * * *") worker="HUNTER-10";;
            "27 3,15 * * *") worker="HUNTER-11";;
            "35 3,15 * * *") worker="HUNTER-12";;
            "43 3,15 * * *") worker="HUNTER-13";;
            "51 3,15 * * *") worker="HUNTER-14";;
            "7 4,16 * * *") worker="INTEGRATOR";;
          esac
          if [ "$EVENT_NAME" = "schedule" ] && [ -z "$worker" ]; then
            echo "Unrecognized scheduled hunter route: $SCHEDULE" >&2
            exit 1
          fi
          # Never fan out to 14 workers from a push health-check.
          if [ "$EVENT_NAME" = "push" ]; then worker="HUNTER-01"; fi
          [ -n "$worker" ] || worker="ALL"
          echo "worker=$worker" >> "$GITHUB_OUTPUT"
      - name: Tests
        run: python -m unittest tests.test_public_repo_scout tests.test_ti_scout_noop -v
      - name: Scout
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          WORKER: ${{ steps.route.outputs.worker }}
        shell: bash
        run: |
          if [ "$WORKER" = "INTEGRATOR" ]; then
            python tools/public_repo_scout.py --integrate
          elif [ "$WORKER" = "ALL" ]; then
            python tools/public_repo_scout.py --worker ALL
            python tools/public_repo_scout.py --integrate
          else
            python tools/public_repo_scout.py --worker "$WORKER"
          fi
          # A single-worker smoke produces an honest, scope-filtered digest too.
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            python tools/public_repo_scout.py --integrate
          fi
      - name: Publish evidence-only effectiveness report
        shell: bash
        env:
          WORKER: ${{ steps.route.outputs.worker }}
        run: |
          set -euo pipefail
          python -m tools.hunter_effectiveness --output automation/HUNTER_EFFECTIVENESS.md
          {
            echo "## Scout execution evidence"
            echo "Run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "Event: ${GITHUB_EVENT_NAME}"
            echo "Worker: ${WORKER}"
            if [ "$GITHUB_EVENT_NAME" = schedule ]; then
              echo "Invocation: GitHub schedule event confirmed for this run"
            else
              echo "Invocation: NOT a scheduled run; scheduled execution remains unproven"
            fi
            echo
            cat automation/HUNTER_EFFECTIVENESS.md
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve worker evidence independently of PR publication
        if: ${{ steps.route.outputs.worker != 'INTEGRATOR' && steps.route.outputs.worker != 'ALL' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hunter-evidence-${{ steps.route.outputs.worker }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            intelligence/scout_queue/${{ steps.route.outputs.worker }}.json
            automation/HUNTER_EFFECTIVENESS.md
          retention-days: 7
          if-no-files-found: error

      # The Integrator intentionally has no source-inspection job. Keep an
      # independently inspectable receipt so it is still counted as executed.
      - name: Preserve integrator execution receipt
        if: ${{ steps.route.outputs.worker == 'INTEGRATOR' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hunter-integrator-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            automation/SCOUT_DIGEST.md
            automation/HUNTER_EFFECTIVENESS.md
          retention-days: 7
          if-no-files-found: error

      - name: Commit queue refresh
        id: persist
        env:
          WORKER: ${{ steps.route.outputs.worker }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -d intelligence/scout_queue ]; then
            git add -A -- intelligence/scout_queue
          fi
          if [ -f automation/SCOUT_DIGEST.md ]; then
            git add -- automation/SCOUT_DIGEST.md
          fi
          if [ -f automation/HUNTER_EFFECTIVENESS.md ]; then
            git add -- automation/HUNTER_EFFECTIVENESS.md
          fi
          # Compare actual evidence, not clocks/API telemetry. For a proposed
          # material update, reuse the already-open equivalent PR if any.
          git diff --cached --quiet && exit 0
          python -m tools.retally_scout_pr_dedupe
          if [ "$(sed -n 's/^proposal_duplicate=//p' "$GITHUB_OUTPUT" | tail -1)" = "true" ]; then
            echo "Existing pending Scout proposal already carries this evidence."
            exit 0
          fi
          git commit -m "automation: refresh ${WORKER} scout state"
          git pull --rebase origin main
          BRANCH="automation/retally-scout-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          BASE_SHA="$(git rev-parse HEAD^)"
          HEAD_SHA="$(git rev-parse HEAD)"
          git push origin "HEAD:refs/heads/$BRANCH"
          {
            echo "proposal_ready=true"
            echo "branch=$BRANCH"
            echo "base_sha=$BASE_SHA"
            echo "head_sha=$HEAD_SHA"
          } >> "$GITHUB_OUTPUT"


  submit-pr:
    needs: scout
    if: >-
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
       github.event_name == 'repository_dispatch' || github.event_name == 'push') &&
      github.ref == 'refs/heads/main' &&
      needs.scout.outputs.proposal_ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Verify scoped Scout evidence before requesting an App-authored PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROPOSED_BRANCH: ${{ needs.scout.outputs.branch }}
          PROPOSED_BASE: ${{ needs.scout.outputs.base_sha }}
          PROPOSED_HEAD: ${{ needs.scout.outputs.head_sha }}
          SCOUT_SEMANTIC_FINGERPRINT: ${{ needs.scout.outputs.semantic_fingerprint }}
        run: >-
          python -m tools.retally_automated_pr_proposal
          --lane scout
          --branch "$PROPOSED_BRANCH"
          --base-sha "$PROPOSED_BASE"
          --head-sha "$PROPOSED_HEAD"
      - name: Publish validated App proposal request
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: retally-app-request-v1
          path: ${{ runner.temp }}/retally-app-request.json
          retention-days: 1
          overwrite: true
          if-no-files-found: error

  # Separate, read-only research execution job; no V16 activation or writes.
  candidate-inspection:
    needs: scout
    if: >-
      needs.scout.result == 'success' &&
      needs.scout.outputs.worker != 'INTEGRATOR' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push' ||
       (github.event_name == 'repository_dispatch' &&
        github.actor == 'portfolio-brain-v8-runtime[bot]' &&
        github.event.client_payload.expected_main == github.sha))
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Download same-run, immutable scout queue
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: hunter-evidence-${{ needs.scout.outputs.worker }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hunter-scout-fresh
      - name: Verify source and delivery-acceptance regressions
        run: python -m unittest tests.test_hunter_source_inspection tests.test_hunter_delivery_acceptance -v
      - name: Inspect source at immutable commit without running third-party code
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HUNTER_ID: ${{ needs.scout.outputs.worker }}
        run: |
          python -m tools.hunter_source_inspection \
            --worker "$HUNTER_ID" \
            --queue-root "$RUNNER_TEMP/hunter-scout-fresh/intelligence/scout_queue" \
            --output hunter-source-inspection.json
      - name: Independently gate all claimed completed target changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m tools.hunter_delivery_acceptance --output hunter-delivery-acceptance.json
      - name: Preserve separately inspectable source and acceptance receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hunter-inspection-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            hunter-source-inspection.json
            hunter-delivery-acceptance.json
          retention-days: 7
          if-no-files-found: warn
