name: RecoveryWorks

on:
  push:
    paths:
      - "recoveryworks/**"
      - ".github/workflows/recoveryworks.yml"
  pull_request:
    paths:
      - "recoveryworks/**"
      - ".github/workflows/recoveryworks.yml"

permissions:
  contents: read

jobs:
  recoveryworks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Compile
        run: python -m compileall -q recoveryworks
      - name: Test RecoveryWorks
        run: python -m unittest discover -s recoveryworks -p "test_*.py" -v
