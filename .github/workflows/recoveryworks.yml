name: RecoveryWorks

on:
  push:
    branches: [main]
    paths:
      - "recoveryworks/**"
      - "deployment/oracle-always-free/**"
      - ".github/workflows/recoveryworks.yml"
  pull_request:
    paths:
      - "recoveryworks/**"
      - "deployment/oracle-always-free/**"
      - ".github/workflows/recoveryworks.yml"

permissions:
  contents: read

# Cancel only superseded PR checks. Main release evidence never cancels itself.
concurrency:
  group: safe-component-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  recoveryworks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install optional encrypted-backup verifier
        run: python -m pip install --disable-pip-version-check 'cryptography==45.0.7'
      - name: Compile
        run: python -m compileall -q recoveryworks
      - name: Test RecoveryWorks
        run: python -m unittest discover -s recoveryworks -p "test_*.py" -v
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"
      - name: Synthetic seven-branch customer acceptance
        run: python -m recoveryworks.seven_branch_simulation --workspace "$RUNNER_TEMP/retally-acceptance" --exercise
      - name: Install isolated browser test tools
        run: |
          npm install --no-save --prefix "$RUNNER_TEMP/retally-browser" playwright@1.51.1
          # GitHub-hosted ubuntu-latest includes browser system libraries.
          # Do not apt-install optional fonts through slow Azure mirrors on every PR.
          # The real desktop/mobile smoke job below still launches Chromium and fails if missing.
          node "$RUNNER_TEMP/retally-browser/node_modules/playwright/cli.js" install chromium
      - name: Desktop and mobile workbench acceptance
        env:
          NODE_PATH: ${{ runner.temp }}/retally-browser/node_modules
        run: |
          python -m recoveryworks.seven_branch_simulation --workspace "$RUNNER_TEMP/retally-ui" > "$RUNNER_TEMP/retally-ui-seed.log"
          python -m recoveryworks.workbench_server --workspace "$RUNNER_TEMP/retally-ui" --port 8765 > "$RUNNER_TEMP/retally-ui-server.log" 2>&1 &
          workbench_pid=$!
          trap 'kill "$workbench_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8765/ > /dev/null; then break; fi
            sleep 0.2
          done
          node recoveryworks/workbench_ui/smoke.cjs "$RUNNER_TEMP/retally-ui"

  private-acl-windows:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Verify owner-only Windows ACLs
        run: python -m unittest recoveryworks.test_private_io_windows_acl -v

  encrypted-backup-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install optional encrypted-backup verifier
        run: python -m pip install --disable-pip-version-check "cryptography==45.0.7"
      - name: Windows encrypted-backup, private ACL and role-key acceptance
        run: python -m unittest recoveryworks.test_offsite_archive recoveryworks.test_workbench_credentials recoveryworks.test_private_io_windows_acl -v

  oracle-staging-template:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Validate free-VM deployment scripts, isolation and release holds
        run: |
          bash -n deployment/oracle-always-free/install-staging.sh
          bash -n deployment/oracle-always-free/check-staging.sh
          python -m unittest discover -s deployment/oracle-always-free -p 'test_*.py' -v
          python - <<'PY'
          from pathlib import Path
          root = Path('deployment/oracle-always-free')
          unit = (root/'retally-synthetic.service').read_text()
          installer = (root/'install-staging.sh').read_text()
          tunnel = (root/'cloudflared-config.yml.example').read_text()
          workflow = Path('.github/workflows/recoveryworks.yml').read_text()
          trigger_config = workflow.split('permissions:', 1)[0]
          assert trigger_config.count('"deployment/oracle-always-free/**"') == 2
          assert 'recoveryworks.test_private_io_windows_acl -v' in workflow
          assert '  private-acl-windows:' in workflow
          assert '--workspace /var/lib/retally/synthetic-preview' in unit
          assert '--external-origin https://workbench.retallyrecovery.com' in unit
          assert '--port 18765' in unit
          assert 'User=retally' in unit and 'ProtectSystem=strict' in unit
          assert "('127.0.0.1', port)" in Path('recoveryworks/workbench_server.py').read_text()
          assert 'sudo systemctl start ' not in installer
          assert 'sudo systemctl enable ' not in installer
          assert 'REPLACE_WITH_APPROVED_TUNNEL_UUID' in tunnel
          assert 'required: true' in tunnel and 'http_status:404' in tunnel
          assert 'f282332ddcc68e93a7a5071881301b090acbf5df75e8177c11b8ee51bd9222f0' in tunnel
          assert not any(p.name in {'credentials.json', '.env', 'private-key.pem'} for p in root.rglob('*'))
          print('PASS: staging scripts parse; source stays loopback; access and release holds preserved.')
          PY

  oracle-micro-memory-rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Real seven-branch synthetic acceptance inside 768 MiB isolation
        run: |
          set -eu
          docker run --rm \
            --network none --read-only --cap-drop ALL --security-opt no-new-privileges \
            --user 65534:65534 --memory 768m --memory-swap 768m --cpus 0.125 \
            --pids-limit 128 --tmpfs /tmp:rw,nosuid,nodev,mode=1777,size=192m \
            -e RETALLY_SYNTHETIC_ONLY=1 -e PYTHONDONTWRITEBYTECODE=1 \
            -e PYTHONUNBUFFERED=1 -v "$PWD:/repo:ro" -w /repo \
            python:3.11-slim-bookworm \
            python deployment/oracle-always-free/micro-memory-smoke.py

  oci-encrypted-storage-synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install optional audited archive cryptography
        run: python -m pip install --disable-pip-version-check "cryptography==45.0.7"
      - name: Test fail-closed OCI storage transport and real seven-branch synthetic restoration
        run: |
          python -m py_compile deployment/oracle-always-free/oci_synthetic_backup.py
          python -m unittest discover -s deployment/oracle-always-free -p 'test_oci_synthetic_backup.py' -v
