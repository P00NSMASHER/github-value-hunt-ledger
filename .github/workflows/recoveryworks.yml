name: RecoveryWorks

on:
  push:
    branches: [main]
    paths:
      - "recoveryworks/**"
      - ".github/workflows/recoveryworks.yml"
  pull_request:
    paths:
      - "recoveryworks/**"
      - ".github/workflows/recoveryworks.yml"

permissions:
  contents: read

# Cancel only superseded PR checks. Main release evidence never cancels itself.
concurrency:
  group: safe-component-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  recoveryworks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Compile
        run: python -m compileall -q recoveryworks
      - name: Test RecoveryWorks
        run: python -m unittest discover -s recoveryworks -p "test_*.py" -v
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"
      - name: Synthetic seven-branch customer acceptance
        run: python -m recoveryworks.seven_branch_simulation --workspace "$RUNNER_TEMP/retally-acceptance" --exercise
      - name: Install isolated browser test tools
        run: |
          npm install --no-save --prefix "$RUNNER_TEMP/retally-browser" playwright@1.51.1
          node "$RUNNER_TEMP/retally-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Desktop and mobile workbench acceptance
        env:
          NODE_PATH: ${{ runner.temp }}/retally-browser/node_modules
        run: |
          python -m recoveryworks.seven_branch_simulation --workspace "$RUNNER_TEMP/retally-ui" > "$RUNNER_TEMP/retally-ui-seed.log"
          python -m recoveryworks.workbench_server --workspace "$RUNNER_TEMP/retally-ui" --port 8765 > "$RUNNER_TEMP/retally-ui-server.log" 2>&1 &
          workbench_pid=$!
          trap 'kill "$workbench_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8765/ > /dev/null; then break; fi
            sleep 0.2
          done
          node recoveryworks/workbench_ui/smoke.cjs "$RUNNER_TEMP/retally-ui"
