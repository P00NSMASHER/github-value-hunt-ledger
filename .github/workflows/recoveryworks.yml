name: RecoveryWorks

on:
  push:
    paths:
      - "recoveryworks/**"
      - ".github/workflows/recoveryworks.yml"
  pull_request:
    paths:
      - "recoveryworks/**"
      - ".github/workflows/recoveryworks.yml"

permissions:
  contents: read

jobs:
  recoveryworks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile
        run: python -m compileall -q recoveryworks
      - name: Test RecoveryWorks
        run: python -m unittest recoveryworks.test_recoveryworks -v
