name: RecoveryWorks

on:
  push:
    paths:
      - "recoveryworks/**"
      - ".github/workflows/recoveryworks.yml"
  pull_request:
    paths:
      - "recoveryworks/**"
      - ".github/workflows/recoveryworks.yml"

permissions:
  contents: read

jobs:
  recoveryworks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Compile
        run: python -m compileall -q recoveryworks
      - name: Test RecoveryWorks
        run: python -m unittest discover -s recoveryworks -p "test_*.py" -v

  container-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: recoveryworks
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Freeze container build inputs
        run: |
          python -m recoveryworks.container_build \
            --source-commit "$GITHUB_SHA" \
            --output /tmp/recoveryworks-build-manifest.json
      - name: Build digest-pinned production container
        run: |
          docker build \
            --file recoveryworks/deploy/Dockerfile.production \
            --build-arg RECOVERYWORKS_VCS_REF="$GITHUB_SHA" \
            --tag recoveryworks:ci \
            .
      - name: Verify source revision label
        run: |
          test "$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' recoveryworks:ci)" = "$GITHUB_SHA"
      - name: Smoke production container
        run: |
          docker run --rm \
            --network none \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --entrypoint python \
            recoveryworks:ci \
            -c "import recoveryworks; import recoveryworks.pilot_runner; import recoveryworks.production_deployment; print('recoveryworks-container-smoke-ok')"
