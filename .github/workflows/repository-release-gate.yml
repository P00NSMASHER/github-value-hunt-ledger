name: Repository Release Gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-release-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ai-business-os:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Compile canonical AI Business OS
        run: python -m compileall -q ai_business_os
      - name: Run canonical AI Business OS suite
        run: python -m unittest discover -s ai_business_os -p "test_*.py" -v

  freight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install pinned Freight test dependencies
        run: python -m pip install --disable-pip-version-check -r production/requirements-ci.txt
      - name: Compile Freight
        run: python -m compileall -q freight
      - name: Check public GitHub source for private contact data
        run: python -m unittest freight.site.test_public_repo_privacy -v
      - name: Run Freight regression suite
        run: python -m unittest discover -s freight -p "test_*.py" -v
      - name: Run complete Freight pytest suite
        run: PYTHONPATH=. python -m pytest -q freight
      # Additional source-pinned technical outcome evidence for the Brain
      # experiment. Explicitly synthetic; not accepted first-customer proof.
      - name: Checkout exact PR source for synthetic invoice-review evidence
        if: ${{ github.event_name == 'pull_request' && hashFiles('freight/brain_review_measurement.py') != '' }}
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: synthetic-review-source
          persist-credentials: false
      - name: Produce source-pinned invoice-review tradeoff receipt
        if: ${{ github.event_name == 'pull_request' && hashFiles('freight/brain_review_measurement.py') != '' }}
        env:
          REVIEW_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C synthetic-review-source rev-parse HEAD)" = "$REVIEW_SOURCE_SHA"
          (cd synthetic-review-source && PYTHONPATH=. python -m freight.brain_review_measurement) > "$RUNNER_TEMP/retally-synthetic-review.json"
          python - "$RUNNER_TEMP/retally-synthetic-review.json" <<'PY'
          import json, re, sys
          with open(sys.argv[1], encoding="utf-8") as source:
              doc = json.load(source)
          assert doc["evidence_kind"] == "SYNTHETIC_FIRST_PARTY_COMPARISON"
          assert doc["real_customer_outcome"] == "NOT_MEASURED"
          assert doc["production_deployed"] is False
          assert doc["validated_recovery_cents"] == 0
          assert doc["human_time_saved"] is None and doc["verified_revenue"] is None
          assert doc["summary"]["REVIEW_SCENARIO"] == {
              "cases": 5, "baseline_cases_flagged": 2, "candidate_cases_flagged": 5}
          assert doc["summary"]["KNOWN_BENIGN_SYNTHETIC_TRUTH"] == {
              "cases": 2, "baseline_cases_flagged": 0, "candidate_cases_flagged": 2}
          assert doc["summary"]["NONMATCH_CONTROL"] == {
              "cases": 5, "baseline_cases_flagged": 0, "candidate_cases_flagged": 0}
          assert len(doc["cases"]) == 12
          assert len(doc["source_sha256"]) == 5
          assert all(re.fullmatch("[0-9a-f]{64}", sha)
                     for sha in doc["source_sha256"].values())
          print("Synthetic review result: 2/5 to 5/5 positive designed cases;"
                " 0/2 to 2/2 known-benign review cases; customer value unknown")
          PY
      - name: Preserve exact-head synthetic review receipt (not customer evidence)
        if: ${{ github.event_name == 'pull_request' && hashFiles('freight/brain_review_measurement.py') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: retally-review-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/retally-synthetic-review.json
          if-no-files-found: error
          retention-days: 14
      - name: Verify pilot rights evidence consistency
        run: python -m freight.rights_evidence --stage pilot --expect CLEAR

  recoveryworks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Compile RecoveryWorks
        run: python -m compileall -q recoveryworks
      - name: Run RecoveryWorks regression suite
        run: python -m unittest discover -s recoveryworks -p "test_*.py" -v

  technology-intelligence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Run Technology Intelligence regression suite
        run: python -m unittest discover -s tests -p "test_ti_*.py" -v
      - name: Validate canonical intelligence ledgers
        run: python tools/ti_validate.py
      - name: Check committed text integrity
        run: git diff --check

  # Reuse the commercial proof suite at the caller revision; no deployment.
  freight-commercial:
    uses: ./.github/workflows/freight-contracts.yml
    permissions:
      contents: read

  release-gate:
    if: always()
    needs:
      - ai-business-os
      - freight
      - freight-commercial
      - recoveryworks
      - technology-intelligence
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every release lane to pass
        env:
          AI_BUSINESS_OS_RESULT: ${{ needs.ai-business-os.result }}
          FREIGHT_RESULT: ${{ needs.freight.result }}
          FREIGHT_COMMERCIAL_RESULT: ${{ needs.freight-commercial.result }}
          RECOVERYWORKS_RESULT: ${{ needs.recoveryworks.result }}
          TECHNOLOGY_INTELLIGENCE_RESULT: ${{ needs.technology-intelligence.result }}
        shell: bash
        run: |
          set -euo pipefail
          test "$AI_BUSINESS_OS_RESULT" = "success"
          test "$FREIGHT_RESULT" = "success"
          test "$FREIGHT_COMMERCIAL_RESULT" = "success"
          test "$RECOVERYWORKS_RESULT" = "success"
          test "$TECHNOLOGY_INTELLIGENCE_RESULT" = "success"
          echo "Repository release gate passed."
