name: RETALLY Extreme 100 Compound Synthetic E2E Red Team

on:
  pull_request:
    paths:
      - 'freight/redteam_deep_generator_20261022.py'
      - 'freight/redteam_deep_engine_20261022.py'
      - 'freight/redteam_v3_compound_chaos_20261023.py'
      - '.github/workflows/retally-100-compound-chaos-v3-20261023.yml'

permissions:
  contents: read

concurrency:
  group: retally-extreme-v3-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  hundred-compound-chaos:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout exact source without retaining credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Compile synthetic test sources
        run: python -m compileall -q freight/redteam_deep_generator_20261022.py freight/redteam_deep_engine_20261022.py freight/redteam_v3_compound_chaos_20261023.py
      - name: Run native six-mode ratings and 100 compound E2E chaos cases
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          RETALLY_V3_REPORT_DIR: retally-v3-output
        run: python -m freight.redteam_v3_compound_chaos_20261023
      - name: Verify custody and completeness without treating test findings as success
        if: always()
        run: |
          if [ ! -f retally-v3-output/v3_summary.json ]; then
            echo "Incomplete red-team run: no summary."
            exit 1
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          j=json.loads(Path("retally-v3-output/v3_summary.json").read_text())
          assert j["dataset_count"]==100 and j["unique_source_sha256"]==100
          assert j["real_customers"]==0 and j["actual_carrier_contacts"]==0
          assert j["money_moved"]==0
          print("RETALLY_V3_EVIDENCE",json.dumps(j,sort_keys=True))
          print("CI execution success is NOT commercial or engine acceptance.")
          PY
      - name: Upload synthetic sources and every case result including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: retally-extreme-v3-100-fictional-customer-evidence
          path: |
            retally-v3-output/v3_report.json
            retally-v3-output/v3_summary.json
            retally-v3-output/all_fictional_source_inputs.zip
          if-no-files-found: error
          retention-days: 7
      - name: Ensure no tracked production code modified by tests
        run: git diff --exit-code -- freight .github
