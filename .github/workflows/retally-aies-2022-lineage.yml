name: RETALLY Lab 14 AIES 2022 Historical Source Investigation
on:
  pull_request:
    paths:
      - '.github/workflows/retally-aies-2022-lineage.yml'
      - 'freight/research_aies_2022_lineage.py'
      - 'freight/test_research_aies_2022_lineage.py'
      - 'freight/research/AIES_2022_LEGACY_LINEAGE_20261011.json'
      - 'freight/RESEARCH_AIES_2022_LEGACY_LINEAGE.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  investigate-official-historical-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Inspect Census publisher historical ZIP and candidate 2022 cells without promotion
        run: |
          python - <<'PY'
          from hashlib import sha256
          from urllib.request import Request, urlopen
          from zipfile import ZipFile
          from io import BytesIO
          import csv, stat
          url='https://www2.census.gov/programs-surveys/aies/data/2024/API_Datasets/AIESTIMESERIES.zip'
          req=Request(url,headers={'User-Agent':'RETALLY-Lab14-2022-Historical-Research/1.0'})
          with urlopen(req,timeout=30) as response:
            if response.geturl()!=url:raise ValueError('unexpected redirect')
            raw=response.read(2_000_001)
          if len(raw)>2_000_000 or raw[:4]!=b'PK\x03\x04':
            raise ValueError('source exceeds safe ZIP bounds')
          print('SOURCE_ARCHIVE',len(raw),sha256(raw).hexdigest(),flush=True)
          with ZipFile(BytesIO(raw)) as z:
            for info in z.infolist():
              print('ARCHIVE_MEMBER',info.filename,'size',info.file_size,flush=True)
              if info.file_size>28_000_000 or '../' in info.filename:
                raise ValueError('unsafe source member')
              if not info.filename.lower().endswith(('.dat','.csv')):
                continue
              uncompressed=z.read(info)
              text=uncompressed.decode('utf-8-sig')
              csvrows=list(csv.DictReader(text.splitlines(),delimiter='|' if info.filename.lower().endswith('.dat') else ','))
              print('SOURCE_DATA',len(csvrows),'fields',len(csvrows[0]) if csvrows else 0,'header',list(csvrows[0])[:42] if csvrows else [],'data_sha256',sha256(uncompressed).hexdigest(),flush=True)
              hits=[]
              for row in csvrows:
                code=row.get('NAICS') or row.get('NAICS2017')
                if code in ('484','484121','484122') and row.get('YEAR') in ('2022','2023','2024') and row.get('GEO_ID')=='0100000US' and row.get('TYPOP')=='00' and row.get('TAXSTAT')=='00':
                  hits.append({k:row.get(k) for k in ('YEAR','NAICS','NAICS2017','NAICS_LABEL','NAICS2017_LABEL','RCPT_TOT_VAL','RCPT_TOT_VAL_F','RCPT_TOT_CV','RCPT_TOT_CV_F','ST','GEO_ID','GEO_ID_F','TYPOP','TAXSTAT')})
              print('SELECTED_NATIONAL_INDUSTRY_ROWS',len(hits),flush=True)
              for row in hits[:12]:print('SELECTED_SOURCE_ROW',row,flush=True)
          PY
