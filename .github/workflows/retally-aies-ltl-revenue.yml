name: RETALLY Lab 14 Census AIES LTL Revenue (Mission 18)
on:
  pull_request:
    paths:
      - 'freight/research/AIES_LTL_CARRIER_REVENUE_20261011.json'
      - 'freight/research_ltl_revenue_bridge.py'
      - 'freight/test_research_ltl_revenue_bridge.py'
      - 'freight/lab_phase4_director.py'
      - 'freight/lab_phase4_control_center.py'
      - 'freight/RESEARCH_AIES_LTL_CARRIER_REVENUE.md'
      - '.github/workflows/retally-aies-ltl-revenue.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-falsification-and-control-center:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install pinned existing lab dependencies
        run: |
          python -m pip install -r production/requirements-ci.txt
          python -m pip install cryptography==46.0.4
      - name: Run AIES adversarial tests and preceding source proof regressions
        run: |
          PYTHONPATH=. python -m pytest -q \
            freight/test_research_ltl_revenue_bridge.py \
            freight/test_research_cfs_primary_replay.py \
            freight/test_research_cfs_mode_hierarchy.py \
            freight/test_lab_phase4_director.py
      - name: Reproduce AIES revenue and zero-recovery report in existing Lab 14
        run: |
          PYTHONPATH=. python -m freight.research_ltl_revenue_bridge \
            --as-of-date "$(date -u +%F)" --out /tmp/retally-aies-ltl
          PYTHONPATH=. python -m freight.lab_phase4_control_center \
            --out /tmp/retally-aies-ltl/operator
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('/tmp/retally-aies-ltl')
          r=json.loads((root/'aies_ltl_revenue.json').read_text())
          controls=json.loads((root/'operator/phase4_control.json').read_text())
          a=controls['aies_ltl_carrier_revenue']
          assert r['scope']=='LAB14_AIES_SOURCE_BOUND_LTL_CARRIER_REVENUE_NOT_RECOVERY_TAM'
          assert r['ltl_2024_revenue_billion_usd']=='65.096'
          assert r['ltl_2024_share_of_all_trucking_pct']=='16.16'
          assert r['ltl_2024_growth_vs_2023_pct']=='0.69'
          assert r['latest_observed_reference_year']==2024
          assert r['legacy_2022_comparator_is_interchangeable'] is False
          assert r['ltl_freight_audit_recoverable_tam_usd'] is None
          assert r['real_ltl_invoice_cases_observed']==0
          assert r['verified_invoice_error_rate_pct'] is None
          assert r['cross_cfs_shipped_goods_value_division_allowed'] is False
          assert r['source']['fred_public_csv_replay_completed'] is False
          assert a['receipt_sha256']==r['receipt_sha256']
          assert len(controls['lab_runs'])==14
          assert controls['failed_or_blocked_labs']==[]
          assert 'aies_ltl_revenue.html' in (root/'operator/index.html').read_text()
          assert '65.096' in (root/'aies_ltl_revenue.html').read_text()
          assert controls['actual_revenue_cents']==0
          print('Census AIES long-distance LTL carrier revenue: PASS; ZERO real recoveries or invoice permissions.')
          PY
      - name: Retain only internal research evidence receipts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: retally-lab14-aies-ltl-revenue-offline
          path: |
            /tmp/retally-aies-ltl/aies_ltl_revenue.json
            /tmp/retally-aies-ltl/aies_ltl_revenue.html
          if-no-files-found: error
          retention-days: 14

  verify-fred-published-csv-observations:
    needs: offline-falsification-and-control-center
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Fetch exactly three allowlisted Federal Reserve distributed Census CSVs
        run: |
          PYTHONPATH=. python -m freight.research_ltl_revenue_bridge \
            --verify-fred-csv --as-of-date "$(date -u +%F)" \
            --out /tmp/retally-aies-fred
      - name: Verify FRED source receipts and forbid commercial promotion
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/retally-aies-fred')
          r=json.loads((p/'aies_ltl_revenue.json').read_text())
          s=r['source']
          assert s['fred_public_csv_replay_completed'] is True
          assert len(s['fred_csv_replay_receipts'])==3
          assert all(len(x['csv_sha256'])==64 and
                     x['verified_observation_years']==[2022,2023,2024] and
                     x['downloaded_from_census_origin_api'] is False and
                     x['original_census_publisher_signature_proven'] is False
                     for x in s['fred_csv_replay_receipts'])
          assert r['ltl_2024_revenue_billion_usd']=='65.096'
          assert r['ltl_2024_share_of_all_trucking_pct']=='16.16'
          assert r['ltl_freight_audit_recoverable_tam_usd'] is None
          assert r['real_ltl_invoice_cases_observed']==0
          assert r['buyer_demand_proven'] is False
          assert r['commercial_uses_or_external_contact_allowed'] is False
          assert s['full_census_origin_api_bytes_replayed'] is False
          print('Three FRED published CSV receipts matched. No actual customer spend or recovery claims.')
          PY
      - name: Retain source digests and report, never customer or raw CSV files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: retally-lab14-aies-ltl-fred-evidence
          path: |
            /tmp/retally-aies-fred/aies_ltl_revenue.json
            /tmp/retally-aies-fred/aies_ltl_revenue.html
          if-no-files-found: error
          retention-days: 14
