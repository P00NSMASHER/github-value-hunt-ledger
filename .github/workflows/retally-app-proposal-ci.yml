name: Route checked App proposal to the RETALLY merger

on:
  workflow_run:
    workflows: [Repository Release Gate]
    types: [completed]

permissions: {}

jobs:
  dispatch:
    if: >-
      github.repository == 'P00NSMASHER/github-value-hunt-ledger' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.actor.id == 343751880 &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.pull_requests[0].base.ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: write
      pull-requests: read
      contents: read
    steps:
      - name: Dispatch the protected merger for the exact checked PR
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          run=$(jq -ce '.workflow_run | select(.pull_requests | length == 1)' "$GITHUB_EVENT_PATH")
          number=$(jq -er '.pull_requests[0].number' <<< "$run")
          [[ "$number" =~ ^[1-9][0-9]*$ ]]
          pr=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$number")
          jq -en --argjson p "$pr" --argjson r "$run" --arg repo "$GITHUB_REPOSITORY" '
            $p.state == "open" and $p.draft == false and $p.user.id == 343751880 and
            $p.user.login == "portfolio-brain-v8-runtime[bot]" and $p.head.repo.full_name == $repo and
            $p.base.repo.full_name == $repo and $p.base.ref == "main" and
            $p.head.sha == $r.head_sha and $p.head.ref == $r.head_branch and
            $p.head.sha == $r.pull_requests[0].head.sha' > /dev/null
          branch=$(jq -r .head.ref <<< "$pr")
          [[ "$branch" =~ ^automation/retally-(scout|catalog|integrator|technology)-[1-9][0-9]{3,15}-[1-9][0-9]{0,3}$ ]]
          lane=${BASH_REMATCH[1]}
          head=$(jq -r .head.sha <<< "$pr")
          base=$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$head" --jq 'select(.parents | length == 1) | .parents[0].sha')
          [[ "$head" =~ ^[a-f0-9]{40}$ && "$base" =~ ^[a-f0-9]{40}$ ]]
          gh workflow run retally-generated-pr-merge.yml --repo "$GITHUB_REPOSITORY" --ref main \
            -f "lane=$lane" -f "pr_number=$number" -f "base_sha=$base" -f "head_sha=$head"
