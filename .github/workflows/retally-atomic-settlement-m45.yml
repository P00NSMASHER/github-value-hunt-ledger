name: RETALLY Lab 14 Transactional Settlement Operation Safety (Mission 45)
on:
  pull_request:
    paths:
      - '.github/workflows/retally-atomic-settlement-m45.yml'
      - 'freight/settlement_store.py'
      - 'freight/lab_atomic_financial_m45.py'
      - 'freight/test_lab_atomic_financial_m45.py'
      - 'freight/lab_phase4_director.py'
      - 'freight/lab_cross_lab_assurance_m39.py'
      - 'freight/test_lab_cross_lab_assurance_m39.py'
      - 'freight/lab_phase4_control_center.py'
      - 'freight/RESEARCH_ATOMIC_SETTLEMENT_M45.md'
      - 'freight/settlement_semantic_guard_m44.py'
  workflow_dispatch:
permissions:
  contents: read

jobs:
  atomic-revision-readwrite-and-all-fourteen-labs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install inherited offline research dependencies
        run: |
          python -m pip install -r production/requirements-ci.txt
          python -m pip install cryptography==46.0.4 openpyxl==3.1.5
      - name: Run real SettlementStore money reads, atomic rollback, concurrency and inherited tests
        run: |
          PYTHONPATH=. python -m pytest -q \
            freight/test_lab_atomic_financial_m45.py \
            freight/test_lab_persistent_semantic_m44.py \
            freight/test_backup_restore.py \
            freight/test_settlement_store.py \
            freight/test_settlement_report.py \
            freight/test_lab_settlement_source_m43.py \
            freight/test_lab_settlement_identity_m42.py \
            freight/test_lab_critical_counterexample_replay_m41.py \
            freight/test_lab_assurance.py \
            freight/test_lab_phase3_real_chain.py \
            freight/test_lab_phase4_director.py \
            freight/test_lab_cross_lab_assurance_m39.py \
            freight/test_lab_historical_disposition_m40.py \
            freight/test_lab_phase4_experiments.py \
            freight/test_lab_experiment_ledger.py \
            freight/test_research_pilot_preflight.py
      - name: Reproduce forty atomic read denials and eight write denials against original fourteen labs
        run: |
          PYTHONPATH=. python -m freight.lab_atomic_financial_m45 \
            --as-of-date "$(date -u +%F)" --out /tmp/retally-m45
          PYTHONPATH=. python -m freight.lab_phase4_control_center \
            --out /tmp/retally-m45-control
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('/tmp/retally-m45/atomic_financial_operations_m45.json').read_text())
          d=json.loads(Path('/tmp/retally-m45-control/phase4_control.json').read_text())
          assert m['scope']=='RETALLY_LAB14_M45_ATOMIC_PERSISTENT_FINANCIAL_OPERATION_GATES_SYNTHETIC_ONLY'
          assert m['original_research_lab_count']==14 and m['new_lab_created'] is False
          assert m['corrupted_persistent_source_scenarios']==8
          assert m['current_financial_read_denials']==40
          assert m['current_financial_write_denials']==8
          assert m['total_fail_closed_financial_operations']==48
          assert len(m['cases'])==8
          assert all(row['positive_read_surfaces_passed']==5
                     and row['read_operation_denials']==5
                     and row['write_operation_denials']==1
                     and row['rejected_actions_left_source_unchanged']
                     and row['original_historical_finding_closed'] is False
                     for row in m['cases'])
          assert m['current_original_historical_findings_open']==26
          assert m['current_original_historical_findings_closed']==0
          assert m['independent_human_first_customer_pilot_controls_unmet']==18
          assert m['external_commercial_approval_granted'] is False
          assert m['actual_customer_cash_recovered_usd'] is None
          assert len(d['lab_runs'])==14 and not d['failed_or_blocked_labs']
          assert d['executed_labs']==list(range(1,15))
          assert d['cross_lab_integrity_m39']['all_fourteen_locally_executed'] is True
          assert d['atomic_financial_m45']['receipt_sha256']==m['receipt_sha256']
          assert d['persistent_semantic_m44']['current_persistent_store_cases']==8
          assert d['historical_finding_disposition_m40']['original_historical_findings_open']==26
          assert d['actual_revenue_cents']==0
          assert 'atomic_financial_operations_m45.html' in Path('/tmp/retally-m45-control/index.html').read_text()
          print('M45: 40 read denials + 8 write denials with 8 fictional positive controls; all original 14 labs passed, no historic defect closed.')
          PY
      - name: Retain bounded internal-only synthetic metadata without SQLite/customer source data
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: retally-m45-atomic-financial-operations-test-receipts
          path: |
            /tmp/retally-m45/atomic_financial_operations_m45.json
            /tmp/retally-m45/atomic_financial_operations_m45.html
          if-no-files-found: error
          retention-days: 14

  independently-verify-actual-m44-vs-m45-source-behavior:
    needs: atomic-revision-readwrite-and-all-fourteen-labs
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Retrieve pinned exact pre-M45 SettlementStore source — never a moving HEAD^
        run: |
          git fetch --no-tags --depth=1 origin d824939dfbe9fb3ed87927809af1b4c13898fde3
          git show d824939dfbe9fb3ed87927809af1b4c13898fde3:freight/settlement_store.py > /tmp/m45_predecessor_store.py
          cp freight/settlement_schema.sql /tmp/settlement_schema.sql
          test -s /tmp/m45_predecessor_store.py
      - name: Independently demonstrate eight old bypasses and eight new transactional denials
        run: |
          PYTHONPATH=. python - <<'PY'
          import importlib.util,sys,tempfile
          from hashlib import sha256
          from pathlib import Path
          from freight.test_lab_phase3_real_chain import funded_store
          from freight.lab_persistent_semantic_m44 import ATTACKS,_attack,_raw_digest
          from freight.settlement_store import SettlementEventRecord
          name='m45_pre_transaction_store'
          spec=importlib.util.spec_from_file_location(name,'/tmp/m45_predecessor_store.py')
          prior=importlib.util.module_from_spec(spec)
          sys.modules[name]=prior
          spec.loader.exec_module(prior)
          accepted_old_read=accepted_old_write=blocked_new=0
          for scenario,code in ATTACKS.items():
              with tempfile.TemporaryDirectory() as td:
                  current=funded_store(td)
                  db=Path(current.path)
                  older=prior.SettlementStore(
                      db,buyer_id=current.buyer_id,
                      business_unit=current.business_unit)
                  assert older.realized_cents()==current.realized_cents()==500
                  _attack(db,scenario)
                  # Previously opened M44 instance did not re-audit
                  # these direct money readers or ordinary write transactions.
                  older.realized_cents()
                  older.fee_eligible_cents()
                  older.count('allocations')
                  accepted_old_read+=1
                  for operation in (
                      current.realized_cents,current.fee_eligible_cents,
                      lambda:current.count('allocations'),
                  ):
                      try:
                          operation()
                      except RuntimeError as exc:
                          assert code in str(exc),(scenario,str(exc))
                      else:
                          raise AssertionError('M45 current reader accepted '+scenario)
                  for obj,ident in (
                      (older,'m45-old-accepted-credit'),
                      (current,'m45-new-rejected-credit'),
                  ):
                      event=(prior.SettlementEventRecord if obj is older
                             else SettlementEventRecord)(
                          ident,'INV-100','SIM-CARRIER','SIM-BUYER','USD',1,
                          '2026-12-20T12:00:00Z',
                          sha256(ident.encode()).hexdigest(),'EXTERNAL')
                      if obj is older:
                          assert older.ingest_event(event) is True
                          accepted_old_write+=1
                      else:
                          before=_raw_digest(db)
                          try:
                              current.ingest_event(event)
                          except RuntimeError as exc:
                              assert code in str(exc),(scenario,str(exc))
                              blocked_new+=1
                          else:
                              raise AssertionError('M45 current writer accepted '+scenario)
                          assert _raw_digest(db)==before
          assert (accepted_old_read,accepted_old_write,blocked_new)==(8,8,8)
          print('M45 independent differential: 8 previously opened M44 sources accepted damaged-money reads and appends; M45 rejects all, without writing.')
          PY
