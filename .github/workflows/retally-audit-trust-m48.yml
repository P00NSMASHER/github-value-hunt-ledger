name: RETALLY Lab 14 Durable Audit Log Trust Boundary (Mission 48)
on:
  pull_request:
    paths:
      - '.github/workflows/retally-audit-trust-m48.yml'
      - 'freight/audit_store_schema_m48.sql'
      - 'freight/audit_store_integrity_m48.py'
      - 'freight/audit_store.py'
      - 'freight/backup_restore.py'
      - 'freight/lab_audit_trust_boundary_m48.py'
      - 'freight/test_lab_audit_trust_boundary_m48.py'
      - 'freight/lab_phase4_director.py'
      - 'freight/lab_cross_lab_assurance_m39.py'
      - 'freight/test_lab_cross_lab_assurance_m39.py'
      - 'freight/lab_phase4_control_center.py'
      - 'freight/RESEARCH_AUDIT_TRUST_M48.md'
  workflow_dispatch:
permissions:
  contents: read

jobs:
  persistent-audit-and-fourteen-lab-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install inherited offline-only test dependencies
        run: |
          python -m pip install -r production/requirements-ci.txt
          python -m pip install cryptography==46.0.4 openpyxl==3.1.5
      - name: Test audit-log chain and schema, source continuity, backup and all previous labs
        run: |
          PYTHONPATH=. python -m pytest -q \
            freight/test_lab_audit_trust_boundary_m48.py \
            freight/test_audit_store.py \
            freight/test_audit_ledger.py \
            freight/test_backup_restore.py \
            freight/test_lab_file_continuity_m47.py \
            freight/test_lab_schema_integrity_m46.py \
            freight/test_lab_atomic_financial_m45.py \
            freight/test_lab_persistent_semantic_m44.py \
            freight/test_settlement_store.py \
            freight/test_settlement_report.py \
            freight/test_lab_settlement_source_m43.py \
            freight/test_lab_settlement_identity_m42.py \
            freight/test_lab_critical_counterexample_replay_m41.py \
            freight/test_lab_assurance.py \
            freight/test_lab_phase3_real_chain.py \
            freight/test_lab_phase4_director.py \
            freight/test_lab_cross_lab_assurance_m39.py \
            freight/test_lab_historical_disposition_m40.py \
            freight/test_lab_phase4_experiments.py \
            freight/test_lab_experiment_ledger.py \
            freight/test_research_pilot_preflight.py
      - name: Execute thirteen real audit-file source negatives and original fourteen-lab report
        run: |
          PYTHONPATH=. python -m freight.lab_audit_trust_boundary_m48 \
            --as-of-date "$(date -u +%F)" --out /tmp/retally-m48
          PYTHONPATH=. python -m freight.lab_phase4_control_center \
            --out /tmp/retally-m48-control
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('/tmp/retally-m48/audit_trust_boundary_m48.json').read_text())
          control=json.loads(Path('/tmp/retally-m48-control/phase4_control.json').read_text())
          assert report['scope']=='RETALLY_LAB14_M48_PERSISTENT_AUDIT_PROTECTION_SYNTHETIC_ONLY'
          assert report['original_research_labs']==14 and report['new_lab_created'] is False
          assert report['current_real_audit_file_attack_classes']==13
          assert report['current_audit_read_denials']==65
          assert report['current_audit_append_denials']==13
          assert len(report['cases'])==13
          assert all(c['existing_session_read_denials']==5
                     and c['existing_session_append_denials']==1
                     and not c['original_historical_defect_closed']
                     for c in report['cases'])
          assert report['original_historical_findings_open']==26
          assert report['original_historical_findings_closed']==0
          assert report['independent_first_customer_approval_gates_unmet']==18
          assert report['independently_attested_audit_log_or_original_customer_data'] is False
          assert report['externally_publishable_empirical_claims']==0
          assert control['executed_labs']==list(range(1,15))
          assert len(control['lab_runs'])==14 and not control['failed_or_blocked_labs']
          assert control['cross_lab_integrity_m39']['all_fourteen_locally_executed'] is True
          assert control['persistent_audit_trust_m48']['receipt_sha256']==report['receipt_sha256']
          assert control['sqlite_file_continuity_m47']['disposed_current_sqlite_path_attack_cases']==8
          assert control['historical_finding_disposition_m40']['original_historical_findings_open']==26
          assert control['actual_revenue_cents']==0
          assert 'audit_trust_boundary_m48.html' in Path('/tmp/retally-m48-control/index.html').read_text()
          print('M48: thirteen synthetic audit-file attacks, 65 read and 13 append denials, 14 original labs and 26 original defects still open.')
          PY
      - name: Retain short-lived metadata-only fictional research evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: retally-m48-persistent-audit-file-trust-boundary
          path: |
            /tmp/retally-m48/audit_trust_boundary_m48.json
            /tmp/retally-m48/audit_trust_boundary_m48.html
          if-no-files-found: error
          retention-days: 14

  independent-old-audit-store-vs-fixed-source-differential:
    needs: persistent-audit-and-fourteen-lab-regression
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Pin immediate original M47 AuditStore source, never moving HEAD^
        run: |
          git fetch --no-tags --depth=1 origin b165c5e1ee3089449a048de987383738eedea5e1
          git show b165c5e1ee3089449a048de987383738eedea5e1:freight/audit_store.py > /tmp/m48_prior_audit_store.py
          test -s /tmp/m48_prior_audit_store.py
      - name: Confirm old valid-looking audit file reads admitted twelve corrupt or substituted originals
        run: |
          PYTHONPATH=. python - <<'PY'
          import importlib.util,sys,tempfile
          from pathlib import Path
          from freight.lab_audit_trust_boundary_m48 import ATTACKS,_start,mutate_fixture
          name='m48_prior_unprotected_audit'
          spec=importlib.util.spec_from_file_location(name,'/tmp/m48_prior_audit_store.py')
          old=importlib.util.module_from_spec(spec)
          sys.modules[name]=old
          spec.loader.exec_module(old)
          accepted_prior=denied_current=0
          for case,reason in ATTACKS.items():
              with tempfile.TemporaryDirectory() as td:
                  current=_start(Path(td))
                  prior=old.AuditStore(
                      current.path,buyer_id=current.buyer_id,
                      business_unit=current.business_unit)
                  assert prior.count()==current.count()==2
                  db=Path(current.path)
                  mutate_fixture(db,case)
                  if case!='DELETE_AUDIT_FILE':
                      # Old count() queried raw rows without schema/file
                      # validation or typed hash-chain recheck.
                      expected=0 if case=='REPLACE_WITH_EMPTY_VALID_AUDIT' else (
                          1 if case=='FORGE_AUDIT_SEQUENCE_GAP_RESTORE_TRIGGER' else 2)
                      assert prior.count()==expected,case
                      accepted_prior+=1
                  try:
                      current.count()
                  except RuntimeError as exc:
                      assert reason in str(exc),(case,str(exc))
                      denied_current+=1
                  else:
                      raise AssertionError('M48 silently accepted '+case)
                  if case=='DELETE_AUDIT_FILE':
                      assert not db.exists(), 'M48 read recreated deleted original'
          assert (accepted_prior,denied_current)==(12,13)
          print('M48 independent pinned-source proof: 12 predecessor false-admissions; 13 current exact denials, deleted main not recreated.')
          PY
