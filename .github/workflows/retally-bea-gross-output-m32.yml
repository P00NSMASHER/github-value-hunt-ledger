name: RETALLY Lab 14 BEA Gross Output Table 16 Original-Source Hunt (Mission 32)
on:
  pull_request:
    paths:
      - '.github/workflows/retally-bea-gross-output-m32.yml'
      - 'freight/research_bea_gross_output_m32.py'
      - 'freight/test_research_bea_gross_output_m32.py'
      - 'freight/research/BEA_GROSS_OUTPUT_M32_20261012.json'
      - 'freight/RESEARCH_BEA_GROSS_OUTPUT_M32.md'
      - 'freight/lab_phase4_director.py'
      - 'freight/lab_phase4_control_center.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bea-gross-output-source-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Probe BEA table16 via redistributor and publisher open-data routes
        run: |
          python - <<'PY'
          from urllib.request import Request,urlopen
          from hashlib import sha256
          import json
          routes={
            'DBNOMICS_API_SERIES_DASH': 'https://api.db.nomics.world/v22/series/BEA/GDPbyIndustry-16/484-A',
            'DBNOMICS_API_SERIES_DOT': 'https://api.db.nomics.world/v22/series/BEA/GDPbyIndustry-16/484.A',
            'DBNOMICS_SERIES_HTML': 'https://db.nomics.world/BEA/GDPbyIndustry-16/484-A',
            'DBNOMICS_DATASET_JSON': 'https://api.db.nomics.world/v22/series/BEA/GDPbyIndustry-16?observations=1&limit=200',
            'BEA_OPEN_DATA': 'https://www.bea.gov/open-data',
            'BEA_INDUSTRY_INTERACTIVE': 'https://apps.bea.gov/iTable/?reqid=1603&step=2&isURI=1&Categories=GDPxInd',
          }
          for name,url in routes.items():
            try:
              req=Request(url,headers={'User-Agent':'Mozilla/5.0 (compatible; RETALLY-Lab14-BEA-Gross-Output-Source/1.0)'})
              with urlopen(req,timeout=16) as resp:
                raw=resp.read(650001)
                print('M32_SOURCE_HTTP',name,resp.status,'final',resp.geturl(),'bytes',len(raw),'sha256',sha256(raw).hexdigest(),flush=True)
              if len(raw)>650000:raise ValueError('SOURCE_EXCEEDED_650KB_PROBE')
              doc=raw.decode('utf-8',errors='replace')
              if 'json' in name.lower():
                try:
                  j=json.loads(doc)
                  print('M32_JSON_KEYS',name,list(j)[:15],flush=True)
                  for text in ('484-A','Truck transportation','Chain-Type Quantity Indexes for Gross Output'):
                    ix=doc.find(text)
                    print('M32_JSON_FIND',name,text,ix,repr(doc[max(0,ix-130):ix+260]) if ix>=0 else None,flush=True)
                except ValueError:
                  print('M32_NOT_JSON',name,repr(doc[:220]),flush=True)
              elif name.startswith('DBNOMICS'):
                print('M32_DBNOMICS_SNIPPET',name,repr(doc[:440]),flush=True)
                for text in ('2017','2024','484-A','Truck transportation'):
                  ix=doc.find(text)
                  print('M32_DBNOMICS_FIND',name,text,ix,repr(doc[max(0,ix-140):ix+260]) if ix>=0 else None,flush=True)
              else:
                for text in ('Downloadable Datasets','GDP by Industry','API'):
                  ix=doc.find(text)
                  print('M32_BEA_FIND',name,text,ix,repr(doc[max(0,ix-90):ix+200]) if ix>=0 else None,flush=True)
            except Exception as err:
              print('M32_SOURCE_BLOCKED',name,type(err).__name__,str(err)[:180],flush=True)
          PY
