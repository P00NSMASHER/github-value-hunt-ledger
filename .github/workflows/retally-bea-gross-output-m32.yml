name: RETALLY Lab 14 BEA Gross Output Table16 Secondary Source (Mission 32)
on:
  pull_request:
    paths:
      - '.github/workflows/retally-bea-gross-output-m32.yml'
      - 'freight/research_bea_gross_output_m32.py'
      - 'freight/test_research_bea_gross_output_m32.py'
      - 'freight/research/BEA_GROSS_OUTPUT_M32_20261012.json'
      - 'freight/RESEARCH_BEA_GROSS_OUTPUT_M32.md'
      - 'freight/lab_phase4_director.py'
      - 'freight/lab_phase4_control_center.py'
  workflow_dispatch:
permissions:
  contents: read

jobs:
  offline-adversarial-and-original-14-labs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install original research CI dependencies
        run: |
          python -m pip install -r production/requirements-ci.txt
          python -m pip install cryptography==46.0.4
      - name: Verify Table16 source plus every predecessor Census BLS BEA regression
        run: |
          PYTHONPATH=. python -m pytest -q \
            freight/test_research_bea_gross_output_m32.py \
            freight/test_research_bls_sectoral_output_m31.py \
            freight/test_research_bea_measurement_gate.py \
            freight/test_research_unified_blspci.py \
            freight/test_research_bls_parent_origin.py \
            freight/test_research_fred_parent_ppi.py \
            freight/test_research_bls_ppi_bridge.py \
            freight/test_research_sas_aies_bridge.py \
            freight/test_research_sas_temporal.py \
            freight/test_research_sas_peer_benchmark.py \
            freight/test_research_sas_benchmark.py \
            freight/test_research_aies_2022_lineage.py \
            freight/test_research_aies_historical_lineage.py \
            freight/test_research_aies_original_ftp.py \
            freight/test_research_ltl_revenue_bridge.py \
            freight/test_research_cfs_primary_replay.py \
            freight/test_research_cfs_mode_hierarchy.py \
            freight/test_lab_phase4_director.py
      - name: Verify offline source context and original lab/pilot holds
        run: |
          PYTHONPATH=. python -m freight.research_bea_gross_output_m32 --offline --as-of-date "$(date -u +%F)" --out /tmp/m32-offline
          PYTHONPATH=. python -m freight.lab_phase4_control_center --out /tmp/m32-control
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('/tmp/m32-offline/bea_gross_output.json').read_text())
          labs=json.loads(Path('/tmp/m32-control/phase4_control.json').read_text())
          assert r['status']=='M32_OFFLINE_PINNED_BEAE_TABLE16_SECONDARY_SNAPSHOT_NOT_REFETCHED'
          assert r['new_secondary_api_observations_authenticated_in_this_run']==0
          assert r['bea_source_table']=='GDPbyIndustry-16' and r['bea_source_series']=='484-A'
          assert len(r['bea_2017_2024_year_index'])==8
          assert [r[k] for k in ('bea_real_gross_output_2017_2024_change_pct','bls_real_sectoral_output_2017_2024_change_pct','m29_illustrative_revenue_ppi_proxy_2017_2024_change_pct')]==['8.05','4.02','1.18']
          assert r['bea_minus_bls_output_descriptive_gap_pp']=='4.03'
          assert r['bea_minus_m29_ppi_proxy_descriptive_gap_pp']=='6.87'
          assert r['original_bea_publisher_source_verification_hold'] is True
          assert r['direct_original_bea_table16_numeric_source_bytes_authenticated'] is False
          assert r['paid_customer_freight_invoices_observed']==0
          assert r['freight_recovery_tam_usd'] is None
          assert r['human_pilot_18_independent_requirements_unmet'] is True
          assert r['scheduled_tasks_created_or_modified'] is False
          assert len(labs['lab_runs'])==14 and labs['failed_or_blocked_labs']==[]
          assert labs['pilot_preflight']['unmet_requirements']==18
          assert labs['bea_gross_output_table16_m32']['receipt_sha256']==r['receipt_sha256']
          assert 'bea_gross_output.html' in Path('/tmp/m32-control/index.html').read_text()
          print('M32: 8 secondary source years, 14 labs successful, 18 real customer approvals unmet, direct BEA original unverified.')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: retally-m32-offline-bea-gross-output
          path: |
            /tmp/m32-offline/bea_gross_output.json
            /tmp/m32-offline/bea_gross_output.html
          if-no-files-found: error
          retention-days: 14

  live-dbnomics-secondary-verification:
    needs: offline-adversarial-and-original-14-labs
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Reproduce BEA Table16 484 2017-2024 through DBnomics only
        run: |
          PYTHONPATH=. python -m freight.research_bea_gross_output_m32 --fetch-secondary --as-of-date "$(date -u +%F)" --out /tmp/m32-secondary
      - name: Separate third-party redistributor evidence from original BEA publisher proof
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('/tmp/m32-secondary/bea_gross_output.json').read_text())
          assert r['bea_source_table']=='GDPbyIndustry-16'
          assert r['bea_source_series']=='484-A' and r['naics']=='484'
          assert r['bea_real_gross_output_2017_2024_change_pct']=='8.05'
          assert r['original_bea_publisher_source_verification_hold'] is True
          assert r['direct_original_bea_table16_numeric_source_bytes_authenticated'] is False
          assert r['discrepancies_are_not_independently_validated_model_errors'] is True
          assert r['paid_customer_freight_invoices_observed']==0
          assert r['human_pilot_18_independent_requirements_unmet'] is True
          if r['status']=='M32_BEA_ORIGIN_TABLE16_DB_NOMICS_DISTRIBUTOR_8_YEARS_REPRODUCED_NOT_BEAPRIMARY':
            assert r['new_secondary_source_http_replayed_in_this_run'] is True
            assert r['new_secondary_api_observations_authenticated_in_this_run']==8
            assert len(r['new_secondary_source_http_raw_sha256'])==64
            assert r['source_grade']=='BEA_ORIGIN_DB_NOMICS_THIRD_PARTY_REPLAYED_NOT_BEAPRIMARY'
            print('VERIFIED 8 BEA-origin annual Table16 values through DBnomics. Original BEA bytes remain unverified.')
          elif r['status']=='M32_DBNOMICS_SECONDARY_SOURCE_UNAVAILABLE_DIRECT_BEA_ORIGINAL_STILL_UNVERIFIED':
            assert r['new_secondary_source_http_replayed_in_this_run'] is False
            assert r['new_secondary_api_observations_authenticated_in_this_run']==0
            print('::warning::Secondary API blocked; no fresh BEA-origin data authenticated.')
          else:
            raise AssertionError('M32_UNSUPPORTED_OR_CHANGED_SECONDARY_BEAE_SOURCE')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: retally-m32-bea-table16-secondary-proof
          path: |
            /tmp/m32-secondary/bea_gross_output.json
            /tmp/m32-secondary/bea_gross_output.html
          if-no-files-found: error
          retention-days: 14
