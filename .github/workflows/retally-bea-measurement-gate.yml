name: RETALLY Lab 14 BEA Gross-Output Versus Value-Added Research (Mission 30)
on:
  pull_request:
    paths:
      - '.github/workflows/retally-bea-measurement-gate.yml'
      - 'freight/research_bea_measurement_gate.py'
      - 'freight/test_research_bea_measurement_gate.py'
      - 'freight/research/BEA_TRUCKING_MEASURE_COMPATIBILITY_M30_20261012.json'
      - 'freight/RESEARCH_BEA_MEASUREMENT_GATE.md'
      - 'freight/lab_phase4_director.py'
      - 'freight/lab_phase4_control_center.py'
  workflow_dispatch:
permissions:
  contents: read

jobs:
  publisher-measure-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Inspect BEA published measure definitions and 2026-vintage FRED BEA data
        run: |
          python - <<'PY'
          from urllib.request import Request,urlopen
          from hashlib import sha256
          import re
          sources={
            'BEA_DEFINITIONS':'https://www.bea.gov/resources/guide-interactive-gdp-industry-accounts-tables',
            'BEA_GROSS_OUTPUT':'https://www.bea.gov/data/industries/gross-output-by-industry',
            'FRED_BEA_REAL_GDP_INDEX':'https://fred.stlouisfed.org/data/USTRUCKTRANQGSP',
            'FRED_BEA_REAL_GDP_DOLLARS':'https://fred.stlouisfed.org/data/USTRUCKTRANRGSP',
            'FRED_CSV_BEA_GDP':'https://fred.stlouisfed.org/graph/fredgraph.csv?id=USTRUCKTRANQGSP',
          }
          for name,url in sources.items():
            try:
              req=Request(url,headers={'User-Agent':'Mozilla/5.0 (compatible; RETALLY-Lab14-BEA-Measure-Check/1.0)'})
              with urlopen(req,timeout=18) as res:
                raw=res.read(1200001)
                print('BEA_M30_SOURCE',name,'status',res.status,'final',res.geturl(),
                      'bytes',len(raw),'sha256',sha256(raw).hexdigest(),flush=True)
              if len(raw)>1200000: raise ValueError('SOURCE_OVERSIZE')
              txt=raw.decode('utf-8',errors='replace')
              for needle in ('2017-01-01','2024-01-01','2025-01-01','Last Updated',
                             'Chain-Type Quantity Indexes for Gross Output','Value added by industry'):
                found=[m.start() for m in re.finditer(re.escape(needle),txt,re.IGNORECASE)]
                if found:
                  pos=found[-1]
                  print('BEA_M30_SAMPLE',name,needle,repr(txt[max(0,pos-70):pos+180]),flush=True)
            except Exception as exc:
              print('BEA_M30_BLOCKED',name,type(exc).__name__,str(exc)[:180],flush=True)
          PY
