name: RETALLY Lab 14 Original BEA Table16 Publisher Access (Mission 33)
on:
  pull_request:
    paths:
      - '.github/workflows/retally-bea-original-m33.yml'
      - 'freight/research_bea_original_m33.py'
      - 'freight/test_research_bea_original_m33.py'
      - 'freight/research/BEA_ORIGINAL_ACCESS_M33_20261012.json'
      - 'freight/RESEARCH_BEA_ORIGINAL_M33.md'
      - 'freight/lab_phase4_director.py'
      - 'freight/lab_phase4_control_center.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bea-official-access-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Download original BEA official GrossOutput.xlsx and locate Table16 484 2017–2024 row
        run: |
          python -m pip install openpyxl==3.1.5
          python - <<'PY'
          from urllib.request import Request,urlopen
          from hashlib import sha256
          from io import BytesIO
          from zipfile import ZipFile
          from openpyxl import load_workbook
          url='https://apps.bea.gov/industry/Release/XLS/GDPxInd/GrossOutput.xlsx'
          req=Request(url,headers={'User-Agent':'RETALLY-Lab14-Original-BEA-GrossOutput-Source-Replay/1.0'})
          with urlopen(req,timeout=35) as res:
            raw=res.read(18000001)
            print('M33_PRIMARY_BEAXLS_HTTP',res.status,'url',res.geturl(),'type',res.headers.get('Content-Type'),'bytes',len(raw),'sha256',sha256(raw).hexdigest(),flush=True)
          if len(raw)>18000000:raise ValueError('BEA_GROSSOUTPUT_XLSX_EXCEEDS_LIMIT')
          with ZipFile(BytesIO(raw)) as z:
            print('M33_PRIMARY_BEAXLS_MEMBERS',z.namelist()[:23],flush=True)
          wb=load_workbook(BytesIO(raw),read_only=True,data_only=True)
          print('M33_PRIMARY_BEAXLS_SHEETS',wb.sheetnames,flush=True)
          for sheet in wb:
            first=[]
            hits=[]
            for idx,row in enumerate(sheet.iter_rows(values_only=True),start=1):
              if idx<=10:
                first.append({'line':idx,'cells':[str(x)[:75] if x is not None else None for x in row[:28]]})
              clean=[str(x).strip() if x is not None else '' for x in row]
              if ('Truck transportation' in clean or
                  '484' in clean[:6] or
                  'Chain-Type Quantity Indexes for Gross Output by Industry' in clean[:8]):
                hits.append({'line':idx,'cells':clean[:44]})
              if idx>2500:break
            print('M33_PRIMARY_BEAXLS_TAB',sheet.title,'max_row',sheet.max_row,'max_col',sheet.max_column,'first',first[:6],'matched_rows',hits[:16],flush=True)
          PY
      - name: Inspect original BEA industry open-data metadata and unauthenticated Table16 endpoint
        run: |
          python - <<'PY'
          from urllib.request import Request,urlopen
          from hashlib import sha256
          import json,re
          routes={
            'BEA_DATA_CATALOG':'https://apps.bea.gov/Data.json',
            'BEA_INDUSTRY_OFFICIAL':'https://www.bea.gov/itable/gdp-by-industry',
            'BEA_I_TABLE':'https://apps.bea.gov/iTable/?reqid=151&step=1&isURI=1',
            'BEA_API_TABLE16_NO_KEY':'https://apps.bea.gov/api/data/?UserID=0&method=GetData&DataSetName=GDPbyIndustry&TableID=16&Industry=484&Year=2017,2024&Frequency=A&ResultFormat=JSON',
          }
          for name,url in routes.items():
            print('M33_SOURCE_BEGIN',name,url,flush=True)
            try:
              req=Request(url,headers={'User-Agent':'RETALLY-Lab14-Original-BEA-GrossOutput-Public-Source/1.0'})
              with urlopen(req,timeout=15) as response:
                raw=response.read(700001)
                print('M33_SOURCE_HTTP',name,response.status,response.geturl(),len(raw),sha256(raw).hexdigest(),flush=True)
              if len(raw)>700000:raise ValueError('SOURCE_BYTE_LIMIT')
              txt=raw.decode('utf-8',errors='replace')
              if name=='BEA_DATA_CATALOG':
                j=json.loads(txt)
                for d in j.get('dataset',[]):
                  if 'GDP-by-Industry' in d.get('title','') or 'Annual Industry' in d.get('title',''):
                    print('M33_CATALOG_INDUSTRY',json.dumps({'title':d.get('title'),'distribution':d.get('distribution')},default=str)[:2100],flush=True)
              elif name=='BEA_API_TABLE16_NO_KEY':
                j=json.loads(txt)
                print('M33_BEA_API_NO_KEY',json.dumps(j,default=str)[:1300],flush=True)
              else:
                for term in ('GDP by Industry','Export','CSV','xlsx','Download','Table 16'):
                  found=[m.start() for m in re.finditer(re.escape(term),txt,re.I)]
                  print('M33_SITE_TERM',name,term,len(found),'example',repr(txt[max(0,found[-1]-90):found[-1]+180]) if found else '',flush=True)
            except Exception as e:
              print('M33_SOURCE_BLOCKED',name,type(e).__name__,str(e)[:210],flush=True)
          PY
