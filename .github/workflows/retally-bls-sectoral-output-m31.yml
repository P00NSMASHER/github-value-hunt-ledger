name: RETALLY Lab 14 BLS Real Sectoral Output vs BEA Gross Output (Mission 31)
on:
  pull_request:
    paths:
      - '.github/workflows/retally-bls-sectoral-output-m31.yml'
      - 'freight/research_bls_sectoral_output_m31.py'
      - 'freight/test_research_bls_sectoral_output_m31.py'
      - 'freight/research/BLS_SECTORAL_OUTPUT_M31_20261012.json'
      - 'freight/RESEARCH_BLS_SECTORAL_OUTPUT_M31.md'
      - 'freight/lab_phase4_director.py'
      - 'freight/lab_phase4_control_center.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bea-and-bls-original-source-reconnaissance:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Replay original BLS annual sectoral-output index and verify year windows
        run: |
          python - <<'PY'
          from urllib.request import Request,urlopen
          import hashlib,json
          url='https://api.bls.gov/publicAPI/v2/timeseries/data/'
          ids=['IPUIN484T010000000','IPUIN48412T010000000','IPUIN4841T010000000']
          payload=json.dumps({'seriesid':ids,'startyear':'2017','endyear':'2024'},separators=(',',':')).encode()
          req=Request(url,data=payload,headers={'Content-Type':'application/json','User-Agent':'RETALLY-Lab14-BLS-Real-Sectoral-Output-Source/1.0'},method='POST')
          with urlopen(req,timeout=28) as resp:
            assert resp.geturl()==url
            raw=resp.read(1800001)
            print('M31_BLS_HTTP',resp.status,'bytes',len(raw),'sha256',hashlib.sha256(raw).hexdigest(),flush=True)
          assert len(raw)<=1800000
          doc=json.loads(raw)
          print('M31_BLS_STATUS',doc.get('status'),'messages',doc.get('message'),flush=True)
          for r in doc.get('Results',{}).get('series',[]):
            years={}
            for row in r.get('data',[]):
              if row.get('year') in [str(y) for y in range(2017,2025)]:
                years.setdefault(row['year'],[]).append({'period':row.get('period'),'value':row.get('value'),'footnotes':row.get('footnotes')})
            print('M31_BLS_SERIES',r.get('seriesID'),'byyear',json.dumps(years,sort_keys=True),flush=True)
          PY
      - name: Inspect native padded BLS IP series identifiers rather than FRED aliases
        run: |
          python - <<'PY'
          from urllib.request import Request,urlopen
          from hashlib import sha256
          import json
          ids=['IPUIN484___T010000000','IPUIN48412_T010000000','IPUIN4841__T010000000']
          url='https://api.bls.gov/publicAPI/v2/timeseries/data/'
          body=json.dumps({'seriesid':ids,'startyear':'2017','endyear':'2024'},separators=(',',':')).encode()
          request=Request(url,data=body,headers={'Content-Type':'application/json','User-Agent':'RETALLY-Lab14-Padded-Native-IP-Source/1.0'},method='POST')
          with urlopen(request,timeout=30) as response:
            assert response.geturl()==url
            raw=response.read(900001)
          assert len(raw)<=900000
          data=json.loads(raw)
          print('M31_IP_NATIVE_API',data.get('status'),data.get('message'),'bytes',len(raw),'sha256',sha256(raw).hexdigest(),flush=True)
          for series in data.get('Results',{}).get('series',[]):
            cells={}
            for row in series.get('data',[]):
              if row.get('year') in [str(y) for y in range(2017,2025)]:
                cells.setdefault(row['year'],[]).append({
                  'period':row.get('period'),'value':row.get('value'),
                  'footnotes':row.get('footnotes',[])
                })
            print('M31_IP_NATIVE_SERIES',series.get('seriesID'),json.dumps(cells,sort_keys=True),flush=True)
          PY
      - name: Inspect the September 2026 original BLS detailed-industry productivity workbook for NAICS 484 real output
        run: |
          python -m pip install openpyxl==3.1.5
          python - <<'PY'
          from urllib.request import Request,urlopen
          from hashlib import sha256
          from io import BytesIO
          from openpyxl import load_workbook
          url='https://www.bls.gov/productivity/tables/labor-productivity-detailed-industries.xlsx'
          try:
            with urlopen(Request(url,headers={'User-Agent':'Mozilla/5.0 (compatible; RETALLY-Public-Industry-Output-Research/1.0)'}),timeout=25) as r:
              raw=r.read(18000001)
              print('M31_BLS_XLSX_HTTP',r.status,'url',r.geturl(),'bytes',len(raw),'sha256',sha256(raw).hexdigest(),flush=True)
            if len(raw)>18000000:raise ValueError('WORKBOOK_TOO_LARGE')
            wb=load_workbook(BytesIO(raw),read_only=True,data_only=True)
            print('M31_BLS_WORKBOOK_SHEETS',wb.sheetnames,flush=True)
            for sheet in wb:
              headers=[]
              hits=[]
              for i,row in enumerate(sheet.iter_rows(values_only=True),start=1):
                if i<9:headers.append([str(v)[:110] if v is not None else '' for v in row[:18]])
                if i>16000:break
                vals=[str(v).strip() if v is not None else '' for v in row]
                if '484' in vals[:10] or 'Truck transportation' in vals[:10]:
                  hits.append({'row':i,'vals':vals[:38]})
              print('M31_BLS_XLSX_TAB',sheet.title,'headers',headers[:5],'hits',hits[:10],'hitcount',len(hits),flush=True)
          except Exception as exc:
            print('M31_BLS_XLSX_BLOCKED',type(exc).__name__,str(exc)[:240],flush=True)
          PY
      - name: Check whether unauthenticated BEA API can provide direct gross-output industry observations
        run: |
          python - <<'PY'
          from urllib.request import Request,urlopen
          import json
          url='https://apps.bea.gov/api/data/?UserID=0&method=GetData&DataSetName=GDPbyIndustry&TableID=16&Industry=484&Year=2017,2024&Frequency=A&ResultFormat=JSON'
          try:
            req=Request(url,headers={'User-Agent':'RETALLY-Lab14-Public-BEA-Data-Research/1.0'})
            with urlopen(req,timeout=18) as response:
              raw=response.read(240001)
              print('M31_BEA_API_HTTP',response.status,'bytes',len(raw),'final',response.geturl(),flush=True)
            text=raw.decode('utf-8',errors='replace')
            result=json.loads(text)
            print('M31_BEA_API_STATUS',repr(result.get('BEAAPI',{}).get('Results',{}))[:1500],flush=True)
            print('M31_BEA_API_ERROR',repr(result.get('BEAAPI',{}).get('Error',{}))[:1500],flush=True)
          except Exception as exc:
            print('M31_BEA_API_BLOCKED',type(exc).__name__,str(exc)[:180],flush=True)
          PY
