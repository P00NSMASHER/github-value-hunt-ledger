name: RETALLY Lab 14 Original BLS Real Sectoral Output (Mission 31)
on:
  pull_request:
    paths:
      - '.github/workflows/retally-bls-sectoral-output-m31.yml'
      - 'freight/research_bls_sectoral_output_m31.py'
      - 'freight/test_research_bls_sectoral_output_m31.py'
      - 'freight/research/BLS_SECTORAL_OUTPUT_M31_20261012.json'
      - 'freight/RESEARCH_BLS_SECTORAL_OUTPUT_M31.md'
      - 'freight/lab_phase4_director.py'
      - 'freight/lab_phase4_control_center.py'
  workflow_dispatch:
permissions:
  contents: read

jobs:
  offline-sectoral-output-falsification-and-original-lab14:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install existing Lab 14 research dependencies
        run: |
          python -m pip install -r production/requirements-ci.txt
          python -m pip install cryptography==46.0.4
      - name: Run original BLS annual output and all previous source governance regressions
        run: |
          PYTHONPATH=. python -m pytest -q \
            freight/test_research_bls_sectoral_output_m31.py \
            freight/test_research_bea_measurement_gate.py \
            freight/test_research_unified_blspci.py \
            freight/test_research_bls_parent_origin.py \
            freight/test_research_fred_parent_ppi.py \
            freight/test_research_bls_ppi_bridge.py \
            freight/test_research_sas_aies_bridge.py \
            freight/test_research_sas_temporal.py \
            freight/test_research_sas_peer_benchmark.py \
            freight/test_research_sas_benchmark.py \
            freight/test_research_aies_2022_lineage.py \
            freight/test_research_aies_historical_lineage.py \
            freight/test_research_aies_original_ftp.py \
            freight/test_research_ltl_revenue_bridge.py \
            freight/test_research_cfs_primary_replay.py \
            freight/test_research_cfs_mode_hierarchy.py \
            freight/test_lab_phase4_director.py
      - name: Generate offline BLS sectoral output report and preserve original 14-lab controls
        run: |
          PYTHONPATH=. python -m freight.research_bls_sectoral_output_m31 \
            --offline --as-of-date "$(date -u +%F)" \
            --out /tmp/retally-m31-offline
          PYTHONPATH=. python -m freight.lab_phase4_control_center \
            --out /tmp/retally-m31-control
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('/tmp/retally-m31-offline/bls_sectoral_output.json').read_text())
          labs=json.loads(Path('/tmp/retally-m31-control/phase4_control.json').read_text())
          assert r['scope']=='LAB14_M31_FIRST_PARTY_BLS_SECTORAL_OUTPUT_OUTPUT_MEASUREMENT_NOT_BEA_GROSS_OUTPUT'
          assert r['status']=='M31_OFFLINE_PRIOR_BLS_IP_SOURCE_OBSERVATION_NOT_FRESH_REPLAY'
          assert r['fresh_original_bls_source_year_cells_authenticated']==0
          assert r['historically_observed_original_bls_source_annual_cells']==24
          assert r['original_bls_api_v2_native_ids']==['IPUIN484___T010000000','IPUIN4841__T010000000','IPUIN48412_T010000000']
          by={p['naics']:p for p in r['original_bls_sectoral_output_industry_series']}
          assert [by[c]['2017_2024_real_sectoral_output_change_pct'] for c in ('484','4841','48412')]==['4.02','5.91','2.98']
          assert r['aggregate_naics484_real_sectoral_output_2017_2024_pct']=='4.02'
          assert r['m29_aggregate_illustrative_census_ppi_revenue_proxy_2017_2024_pct']=='1.18'
          assert r['bls_minus_ppi_proxy_descriptive_gap_percentage_points']=='2.84'
          assert r['comparison_verdict']=='DESCRIPTIVE_DIFFERENCE_NOT_VALIDATED_MODEL_ERROR_OR_OFFICIAL_BEA_REAL_OUTPUT'
          assert r['bls_real_sectoral_output_is_not_bea_gross_output'] is True
          assert r['be_a_real_output_484_2017_2024_available'] is False
          assert r['bls48412_is_combined_long_distance_not_ltl_484122_or_tl_484121'] is True
          assert r['real_paid_customer_freight_invoices_observed']==0
          assert r['recoverable_freight_audit_tam_usd'] is None
          assert r['original_18_real_customer_pilot_requirements_unmet'] is True
          assert r['scheduled_tasks_created_or_modified'] is False
          assert r['lab']==14 and r['new_lab_created'] is False
          assert len(labs['lab_runs'])==14 and labs['failed_or_blocked_labs']==[]
          assert labs['pilot_preflight']['unmet_requirements']==18
          assert labs['actual_revenue_cents']==0
          assert labs['bls_real_sectoral_output_m31']['receipt_sha256']==r['receipt_sha256']
          assert 'bls_sectoral_output.html' in Path('/tmp/retally-m31-control/index.html').read_text()
          print('Original 14 labs remain intact; 24 annual BLS source cells in historical snapshot; 18 real customer pilots unresolved.')
          PY
      - name: Retain only derived BLS sectoral-output report receipts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: retally-lab14-bls-sectoral-output-offline
          path: |
            /tmp/retally-m31-offline/bls_sectoral_output.json
            /tmp/retally-m31-offline/bls_sectoral_output.html
          if-no-files-found: error
          retention-days: 14

  verify-original-bls-three-sectoral-output-series:
    needs: offline-sectoral-output-falsification-and-original-lab14
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Fetch 24 original BLS annual IPU observations, using correctly padded native industry IDs
        run: |
          PYTHONPATH=. python -m freight.research_bls_sectoral_output_m31 \
            --fetch-original --as-of-date "$(date -u +%F)" \
            --out /tmp/retally-m31-original
      - name: Verify exact BLS A01 series and reject false BEA gross-output/real invoice claims
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('/tmp/retally-m31-original/bls_sectoral_output.json').read_text())
          assert r['scope']=='LAB14_M31_FIRST_PARTY_BLS_SECTORAL_OUTPUT_OUTPUT_MEASUREMENT_NOT_BEA_GROSS_OUTPUT'
          assert r['lab']==14 and r['new_lab_created'] is False
          assert r['original_bls_api_v2_native_ids']==['IPUIN484___T010000000','IPUIN4841__T010000000','IPUIN48412_T010000000']
          assert r['historically_observed_original_bls_source_annual_cells']==24
          assert r['bls_real_sectoral_output_is_not_bea_gross_output'] is True
          assert r['bls_real_sectoral_output_is_not_bea_gdp_value_added'] is True
          assert r['bls_sectoral_output_and_m29_revenue_proxy_can_share_input_sources'] is True
          assert r['gross_output_original_bea_naics484_source_still_unverified'] is True
          assert r['be_a_real_output_484_2017_2024_available'] is False
          assert r['bls48412_is_combined_long_distance_not_ltl_484122_or_tl_484121'] is True
          assert r['comparison_verdict']=='DESCRIPTIVE_DIFFERENCE_NOT_VALIDATED_MODEL_ERROR_OR_OFFICIAL_BEA_REAL_OUTPUT'
          assert r['aggregate_naics484_real_sectoral_output_2017_2024_pct']=='4.02'
          assert r['m29_aggregate_illustrative_census_ppi_revenue_proxy_2017_2024_pct']=='1.18'
          assert r['bls_minus_ppi_proxy_descriptive_gap_percentage_points']=='2.84'
          assert r['real_paid_customer_freight_invoices_observed']==0
          assert r['independently_adjudicated_overcharges_observed']==0
          assert r['recoverable_freight_audit_tam_usd'] is None
          assert r['refund_cash_proven_usd'] is None
          assert r['buyer_demand_verified'] is False
          assert r['original_18_real_customer_pilot_requirements_unmet'] is True
          assert r['scheduled_tasks_created_or_modified'] is False
          assert len(r['receipt_sha256'])==64
          if r['status']=='M31_VERIFIED_DIRECT_BLS_IP_THREE_INDUSTRY_24_A01_ANNUAL_RECORDS':
            assert r['fresh_original_bls_output_source_replayed_this_run'] is True
            assert r['fresh_original_bls_source_year_cells_authenticated']==24
            assert len(r['fresh_api_response_sha256'])==64
            assert len(r['fresh_semantic_values_receipt_sha256'])==64
            by={p['naics']:p for p in r['original_bls_sectoral_output_industry_series']}
            assert [by[c]['2024_index'] for c in ('484','4841','48412')]==['104.019','105.912','102.984']
            print('SOURCE VERIFIED: all 24 BLS original A01 sectoral-output years, BEA gross output still held.')
          elif r['status']=='M31_BLS_PUBLIC_IP_API_UNREACHABLE_0_NEW_VERIFIED_ANNUAL_VALUES':
            assert r['fresh_original_bls_output_source_replayed_this_run'] is False
            assert r['fresh_original_bls_source_year_cells_authenticated']==0
            assert r['fresh_api_response_sha256'] is None
            print('::warning::BLS API network unavailable; no freshly authenticated annual output.')
          else:
            raise AssertionError('M31_ORIGINAL_BLS_API_SOURCE_CHANGED_OR_UNAUTHORIZED_STATUS')
          PY
      - name: Retain only proof receipts (no raw BLS, BEA keys or customer data)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: retally-lab14-bls-sectoral-output-original-proof
          path: |
            /tmp/retally-m31-original/bls_sectoral_output.json
            /tmp/retally-m31-original/bls_sectoral_output.html
          if-no-files-found: error
          retention-days: 14
