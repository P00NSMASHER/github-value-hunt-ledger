name: RETALLY CMA CGM 2022 Detention Source-Bytes Verification

on:
  pull_request:
    paths:
      - '.github/workflows/retally-cma-2022-det-tariff-verification.yml'
      - 'freight/research/authorized_original_case_fetch.py'
      - 'freight/test_authorized_original_case_fetch.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: retally-cma-2022-original-source-${{ github.sha }}
  cancel-in-progress: false

jobs:
  original-rate-document:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact research head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Pinned PDF reader
        run: python -m pip install --disable-pip-version-check --no-input 'pypdf==5.9.0'
      - name: Test document identity and never infer Sungold actual recovery
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -m unittest -q freight.test_authorized_original_case_fetch
          python - <<'PY'
          import json
          import hashlib
          from freight.research.authorized_original_case_fetch import (
              AcquisitionHold, SOURCE_REGISTRY, fetch_pinned_pdf, inspect_pdf_text,
          )
          names = (
              'cma-cgm-india-2022-export-det-primary-tariff-pdf',
              'cma-cgm-anl-india-2022-split-dd-tariff-pdf',
          )
          results = []
          for name in names:
              row={'source_id': name, 'source_url': SOURCE_REGISTRY[name]['url']}
              try:
                  source = fetch_pinned_pdf(name)
                  review = inspect_pdf_text(name, source)
                  row.update({
                      'bytes': len(source),
                      'source_sha256': hashlib.sha256(source).hexdigest(),
                      'source_text_status': review.get('source_text_status'),
                      'source_page_count': review.get('extracted_page_count'),
                      'source_text_sha256': review.get('normalized_page_text_sha256'),
                      'source_signals': review.get('source_signals', {}),
                      'state': 'ORIGINAL_PDF_FETCHED_IN_MEMORY',
                  })
              except AcquisitionHold as exc:
                  row.update({'state':'SOURCE_HOLD','reason':str(exc)})
              results.append(row)
          print(json.dumps({
              'status':'SOURCE_RECEIPTS_ONLY_NO_FREIGHT_RELEASE',
              'evidence':[dict(x) for x in results],
              'original_private_invoice_exhibits_acquired':False,
              'actual_customer_bank_refund_verified':False,
              'case_rate_effectiveness_verified':False,
              'original_pdf_bytes_uploaded_to_github':False,
          },indent=2,sort_keys=True))
          # Rate source availability is separately inspectable per record.
          # Do not turn unavailability into an invented tariff or recovered cash.
          PY
