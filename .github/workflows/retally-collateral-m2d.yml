name: RETALLY collateral M2D acceptance
on:
  push:
    branches:
      - "mission2g/first-customer-gate-20261008"
    paths:
      - "freight/brand/mission2b/**"
      - ".github/workflows/retally-collateral-m2d.yml"
  pull_request:
    paths:
      - "freight/brand/mission2b/**"
      - ".github/workflows/retally-collateral-m2d.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  finance-and-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Validate canonical factual register and synthetic calculations
        shell: bash
        run: |
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path("freight/brand/mission2b")
          a=json.loads((p/"COMMERCIAL_TRUTH_M2C_V1.json").read_text())
          b=json.loads((p/"source/commercial_truth.json").read_text())
          assert a==b,"generator and canonical truth files diverge"
          assert a["synthetic_public_aggregate"]["eligible_base_verdict"]=="UNVERIFIED_UNALLOCATED_DIFFERENCE"
          assert not a["synthetic_public_aggregate"]["real_customer_outcome"]
          print("source registers match; published eligibility unverified")
          PY
          python -m unittest discover -s freight/brand/mission2b -p 'test_*m2*.py' -v
  print-and-document-gate:
    needs: finance-and-source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: FAIL CLOSED if approved original assets are missing or altered
        shell: bash
        run: |
          python - <<'PY'
          import json,pathlib,hashlib
          p=pathlib.Path("freight/brand/mission2b")
          t=json.loads((p/"source/commercial_truth.json").read_text())
          for kind in ("wordmark","emblem"):
              name=f"retally-{kind}-approved.png"
              f=p/"assets"/name
              if not f.is_file():
                  raise SystemExit(f"BLOCKED: approved source master absent: {f}; retain draft status")
              actual=hashlib.sha256(f.read_bytes()).hexdigest()
              assert actual==t["approved_brand"][f"{kind}_sha256"],f"UNAPPROVED LOGO BYTES: {name}"
          PY
      - name: Install local rendering requirements (no public deployment)
        shell: bash
        run: |
          python -m pip install -r freight/brand/mission2b/source/requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y -qq libreoffice-writer fonts-crosextra-carlito
      - name: Build and independently verify 12 document pairs
        shell: bash
        run: |
          cd freight/brand/mission2b/source
          python build_collateral.py
          mkdir -p ../pdf ../qa
          libreoffice --headless --convert-to pdf --outdir ../pdf ../docx/*.docx
          python acceptance_qa.py
          python - <<'PY'
          from pathlib import Path
          import json
          r=json.loads((Path("../qa")/"m2c_acceptance.json").read_text())
          assert len(r["documents"])==12 and r["total_pages"]==23 and not r["errors"]
          print("12 PDFs / 23 pages; ACCEPTANCE SUCCESS")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: retally-M2D-INTERNAL-REVIEW-ONLY
          path: |
            freight/brand/mission2b/docx/*.docx
            freight/brand/mission2b/pdf/*.pdf
            freight/brand/mission2b/qa/m2c_acceptance.json
          retention-days: 14
