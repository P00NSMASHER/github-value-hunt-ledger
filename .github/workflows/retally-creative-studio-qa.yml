name: RETALLY creative studio QA (draft-only)
on:
  pull_request:
    paths:
      - 'freight/brand/social/creative-lab/**'
      - 'freight/site/assets/brand/retally-wordmark-approved.png'
      - 'freight/site/assets/images/terminal-blue-hour.webp'
      - '.github/workflows/retally-creative-studio-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-and-render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install pinned offline renderer dependency
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Unit and render smoke tests
        run: python -m unittest discover -s freight/brand/social/creative-lab -p 'test_*.py' -v
      - name: Render canonical-source graphics for internal review ONLY
        run: |
          python freight/brand/social/creative-lab/render_social.py \
            --repo-root . --mode production --concept all \
            --output-dir "$RUNNER_TEMP/retally-graphics-review"
          python - "$RUNNER_TEMP/retally-graphics-review/manifest.json" <<'PY'
          import json,sys
          m=json.load(open(sys.argv[1]))
          assert m['no_publication'] is True
          assert m['human_approval_required'] is True
          assert m['approved_wordmark_sha256']=='08421ccd7e8b1db752002f7ea177e76c83b6ee1cae40cf8b459368ade0c4eadd'
          assert {a['concept'] for a in m['assets']}=={'rate_versions','accessorial_proof','credit_chain'}
          assert all(a['qa']['escaped_elements']==[] and a['qa']['preview_banner'] is False for a in m['assets'])
          PY
      - name: Render six differentiated Field Notes v3 posters and mobile previews
        run: |
          python freight/brand/social/creative-lab/render_social_v3.py \
            --repo-root . --mode production --concept all \
            --output-dir "$RUNNER_TEMP/retally-graphics-v3-review"
          python - "$RUNNER_TEMP/retally-graphics-v3-review/manifest.json" <<'PY'
          import hashlib,json,sys
          from pathlib import Path
          report=json.loads(Path(sys.argv[1]).read_text())
          expected={'scope_first','fuel_authority','detention_clock',
                    'claim_evidence','settlement_status','secure_intake'}
          assert {x['concept'] for x in report['assets']}==expected
          assert len(report['content_proposals'])==6
          assert report['approved_wordmark_sha256']=='08421ccd7e8b1db752002f7ea177e76c83b6ee1cae40cf8b459368ade0c4eadd'
          assert report['no_publication'] is True
          assert report['network_calls'] is False
          assert report['human_approval_required'] is True
          assert report['needs_owner_source_rights_and_content_review'] is True
          assert all(not x['approved_for_publication'] for x in report['content_proposals'])
          assert len({x['recommended_educational_route'] for x in report['content_proposals']})==6
          for row in report['assets']:
              assert row['qa']['escaped_elements']==[],row['qa']
              assert row['qa']['logo']==[1619,257]
              assert row['qa']['preview_banner'] is False
              assert row['qa']['document_cards']==3
              for name,hash_name in (('image','image_sha256'),('mobile_preview','mobile_sha256')):
                  p=Path(row[name])
                  assert hashlib.sha256(p.read_bytes()).hexdigest()==row[hash_name]
          print('RETALLY v3: 6/6 distinct 1080×1350 + 390px QA visuals generated; never auto-published.')
          PY

      - name: Render six four-slide evidence carousels, full and phone size
        run: |
          python freight/brand/social/creative-lab/render_carousels_v4.py \
            --repo-root . --concept all \
            --output-dir "$RUNNER_TEMP/retally-v4-carousels"
          python - "$RUNNER_TEMP/retally-v4-carousels/manifest-v4.json" <<'PY'
          import json,hashlib,sys
          from pathlib import Path
          r=json.loads(Path(sys.argv[1]).read_text())
          assert r["status"]=="INTERNAL_DRAFT_ONLY_NOT_APPROVED_FOR_PUBLICATION"
          assert r["no_publication"] and r["no_network_requests"]
          assert r["source_photo_rights_review_required"]
          assert r["logo_sha256"]=="08421ccd7e8b1db752002f7ea177e76c83b6ee1cae40cf8b459368ade0c4eadd"
          assert r["slide_count"]==24 and r["phone_preview_count"]==24
          assert len(r["sources"])==6
          assert len(set(p["sha256"] for p in r["sources"].values()))==6
          assert all(not p["rights_verified_for_social"] for p in r["sources"].values())
          for x in r["slides"]:
              assert x["qa"]["escaped_elements"]==[],x
              assert x["qa"]["brand"]==[1619,257],x
              assert x["qa"]["has_draft_label"]
              assert not x["publication_approved"] and x["human_visual_review_required"]
              assert len(x["proposed_alt_text"])>75
              assert x["educational_page"].startswith("/")
              for path,sha in ((x["image"],x["sha256"]),(x["phone_preview"],x["phone_sha256"])):
                  assert hashlib.sha256(Path(path).read_bytes()).hexdigest()==sha
          print("RETALLY v4: 24/24 large-type carousel slides + 24/24 phone previews passed source and editorial gates")
          PY

      - name: Upload visual QA artifacts (not publishing assets)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: retally-creative-review-draft-only
          path: |
            ${{ runner.temp }}/retally-graphics-review/
            ${{ runner.temp }}/retally-graphics-v3-review/
            ${{ runner.temp }}/retally-v4-carousels/
          retention-days: 7
