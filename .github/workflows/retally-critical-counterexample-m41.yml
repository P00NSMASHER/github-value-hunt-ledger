name: RETALLY Lab 14 Four Critical Counterexample Analogs (Mission 41)
on:
  pull_request:
    paths:
      - '.github/workflows/retally-critical-counterexample-m41.yml'
      - 'freight/lab_critical_counterexample_replay_m41.py'
      - 'freight/test_lab_critical_counterexample_replay_m41.py'
      - 'freight/lab_phase4_director.py'
      - 'freight/lab_cross_lab_assurance_m39.py'
      - 'freight/lab_phase4_control_center.py'
      - 'freight/RESEARCH_CRITICAL_ANALOG_REPLAY_M41.md'
      - 'freight/lab_assurance.py'
      - 'freight/test_lab_assurance.py'
      - 'freight/research/LAB_FINDINGS_CUMULATIVE.json'
  workflow_dispatch:
permissions:
  contents: read

jobs:
  critical-analog-replays-and-fourteen-labs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install inherited offline-only research dependencies
        run: |
          python -m pip install -r production/requirements-ci.txt
          python -m pip install cryptography==46.0.4 openpyxl==3.1.5
      - name: Execute four actual code negative paths and inherited safety regressions
        run: |
          PYTHONPATH=. python -m pytest -q \
            freight/test_lab_critical_counterexample_replay_m41.py \
            freight/test_lab_assurance.py \
            freight/test_lab_phase3_real_chain.py \
            freight/test_lab_phase4_director.py \
            freight/test_lab_cross_lab_assurance_m39.py \
            freight/test_lab_historical_disposition_m40.py \
            freight/test_lab_phase4_experiments.py \
            freight/test_lab_experiment_ledger.py \
            freight/test_research_pilot_preflight.py
      - name: Generate actual modern source negative replay and existing 14-lab control report
        run: |
          PYTHONPATH=. python -m freight.lab_critical_counterexample_replay_m41 \
            --as-of-date "$(date -u +%F)" --out /tmp/retally-m41
          PYTHONPATH=. python -m freight.lab_phase4_control_center \
            --out /tmp/retally-m41-control
          python - <<'PY'
          import json
          from pathlib import Path
          v=json.loads(Path('/tmp/retally-m41/critical_counterexample_replay.json').read_text())
          d=json.loads(Path('/tmp/retally-m41-control/phase4_control.json').read_text())
          assert v['scope']=='RETALLY_LAB14_M41_CRITICAL_SYNTHETIC_COUNTEREXAMPLE_ANALOG_REPLAY'
          assert v['current_source_paths_attacked']==4
          assert v['current_source_guards_rejected_attack']==4
          assert v['historical_original_defects_open']==26
          assert v['historical_original_defects_closed']==0
          assert v['original_pinned_vulnerable_revisions_replayed']==0
          assert v['independent_customer_pilot_controls_unmet']==18
          assert v['external_empirical_commercial_claims_approved']==0
          assert [r['historical_finding_id'] for r in v['cases']]==[
              'LAB-P0-01','LAB-P0-02','LAB-P0-03','D-01']
          assert all(c['observed_denial']==c['expected_independent_verifier_denial']
                     and not c['original_defect_verified_repaired']
                     for c in v['cases'])
          assert len(d['lab_runs'])==14 and not d['failed_or_blocked_labs']
          assert d['cross_lab_integrity_m39']['all_fourteen_locally_executed'] is True
          assert d['historical_finding_disposition_m40']['original_historical_findings_open']==26
          assert d['critical_counterexamples_m41']['receipt_sha256']==v['receipt_sha256']
          assert 'critical_counterexample_replay.html' in Path('/tmp/retally-m41-control/index.html').read_text()
          print('M41: 4/4 current-code synthetic analog attacks denied; 14 original labs pass; 26 original findings still open.')
          PY
      - name: Retain synthetic-derived internal evidence only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: retally-m41-current-code-critical-analog-receipts
          path: |
            /tmp/retally-m41/critical_counterexample_replay.json
            /tmp/retally-m41/critical_counterexample_replay.html
          if-no-files-found: error
          retention-days: 14

  independent-wrong-denial-and-positive-control-proof:
    needs: critical-analog-replays-and-fourteen-labs
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Prove accepted fraud and wrong failure codes invalidate results
        run: |
          PYTHONPATH=. python - <<'PY'
          from types import SimpleNamespace
          from unittest.mock import patch
          from freight.lab_assurance import AssuranceRejected
          from freight.lab_critical_counterexample_replay_m41 import (
              BASELINE,replay_one,FINDING_IDS,EXPECTED_REJECTIONS
          )
          for fid in FINDING_IDS:
              r=replay_one(fid)
              assert r['observed_denial']==EXPECTED_REJECTIONS[fid]
              assert r['historical_disposition']=='OPEN_UNVERIFIED'
              assert r['original_defect_verified_repaired'] is False
          good=SimpleNamespace(status='PASS_SYNTHETIC_ONLY',
              scope='SIGNED_SYNTHETIC_EVIDENCE_ONLY',
              verified_claims=1,verified_receipts=2,
              currency_totals={'USD':BASELINE})
          from freight import lab_critical_counterexample_replay_m41 as m41
          with patch.object(m41,'_observe',return_value=good):
              try:
                  replay_one('LAB-P0-01')
              except ValueError as exc:
                  assert 'ACCEPTED_FORGED_EVIDENCE' in str(exc)
              else:
                  raise AssertionError('Unsupported fake cash receipt accepted')
          with patch.object(m41,'_observe',
                            side_effect=[good,AssuranceRejected('WRONG_REASON')]):
              try:
                  replay_one('D-01')
              except ValueError as exc:
                  assert 'WRONG_DENIAL_MECHANISM' in str(exc)
              else:
                  raise AssertionError('Wrong failure code counted as coverage')
          print('M41 independent process: 4 positive+negative witnesses, accepted fraud and wrong exception both fail closed.')
          PY
