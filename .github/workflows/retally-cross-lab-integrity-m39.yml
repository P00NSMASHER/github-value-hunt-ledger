name: RETALLY Phase 4 Cross-Lab Synthetic Integrity (Mission 39)
on:
  pull_request:
    paths:
      - '.github/workflows/retally-cross-lab-integrity-m39.yml'
      - 'freight/lab_cross_lab_assurance_m39.py'
      - 'freight/test_lab_cross_lab_assurance_m39.py'
      - 'freight/lab_phase4_control_center.py'
      - 'freight/lab_phase4_experiments.py'
      - 'freight/RESEARCH_CROSS_LAB_ASSURANCE_M39.md'
      - 'freight/lab_phase4_director.py'
      - 'freight/lab_phase3_simulated_pilot.py'
  workflow_dispatch:
permissions:
  contents: read

jobs:
  full-fourteen-lab-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install inherited local-only test dependencies
        run: |
          python -m pip install -r production/requirements-ci.txt
          python -m pip install cryptography==46.0.4 openpyxl==3.1.5
      - name: Adversarial M39, fourteen labs, campaign and prior source truth
        run: |
          PYTHONPATH=. python -m pytest -q \
            freight/test_lab_cross_lab_assurance_m39.py \
            freight/test_lab_phase4_director.py \
            freight/test_lab_phase4_experiments.py \
            freight/test_research_claim_quarantine_m38.py \
            freight/test_research_source_lineage_m37.py \
            freight/test_research_claim_clearance_m35.py \
            freight/test_research_pilot_preflight.py \
            freight/test_research_economic_denominator_m34.py
      - name: Recreate original fourteen-lab Control Center and validate M39
        run: |
          PYTHONPATH=. python -m freight.lab_phase4_control_center \
            --out /tmp/retally-m39-control
          python - <<'PY'
          from pathlib import Path
          import json
          d=Path('/tmp/retally-m39-control')
          labs=json.loads((d/'phase4_control.json').read_text())
          r=json.loads((d/'cross_lab_assurance.json').read_text())
          assert len(labs['lab_runs'])==14
          assert labs['executed_labs']==list(range(1,15))
          assert labs['failed_or_blocked_labs']==[]
          assert labs['actual_revenue_cents']==0
          assert r['scope']=='RETALLY_PHASE4_M39_CROSS_LAB_INVARIANT_ASSURANCE_SYNTHETIC_ONLY'
          assert r['all_fourteen_locally_executed'] is True
          assert r['locally_executed_count']==14
          assert r['negative_probes_exactly_bound']==14
          assert r['blocked_or_unexecuted_count']==0
          assert r['real_customers_observed']==0
          assert r['real_customer_revenue_cents']==0
          assert r['external_marketing_or_publication_authorized'] is False
          assert r['frozen_historical_findings_not_auto_closed']==26
          assert r['receipt_sha256']==labs['cross_lab_integrity_m39']['receipt_sha256']
          assert len(r['laboratory_results'])==14
          assert 'cross_lab_assurance.html' in (d/'index.html').read_text()
          assert labs['research_claim_quarantine_m38']['independently_unverified_human_pilot_controls']==18
          assert labs['research_claim_clearance_m35']['external_commercial_claims_authorized']==0
          print('M39 verified original 14 local labs, 14 bound negative probes, three fictional pilot customers, 26 unchanged findings, zero external authority.')
          PY
      - name: Retain only synthetic integrity decision evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: retally-m39-cross-lab-internal-receipt
          path: |
            /tmp/retally-m39-control/cross_lab_assurance.json
            /tmp/retally-m39-control/cross_lab_assurance.html
          if-no-files-found: error
          retention-days: 14

  separately-rehashed-attack-proof:
    needs: full-fourteen-lab-integrity
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install inherited local-only dependencies
        run: |
          python -m pip install -r production/requirements-ci.txt
          python -m pip install cryptography==46.0.4 openpyxl==3.1.5
      - name: Independently reject rehashed forged lab passes and real-cash claims
        run: |
          PYTHONPATH=. python - <<'PY'
          from copy import deepcopy
          from freight.lab_phase4_director import execute_all_labs
          from freight.lab_cross_lab_assurance_m39 import assess, FULL
          from freight.lab_assurance import digest
          from freight.test_lab_phase3_real_chain import rating_fixture, funded_store, scenario
          from freight.test_lab_assurance import assertions_and_fees, verifier
          import tempfile
          def rehash(r):
              out=deepcopy(r)
              stable={**out,'lab_runs':[{k:v for k,v in row.items()
                                        if k!='elapsed_ms'} for row in out['lab_runs']]}
              del stable['receipt_sha256']
              out['receipt_sha256']=digest(stable)
              return out
          with tempfile.TemporaryDirectory() as td:
              rec,book=rating_fixture()
              store=funded_store(td)
              a,fees=assertions_and_fees()
              original=execute_all_labs(record=rec,authority_book=book,store=store,
                  assertions=a,fee_events=fees,verifier=verifier(),
                  contingency=scenario())
          assert assess(original,require_complete=True)['local_review_decision']==FULL
          attacks=[
              lambda x: x['lab_runs'][1].update(negative_probe='FAKE_PASS'),
              lambda x: x['lab_runs'][12]['proof'].update(actual_customer_margin_cents=10),
              lambda x: x['lab_runs'][13]['proof'].update(research_m38_external_claims_authorized=1),
              lambda x: x.update(actual_revenue_cents=10),
              lambda x: x.update(hosted_staging_certified=True),
          ]
          for mutate in attacks:
              r=deepcopy(original)
              mutate(r)
              try:
                  assess(rehash(r),require_complete=True)
              except ValueError:
                  pass
              else:
                  raise AssertionError('Rehashed misleading lab evidence was accepted')
          print('M39 independent negative proof: 5 rehashed execution, fake-money and publication attacks rejected.')
          PY
