name: RETALLY Lab 14 Durable Technical Review Replay Barrier (Mission 52)
on:
  pull_request:
    paths:
      - '.github/workflows/retally-durable-technical-replay-m52.yml'
      - 'freight/recovery_replay_m52.py'
      - 'freight/lab_recovery_replay_m52.py'
      - 'freight/test_lab_recovery_replay_m52.py'
      - 'freight/backup_restore.py'
      - 'freight/lab_phase4_director.py'
      - 'freight/lab_cross_lab_assurance_m39.py'
      - 'freight/test_lab_cross_lab_assurance_m39.py'
      - 'freight/lab_phase4_control_center.py'
      - 'freight/RESEARCH_TECHNICAL_REPLAY_M52.md'
  workflow_dispatch:
permissions:
  contents: read

jobs:
  replay-ledger-concurrency-rollback-and-original-fourteen-labs:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install only inherited offline research and Ed25519 dependencies
        run: |
          python -m pip install -r production/requirements-ci.txt
          python -m pip install cryptography==46.0.4 openpyxl==3.1.5
      - name: Real technical-request nonce deduplication, six-way contention, rollback and prior labs
        run: |
          PYTHONPATH=. python -m pytest -q \
            freight/test_lab_recovery_replay_m52.py \
            freight/test_lab_recovery_witness_m51.py \
            freight/test_lab_recovery_admission_m50.py \
            freight/test_lab_dual_ledger_backup_m49.py \
            freight/test_backup_restore.py \
            freight/test_lab_audit_trust_boundary_m48.py \
            freight/test_audit_store.py \
            freight/test_audit_ledger.py \
            freight/test_lab_file_continuity_m47.py \
            freight/test_lab_schema_integrity_m46.py \
            freight/test_lab_atomic_financial_m45.py \
            freight/test_lab_persistent_semantic_m44.py \
            freight/test_settlement_store.py \
            freight/test_settlement_report.py \
            freight/test_lab_settlement_source_m43.py \
            freight/test_lab_settlement_identity_m42.py \
            freight/test_lab_critical_counterexample_replay_m41.py \
            freight/test_lab_assurance.py \
            freight/test_lab_phase3_real_chain.py \
            freight/test_lab_phase4_director.py \
            freight/test_lab_cross_lab_assurance_m39.py \
            freight/test_lab_historical_disposition_m40.py \
            freight/test_lab_phase4_experiments.py \
            freight/test_lab_experiment_ledger.py \
            freight/test_research_pilot_preflight.py
      - name: Reproduce fourteen original valid and fourteen exact replay-negative journal proofs
        run: |
          PYTHONPATH=. python -m freight.lab_recovery_replay_m52 \
            --as-of-date "$(date -u +%F)" --out /tmp/retally-m52
          PYTHONPATH=. python -m freight.lab_phase4_control_center \
            --out /tmp/retally-m52-control
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('/tmp/retally-m52/review_replay_m52.json').read_text())
          c=json.loads(Path('/tmp/retally-m52-control/phase4_control.json').read_text())
          assert r['scope']=='RETALLY_LAB14_M52_DURABLE_LOCAL_TECH_REVIEW_REPLAY_DENIAL_SYNTHETIC'
          assert r['original_research_labs']==14 and r['new_lab_created'] is False
          assert r['synthetic_original_technical_review_positive_controls']==14
          assert r['durable_review_replay_negative_scenarios']==14
          assert r['exact_current_replay_and_journal_denials']==14
          assert r['global_restore_request_uniqueness_enforced'] is True
          assert r['global_witness_nonce_uniqueness_enforced'] is True
          assert r['sqlite_replay_consumptions_atomic_and_rollback_verified'] is True
          assert r['independently_trusted_distributed_nonce_service_established'] is False
          assert r['real_customer_restore_activation_performed'] is False
          assert r['historical_original_findings_open']==26
          assert r['historical_original_findings_closed']==0
          assert r['independent_first_customer_human_controls_unmet']==18
          assert r['actual_customer_cash_recovered'] is None
          assert r['externally_publishable_empirical_claims_approved']==0
          assert len(r['cases'])==14
          assert all(row['initial_two_key_review_recorded_technical_only']
                     and row['adversarial_replay_attempt_rejected']
                     and row['source_backup_and_restore_images_untouched']
                     and not row['production_activation_or_customer_approval']
                     and row['historical_original_findings_closed']==0
                     for row in r['cases'])
          assert c['executed_labs']==list(range(1,15))
          assert len(c['lab_runs'])==14 and c['failed_or_blocked_labs']==[]
          assert c['cross_lab_integrity_m39']['all_fourteen_locally_executed'] is True
          assert c['technical_review_replay_m52']['receipt_sha256']==r['receipt_sha256']
          assert c['technical_recovery_witness_m51']['exact_current_witness_gate_denials']==22
          assert c['historical_finding_disposition_m40']['original_historical_findings_open']==26
          assert c['actual_revenue_cents']==0
          assert 'review_replay_m52.html' in Path('/tmp/retally-m52-control/index.html').read_text()
          print('M52: fourteen original approved fictional technical reviews, fourteen exact durable replay rejections, zero real approvals, all fourteen original labs.')
          PY
      - name: Retain derived synthetic metadata only, never local replay databases or keys
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: retally-m52-local-technical-replay-negatives-only
          path: |
            /tmp/retally-m52/review_replay_m52.json
            /tmp/retally-m52/review_replay_m52.html
          if-no-files-found: error
          retention-days: 14

  independent-pinned-prior-m51-stateless-versus-m52-one-time-differential:
    needs: replay-ledger-concurrency-rollback-and-original-fourteen-labs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install original test data and crypto dependencies
        run: |
          python -m pip install -r production/requirements-ci.txt
          python -m pip install cryptography==46.0.4
      - name: Fetch exact original pre-M52 M51 reviewer source
        run: |
          git fetch --no-tags --depth=1 origin bc27e1506c24e73208e362f3a71bffa44ea280e5
          git show bc27e1506c24e73208e362f3a71bffa44ea280e5:freight/backup_restore.py > /tmp/m52_prior_stateless_backup.py
          test -s /tmp/m52_prior_stateless_backup.py
      - name: Prove the original M51 review accepted same signed request twice but M52 rejects replay
        run: |
          PYTHONPATH=. python - <<'PY'
          import importlib.util,sys,tempfile
          from dataclasses import asdict
          from pathlib import Path
          from freight import backup_restore as current
          from freight.recovery_replay_m52 import TechnicalReviewReplayLedger
          from freight.lab_recovery_witness_m51 import _make_known_good
          from freight.lab_recovery_replay_m52 import _new_signed_context
          name='m52_original_unspent_m51'
          spec=importlib.util.spec_from_file_location(name,'/tmp/m52_prior_stateless_backup.py')
          previous=importlib.util.module_from_spec(spec)
          sys.modules[name]=previous
          spec.loader.exec_module(previous)
          assert not hasattr(previous,'record_witnessed_recovery_review')
          with tempfile.TemporaryDirectory() as td:
              root=Path(td)
              bundle,result,manifest,keys,kwargs=_make_known_good(root)
              pre=previous.BackupRestoreResult(**asdict(result))
              assert previous.verify_witnessed_recovery_bundle(bundle,pre,**kwargs)['technical_witness_count']==2
              assert previous.verify_witnessed_recovery_bundle(bundle,pre,**kwargs)['technical_witness_count']==2
              journal=TechnicalReviewReplayLedger(root/'separate-local-replay.sqlite3',create=True)
              first=current.record_witnessed_recovery_review(
                  bundle,result,replay_ledger=journal,**kwargs)
              assert first['review_attempt_recorded_once'] is True
              try:
                  current.record_witnessed_recovery_review(
                      bundle,result,replay_ledger=journal,**kwargs)
              except ValueError as exc:
                  assert 'M52_REPLAY_REQUEST_ALREADY_CONSUMED' in str(exc)
              else:
                  raise AssertionError('M52 accepted original identical replay')
              new_signed=_new_signed_context(
                  kwargs,keys,'independent-nonce-replay',preserve_nonce_role=0)
              assert previous.verify_witnessed_recovery_bundle(
                  bundle,pre,**new_signed)['technical_witness_count']==2
              try:
                  current.record_witnessed_recovery_review(
                      bundle,result,replay_ledger=journal,**new_signed)
              except ValueError as exc:
                  assert 'M52_REPLAY_WITNESS_NONCE_ALREADY_CONSUMED' in str(exc)
              else:
                  raise AssertionError('M52 accepted reused signed nonce')
              assert journal.verify()['technical_review_rows']==1
              assert journal.verify()['durable_individual_witness_nonces']==2
          print('M52 pinned previous/current differential: original M51 accepted identical review twice and a reused signer nonce on a new valid request; M52 permits only first, then rejects both replay classes atomically.')
          PY
