name: RETALLY Epiq public docket diagnostic (temporary)
on:
  pull_request:
    paths:
      - '.github/workflows/retally-epiq-docket-diagnostic-temp.yml'
permissions:
  contents: read
jobs:
  public-docket:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect exact public court orders 623 and 593 for claim 10002
        shell: bash
        run: |
          python - <<'PY'
          import re,hashlib,subprocess,tempfile,os
          from urllib.request import Request,urlopen
          entries=[(623,1227468),(593,1216147)]
          for docket,id in entries:
              url=f"https://document.epiq11.com/document/getdocumentsbydocket/?docketId={id}&projectCode=MCX&docketNumber={docket}&source=DM"
              try:
                  req=Request(url,headers={"User-Agent":"Mozilla/5.0 (public court records research)","Accept":"application/pdf"})
                  with urlopen(req,timeout=25) as r:
                      data=r.read(25_000_000)
                      print("PUBLIC_DOCKET",docket,"HTTP",r.status,"TYPE",r.headers.get("Content-Type"),"LENGTH",len(data),"SHA256",hashlib.sha256(data).hexdigest())
                  if data[:4]!=b"%PDF":
                      print("NOT_PDF_FIRST_BYTES",repr(data[:70]))
                      continue
                  with tempfile.TemporaryDirectory() as temp:
                      p=os.path.join(temp,"court_order.pdf")
                      with open(p,"wb") as g:g.write(data)
                      meta=subprocess.run(["pdfinfo",p],capture_output=True,text=True,timeout=12)
                      print("PDF_METADATA",docket,[(x.strip()) for x in meta.stdout.splitlines() if x.startswith(("Pages:","File size:","Title:"))])
                      run=subprocess.run(["pdftotext","-layout",p,"-"],capture_output=True,text=True,timeout=30)
                      text=run.stdout[:2_000_000]
                      print("PDF_TEXT_STATUS",docket,run.returncode,"CHARS",len(text))
                      for needle in ("GlobalTranz","10002","25,954.47","1,496.52","24,457.95"):
                          m=list(re.finditer(re.escape(needle),text,re.I))
                          print("MATCH",docket,needle,len(m))
                          for found in m[:6]:
                              snippet=text[max(0,found.start()-350):min(len(text),found.end()+460)]
                              print("CASE_SNIPPET",docket,needle," ".join(snippet.split())[:720])
              except Exception as exc:
                  print("PUBLIC_DOCKET_FETCH_FAILURE",docket,type(exc).__name__,str(exc)[:250])
          print("No raw court documents or third-party invoice contents retained or committed.")
          PY
