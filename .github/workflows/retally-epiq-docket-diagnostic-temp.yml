name: RETALLY Epiq public docket diagnostic (temporary)
on:
  pull_request:
    paths:
      - '.github/workflows/retally-epiq-docket-diagnostic-temp.yml'
permissions:
  contents: read
jobs:
  public-docket:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Identify public Epiq docket list endpoint without accessing document contents
        shell: bash
        run: |
          python - <<'PY'
          import re
          from urllib.request import Request,urlopen
          u="https://dm.epiq11.com/dist/main-CGTEPJD6.js"
          req=Request(u,headers={"User-Agent":"Mozilla/5.0 (read-only public docket research)"})
          with urlopen(req,timeout=12) as resp:
              s=resp.read(9_000_000).decode("utf-8","replace")
          print("JS_VERSION_PUBLIC",len(s))
          for m in re.finditer(r"/api/",s):
              start=max(0,m.start()-120)
              end=min(len(s),m.end()+200)
              print("API_ROUTE_CONTEXT",s[start:end].replace("\n"," ")[:325])
          for term in ("searchDockets","getdockets","docketNumber","loadDockets","getDocketData"):
              print("FUNCTION",term)
              matches=list(re.finditer(re.escape(term),s,re.I))
              print("COUNT",len(matches))
              for m in matches[-5:]:
                  print("FUNCTION_CONTEXT",s[max(0,m.start()-250):m.end()+250].replace("\n"," ")[:530])
          print("No claims documents or private information accessed.")
          PY
