name: RETALLY Epiq public docket diagnostic (temporary)
on:
  pull_request:
    paths:
      - '.github/workflows/retally-epiq-docket-diagnostic-temp.yml'
permissions:
  contents: read
jobs:
  public-docket:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install bounded open-source PDF text reader
        run: python -m pip install --disable-pip-version-check --quiet pypdf==5.6.0
      - name: Read public objection/order schedules only; do not persist court PDFs
        shell: bash
        run: |
          python - <<'PY'
          import re,hashlib,io
          from urllib.request import Request,urlopen
          from pypdf import PdfReader
          for docket,id in [(623,1227468),(593,1216147)]:
              u=f"https://document.epiq11.com/document/getdocumentsbydocket/?docketId={id}&projectCode=MCX&docketNumber={docket}&source=DM"
              try:
                  with urlopen(Request(u,headers={"User-Agent":"Mozilla/5.0 (public bankruptcy docket research)"}),timeout=25) as r:
                      data=r.read(12_000_000)
                      print("PUBLIC_PDF",docket,r.status,len(data),hashlib.sha256(data).hexdigest())
                  if not data.startswith(b"%PDF"):continue
                  pdf=PdfReader(io.BytesIO(data),strict=False)
                  print("PDF_PAGES",docket,len(pdf.pages))
                  for page_idx,page in enumerate(pdf.pages):
                      text=page.extract_text() or ""
                      for needle in ("GlobalTranz", "10002","25,954.47","1,496.52","24,457.95"):
                          matches=list(re.finditer(re.escape(needle),text,re.I))
                          for m in matches[:4]:
                              excerpt=" ".join(text[max(0,m.start()-400):m.end()+550].split())
                              print("MATCH_DOCKET_PAGE",docket,page_idx+1,needle,excerpt[:920])
                  print("PDF_TEXT_REVIEW_COMPLETE",docket)
              except Exception as exc:
                  print("DOCUMENT_EXTRACTION_FAILURE",docket,type(exc).__name__,str(exc)[:250])
          print("Public court orders only; no original invoice PDFs, confidential data, or external outreach.")
          PY
