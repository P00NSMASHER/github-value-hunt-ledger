name: RETALLY Epiq public docket diagnostic (temporary)
on:
  pull_request:
    paths:
      - '.github/workflows/retally-epiq-docket-diagnostic-temp.yml'
permissions:
  contents: read
jobs:
  public-docket:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Read only the Epiq public docket shell and public script references
        shell: bash
        run: |
          python - <<'PY'
          import re
          from urllib.request import Request, urlopen
          urls = [
              "https://dm.epiq11.com/case/mosaiccompanies/dockets",
              "https://dm.epiq11.com/case/mosaiccompanies",
          ]
          for url in urls:
              try:
                  req = Request(url, headers={"User-Agent":"Mozilla/5.0 (RETALLY-public-research; read-only)", "Accept":"text/html"})
                  with urlopen(req, timeout=12) as resp:
                      data=resp.read(240_000).decode("utf-8","replace")
                      print("URL",url,"STATUS",resp.status,"CHARS",len(data),"HTML_TITLE",re.findall(r"<title[^>]*>(.*?)</title>",data,re.I|re.S)[:2])
                      scripts=re.findall(r'<script[^>]+src=["\']([^"\']+)',data,re.I)
                      print("PUBLIC_SCRIPT_PATHS",scripts[:20])
                      for token in ("GlobalTranz","623","Docket","api","__NEXT_DATA__","angular"):
                          print("HTML_TOKEN",token,token.lower() in data.lower())
              except Exception as exc:
                  print("PUBLIC_FETCH_FAILURE", url, type(exc).__name__,str(exc)[:160])
          print("No customer documents, private sources, emails, POSTs, or evidence bytes copied.")
          PY
