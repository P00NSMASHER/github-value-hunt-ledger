name: RETALLY Extreme 100 Synthetic Customer Cross-Stage Red Team v3

on:
  pull_request:
    paths:
      - 'freight/redteam_v3_compound_chaos_20261023.py'
      - 'freight/redteam_deep_generator_20261022.py'
      - 'freight/redteam_deep_engine_20261022.py'
      - '.github/workflows/retally-extreme-chaos-100-v3-20261023.yml'

permissions:
  contents: read

concurrency:
  group: retally-extreme-100-v3-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  cross-platform-100-customer-chaos:
    name: extreme-100-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - name: Checkout source-only test commit, no persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Pin Python runtime
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install bounded offline test dependencies
        run: python -m pip install --disable-pip-version-check --no-input pytest==8.4.2 tzdata==2025.2
      - name: Reject malformed test code before execution
        run: python -m compileall -q freight/redteam_v3_compound_chaos_20261023.py freight/redteam_deep_generator_20261022.py freight/redteam_deep_engine_20261022.py
      - name: Drive 100 compound source-to-buyer-to-carrier-to-settlement plus all six real rating modes
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          RETALLY_V3_REPORT_DIR: retally-v3-output
        run: python -m freight.redteam_v3_compound_chaos_20261023
      - name: Verify forensic source and scorecard completeness, never declare customer launch
        if: always()
        shell: bash
        run: |
          if [ ! -f retally-v3-output/v3_summary.json ]; then
            echo "NO FINAL EVIDENCE SUMMARY — source test was blocked or crashed."
            exit 1
          fi
          python - <<'PY'
          from pathlib import Path
          import json
          j=json.loads(Path("retally-v3-output/v3_summary.json").read_text())
          assert j["dataset_count"]==100 and j["unique_source_sha256"]==100
          assert j["money_moved"]==0 and j["real_customers"]==0
          assert j["actual_carrier_contacts"]==0
          assert j["empirical_freight_detection_accuracy"] is None
          assert set(j["six_actual_native_rating_modes"])=={
            "LTL","PARCEL","TL","INTERMODAL","AIR","OCEAN"
          }
          print("COMPLETE_SYNTHETIC_EVIDENCE",json.dumps(j,sort_keys=True))
          print("A green execution job is not evidence of an error-free engine.")
          PY
      - name: Preserve all fictional datasets and exact failed source-bound checks
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: RETALLY-v3-extreme-100-synthetic-${{ matrix.os }}
          path: |
            retally-v3-output/all_fictional_source_inputs.zip
            retally-v3-output/v3_report.json
            retally-v3-output/v3_summary.json
          if-no-files-found: error
          retention-days: 7
      - name: Ensure protected tracked engine files remain untouched
        run: git diff --exit-code -- freight .github
