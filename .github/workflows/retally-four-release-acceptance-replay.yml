name: RETALLY Four-Release Isolated Acceptance Replay

on:
  pull_request:
    paths:
      - 'freight/public_pennine_integration.py'
      - 'freight/test_public_pennine_integration.py'
      - 'freight/simulated_release_acceptance.py'
      - 'freight/test_simulated_release_acceptance.py'
      - 'freight/FOUR_RELEASE_GOVERNANCE_REHEARSAL.md'
      - '.github/workflows/retally-four-release-acceptance-replay.yml'

permissions:
  contents: read

jobs:
  safe-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install locked-by-policy test dependencies
        run: |
          python -m pip install --disable-pip-version-check -r production/requirements-ci.txt
          python -m pip install --disable-pip-version-check pymupdf==1.26.5
      - name: Full four-release regression and source schema controls
        run: |
          python -m pytest -q \
            freight/test_financial_integrity_r1.py \
            freight/test_original_pdf_extraction_r2.py \
            freight/test_sealed_real_accuracy_r3.py \
            freight/test_reliability_dashboard_r4.py \
            freight/test_public_pennine_integration.py \
            freight/test_simulated_release_acceptance.py \
            freight/test_phase3_accuracy.py
      - name: Replay unchanged original GlobalTranz and ArcBest invoices
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python - <<'PY'
          import json
          from freight.original_pdf_extraction import (
              fetch_frozen_public_original, parse_original_pdf, safe_summary,
          )
          report={}
          for source in ("GLOBALTRANZ","ARCBEST"):
              report[source]=safe_summary(parse_original_pdf(
                  source,fetch_frozen_public_original(source)))
          assert report["GLOBALTRANZ"]["original_invoice_count"]==100
          assert report["GLOBALTRANZ"]["typed_discount_or_credit_invoice_count"]==93
          assert report["GLOBALTRANZ"]["exact_original_invoice_amount_count"]==100
          assert report["ARCBEST"]["original_invoice_count"]==10
          assert report["ARCBEST"]["exact_original_invoice_amount_count"]==10
          assert report["ARCBEST"]["freight_error_accuracy"] is None
          print(json.dumps(report,sort_keys=True,indent=2))
          PY
      - name: Replay actual Pennine public disclosures with hardened kernel
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python - <<'PY'
          import json
          from freight.public_pennine_integration import (
              run_public_census_replay, assert_public_census_result)
          result=run_public_census_replay()
          assert_public_census_result(result)
          print(json.dumps(result,sort_keys=True,indent=2))
          PY
      - name: Simulate roles, bank source and rates; assert real acceptance remains held
        run: |
          python - <<'PY'
          import json
          from freight.simulated_release_acceptance import run_simulated_acceptance
          report=run_simulated_acceptance()
          assert report["all_controls_pass"] is True
          assert report["true_external_approval_observed"] is False
          assert report["externally_verified_bank_minor"] == 0
          assert report["external_real_freight_precision"] is None
          assert report["production_release_status"] == "RELEASE_HOLD"
          print(json.dumps(report,sort_keys=True,indent=2))
          PY
      - name: Final release fail-closed decision
        run: |
          python - <<'PY'
          from freight.reliability_dashboard import acceptance_snapshot
          snap=acceptance_snapshot(
              invoices_extracted=110, invoices_exact=110,pinned_source_files=7,
              accounting_invoice_population=273, accounting_matched=273,
              accounting_cross_scope_errors=0,freight_labeled=0,
              freight_unknown=110,precision=None)
          assert snap.release_status == "RELEASE_HOLD"
          assert "INDEPENDENT_RELEASE_REVIEW_MISSING" in snap.blockers
          assert "REAL_FREIGHT_ACCURACY_UNPROVEN" in snap.blockers
          print("PASS: simulated release is NOT production customer acceptance")
          PY
