name: RETALLY Lab 14 FRED BLS Parent PPI Provenance (Mission 27)
on:
  pull_request:
    paths:
      - '.github/workflows/retally-fred-parent-ppi.yml'
      - 'freight/research_fred_parent_ppi.py'
      - 'freight/test_research_fred_parent_ppi.py'
      - 'freight/research/FRED_PARENT_484_PPI_2017_2024_20261012.json'
      - 'freight/RESEARCH_FRED_PARENT_PPI_BRIDGE.md'
      - 'freight/lab_phase4_director.py'
      - 'freight/lab_phase4_control_center.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-fred-distributor-inspection:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Inspect public FRED redistribution of BLS aggregate PCU484484
        run: |
          python - <<'PY'
          from urllib.request import Request,urlopen
          from hashlib import sha256
          from html.parser import HTMLParser
          import re
          class Text(HTMLParser):
            def __init__(self): super().__init__();self.parts=[]
            def handle_data(self,txt): self.parts.append(txt)
          urls=[
            'https://fred.stlouisfed.org/data/PCU484484',
            'https://fred.stlouisfed.org/graph/fredgraph.csv?id=PCU484484',
          ]
          for url in urls:
            print('FRED_SOURCE_START',url,flush=True)
            try:
              req=Request(url,headers={'User-Agent':'Mozilla/5.0 (compatible; RETALLY-Research/1.0)'})
              with urlopen(req,timeout=25) as response:
                raw=response.read(2000001)
                print('FRED_SOURCE_RESPONSE',url,'http',response.status,'final',response.geturl(),'bytes',len(raw),'sha256',sha256(raw).hexdigest(),flush=True)
              if len(raw)>2000000: raise ValueError('too_many_bytes')
              txt=raw.decode('utf-8')
              if '<html' in txt.lower():
                p=Text();p.feed(txt);out=' '.join(p.parts)
              else:out=txt
              print('FRED_IS_HTML',url,'<html' in txt.lower(),'DATA_START_EXCERPT',repr(out[:700]),flush=True)
              for y in range(2017,2025):
                samples=re.findall(r'(?<!\d)'+str(y)+r'-(?:0[1-9]|1[0-2])-01.{0,85}',out)
                print('FRED_YEAR_TEXT',url,y,'matched_dates',len(samples),'samples',samples[:2],flush=True)
              idx=txt.find('2017-01-01')
              print('FRED_HTML_NEAR_2017',url,repr(txt[max(0,idx-160):idx+450]),flush=True)
            except Exception as exc:
              print('FRED_SOURCE_BLOCKED',url,type(exc).__name__,str(exc)[:250],flush=True)
          PY
