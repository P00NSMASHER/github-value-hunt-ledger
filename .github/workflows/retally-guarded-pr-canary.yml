name: RETALLY Guarded Synthetic PR Canary

on:
  pull_request:
    paths:
      - ".github/workflows/retally-guarded-pr-canary.yml"
      - "tools/retally_guarded_pr_canary.py"
      - "tests/test_retally_guarded_pr_canary.py"
  push:
    branches:
      - "automation/retally-guard-canary-*"
    paths:
      - "automation/canary/guarded-*.md"

permissions:
  contents: read

concurrency:
  group: guarded-retally-pr-canary-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-offline:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Validate fail-closed synthetic-only GitHub canary
        run: python -m unittest -v tests.test_retally_guarded_pr_canary

  live-inert-canary:
    if: >-
      github.event_name == 'push' &&
      github.repository == 'P00NSMASHER/github-value-hunt-ledger' &&
      github.actor == 'P00NSMASHER'
    runs-on: ubuntu-latest
    timeout-minutes: 34
    permissions:
      contents: write
      pull-requests: write
      actions: write
      checks: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: One exact synthetic Markdown PR and CI-only merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/retally_guarded_pr_canary.py
