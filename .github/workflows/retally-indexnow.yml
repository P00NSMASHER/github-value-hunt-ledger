name: RETALLY Organic IndexNow

on:
  workflow_run:
    workflows: ["RETALLY Live Publication Audit"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: retally-indexnow-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  notify-changed-pages:
    # Only trusted, completed push releases; never PR, schedule or unverified content.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout the exact verified release
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 3
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Notify search engines about genuinely changed public HTML
        run: >-
          python -m freight.marketing.indexnow_notify
          --sha "${{ github.event.workflow_run.head_sha }}"
          --attempts 15
          --delay 20
