name: RETALLY Inquiry CI
on:
  push:
    branches: [main]
    paths:
      - "functions/api/inquiry.js"
      - "functions/api/internal/**"
      - "freight/site/operator_access_auth.js"
      - "freight/inquiry_ops/**"
      - "freight/site/test_inquiry_case.mjs"
      - "freight/site/test_inquiry_retention.py"
      - "freight/site/privacy.html"
      - "freight/site/site.js"
      - "freight/site/index.html"
      - "freight/site/_headers"
      - "freight/site/test_inquiry.mjs"
      - "freight/site/migrations/**"
      - ".github/workflows/retally-inquiry.yml"
  pull_request:
    paths:
      - "functions/api/inquiry.js"
      - "functions/api/internal/**"
      - "freight/site/operator_access_auth.js"
      - "freight/inquiry_ops/**"
      - "freight/site/test_inquiry_case.mjs"
      - "freight/site/test_inquiry_retention.py"
      - "freight/site/privacy.html"
      - "freight/site/site.js"
      - "freight/site/index.html"
      - "freight/site/_headers"
      - "freight/site/test_inquiry.mjs"
      - "freight/site/migrations/**"
      - ".github/workflows/retally-inquiry.yml"
  workflow_dispatch:
permissions:
  contents: read

# Avoid duplicate branch push + PR validation; superseded same-ref CI is cancelled.
concurrency:
  group: retally-inquiry-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  intake-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Browser JavaScript syntax
        run: node --check freight/site/site.js
      - name: Pages API JavaScript syntax
        run: node --experimental-default-type=module --check functions/api/inquiry.js
      - name: Secure inquiry unit and mocked integration tests
        run: node --experimental-default-type=module --test freight/site/test_inquiry.mjs
      - name: Signed human response, privacy and retention policy tests
        run: |
          node --check functions/api/internal/inquiry-case.js
          node --check functions/api/internal/inquiry-response.js
          node --check freight/site/operator_access_auth.js
          node --experimental-sqlite --test freight/site/test_inquiry_case.mjs freight/inquiry_ops/test_reconcile.mjs
          python -m unittest freight.site.test_inquiry_retention
      - name: Verify generated Cloudflare-only API Content Security Policy
        env:
          FREIGHT_CONTACT_EMAIL: jay@retallyrecovery.com
          FREIGHT_CONTACT_VERIFIED: "1"
        run: |
          python -m freight.site.cloudflare_build
          python - <<'PY'
          from pathlib import Path
          from freight.site.build import SOURCE
          from freight.site.cloudflare_build import EXPECTED_FILES
          public = Path('cf-retally-public')
          index = (public / 'index.html').read_text()
          headers = (public / '_headers').read_text()
          legacy = (SOURCE / 'index.html').read_text()
          # Require the precise existing vendor and Turnstile allowlist. The
          # BubblaV public-chat integration was merged independently; never
          # weaken this test by accepting arbitrary script/connect hosts.
          connect = ("connect-src 'self' https://www.bubblav.com "
                     "https://bubblav.com https://*.bubblav.com "
                     "https://challenges.cloudflare.com;")
          frame = ("frame-src https://www.bubblav.com https://bubblav.com "
                   "https://*.bubblav.com https://challenges.cloudflare.com;")
          script = "script-src 'self' https://www.bubblav.com https://challenges.cloudflare.com;"
          for published in (index, headers):
              assert connect in published
              assert frame in published
              assert script in published
          assert "connect-src 'none'" in legacy
          assert "script-src 'self';" in legacy
          assert "https://www.retallyrecovery.com/" in index
          assert len([x for x in public.rglob('*') if x.is_file()]) == EXPECTED_FILES
          PY
