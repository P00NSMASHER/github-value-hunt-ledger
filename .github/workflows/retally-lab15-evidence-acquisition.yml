name: RETALLY Lab 15 Public Evidence Acquisition

on:
  pull_request:
    paths:
      - 'freight/lab15_acquisition.py'
      - 'freight/test_lab15_acquisition.py'
      - 'freight/lab15_triage.py'
      - 'freight/test_lab15_triage.py'
      - 'freight/lab15/**'
      - 'freight/LAB15_AUTONOMOUS_EVIDENCE_ACQUISITION.md'
      - '.github/workflows/retally-lab15-evidence-acquisition.yml'
  push:
    branches: [main]
    paths:
      - 'freight/lab15_acquisition.py'
      - 'freight/test_lab15_acquisition.py'
      - 'freight/lab15_triage.py'
      - 'freight/test_lab15_triage.py'
      - 'freight/lab15/**'
      - 'freight/LAB15_AUTONOMOUS_EVIDENCE_ACQUISITION.md'
      - '.github/workflows/retally-lab15-evidence-acquisition.yml'
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: retally-lab15-source-ledger-writer
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source under test
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Compile Lab 15
        run: python -m py_compile freight/lab15_acquisition.py freight/test_lab15_acquisition.py freight/lab15_triage.py freight/test_lab15_triage.py
      - name: Validate offline controls, custody, and registry integrity
        run: python -m unittest -v freight.test_lab15_acquisition freight.test_lab15_triage
      - name: Verify the seeded ledger schema
        run: |
          python -m freight.lab15_acquisition --report /tmp/retally-lab15-offline-summary.json
          python -m freight.lab15_triage --out /tmp/retally-lab15-offline-triage.json

  acquire:
    needs: validate
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - name: Checkout default branch with history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Acquire bounded public evidence metadata
        env:
          RETALLY_LAB15_PUBLIC_FETCH_ENABLED: "1"
        run: |
          python -m freight.lab15_acquisition \
            --live --report /tmp/retally-lab15-run-summary.json
          python -m freight.lab15_triage --out freight/lab15/triage_queue.json
      - name: Independently verify no original documents or financial approvals persist
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from freight.lab15_acquisition import read_ledger
          from freight.lab15_triage import validate_queue
          d = read_ledger()
          annotations = json.loads(Path('freight/lab15/evidence_annotations.json').read_text())
          triage = json.loads(Path('freight/lab15/triage_queue.json').read_text())
          validate_queue(triage, d, annotations)
          assert triage['sources_with_complete_approved_real_case'] == 0
          assert all(not r['raw_document_stored'] for r in d['records'])
          assert all(not r['commercial_test_approved'] for r in d['records'])
          assert all(not r['independent_invoice_error_verified'] for r in d['records'])
          assert all(not r['actual_payment_verified'] for r in d['records'])
          assert all(not r['recovery_verified'] for r in d['records'])
          print('Public metadata only; no third-party invoice bytes or financial claims admitted')
          PY
      - name: Commit new verified-source pointers, not raw invoices
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- freight/lab15/evidence_ledger.json freight/lab15/triage_queue.json
          if git diff --cached --quiet; then
            echo "No new source pointers or source version changes"
            exit 0
          fi
          git commit -m "automation: Lab 15 source index and triage refresh"
          git pull --rebase origin main
          python -m unittest -q freight.test_lab15_acquisition freight.test_lab15_triage
          git push origin HEAD:main
