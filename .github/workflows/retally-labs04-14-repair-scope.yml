name: RETALLY Labs 04-14 Repair Scope and Source Release Gate
on:
  pull_request:
    paths:
      - 'freight/lab_repair_04_14_contract.py'
      - 'freight/test_lab_repair_04_14_contract.py'
      - 'freight/LABS_04_14_REPAIR_HANDOFF_20261008.md'
      - '.github/workflows/retally-labs04-14-repair-scope.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-evidence-boundaries:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout immutable pull request source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install pinned test dependencies
        run: python -m pip install -r production/requirements-ci.txt
      - name: Prove synthetic source scope and refuse inflated full-scale claims
        run: PYTHONPATH=. python -m pytest -q freight/test_lab_repair_04_14_contract.py
      - name: Explicitly state restrictions
        run: |
          echo 'Lab source repairs isolated to downloaded toolkits; no hosted app deployment.'
          echo 'No contact, email, carrier action, payment, production merge, scheduled work or actual customer claim.'
