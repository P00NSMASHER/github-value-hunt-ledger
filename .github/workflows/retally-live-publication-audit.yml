name: RETALLY Live Publication Audit

on:
  workflow_dispatch:
  schedule:
    - cron: '17 12 * * *'

permissions:
  contents: read

concurrency:
  group: retally-live-publication-audit
  cancel-in-progress: false

jobs:
  readonly-live-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Verify audit fixture behavior
        run: python -m unittest freight.site.test_verify_production_site -v
      - name: Check live approved artwork, security and canonical pages
        run: python -m freight.site.verify_production_site
