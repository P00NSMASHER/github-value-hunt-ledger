name: RETALLY Independent Live Audit Incident Alerts

on:
  workflow_run:
    workflows: ["RETALLY Live Publication Audit"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: retally-live-audit-incidents
  cancel-in-progress: false

jobs:
  record-incident:
    # Only trusted executions of the production read-only audit on main.
    # Do NOT use sampled Cloudflare raw HTTP 504 metrics as an outage signal.
    if: >-
      github.event.workflow_run.head_branch == 'main' &&
      (github.event.workflow_run.conclusion == 'failure' ||
       github.event.workflow_run.conclusion == 'timed_out' ||
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - name: Checkout trusted default branch only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Record a deduplicated genuine audit failure or recovery
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m freight.site.live_audit_incident
