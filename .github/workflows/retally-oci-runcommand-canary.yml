name: RETALLY OCI Remote No-Write Canary

on:
  pull_request:
    paths:
      - '.github/workflows/retally-oci-runcommand-canary.yml'
      - 'deployment/oracle-always-free/oci_runcommand_canary.py'
      - 'deployment/oracle-always-free/test_oci_runcommand_canary.py'
      - 'deployment/oracle-always-free/OCI_REMOTE_CANARY.md'
  workflow_dispatch:
    inputs:
      existing_command_id:
        description: 'Optional accepted command OCID to reconcile without creating a command'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: retally-oci-remote-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Compile exact source and run offline security regressions
        run: |
          python -m py_compile deployment/oracle-always-free/oci_runcommand_canary.py
          python -m unittest discover -s deployment/oracle-always-free -p 'test_oci_runcommand_canary.py' -v

  hold-not-enabled:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      vars.RETALLY_OCI_RUN_COMMAND_ENABLED != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Explicit hold, not a successful Oracle connection
        run: |
          echo '::error::OCI remote canary is disabled; no Run Command was attempted.'
          exit 1

  run-synthetic-canary:
    needs: validate-offline
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      vars.RETALLY_OCI_RUN_COMMAND_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      id-token: write
    env:
      RETALLY_OCI_RUN_COMMAND_ENABLED: ${{ vars.RETALLY_OCI_RUN_COMMAND_ENABLED }}
      RETALLY_OCI_RUN_APPROVED_SHA: ${{ vars.RETALLY_OCI_RUN_APPROVED_SHA }}
      RETALLY_OCI_RUN_DOMAIN_URL: ${{ vars.RETALLY_OCI_RUN_DOMAIN_URL }}
      RETALLY_OCI_VM_COMPARTMENT_OCID: ${{ vars.RETALLY_OCI_VM_COMPARTMENT_OCID }}
      RETALLY_OCI_RUN_COMMAND_COMPARTMENT_OCID: ${{ vars.RETALLY_OCI_RUN_COMMAND_COMPARTMENT_OCID }}
      RETALLY_OCI_VM_OCID: ${{ vars.RETALLY_OCI_VM_OCID }}
      GITHUB_INPUT_EXISTING_COMMAND_ID: ${{ inputs.existing_command_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install pinned official OCI SDK
        run: python -m pip install --disable-pip-version-check 'oci==2.188.0'
      - name: Execute one fixed no-write canary only on approved OCI Micro VM
        env:
          RETALLY_OCI_RUN_CLIENT_ID: ${{ secrets.RETALLY_OCI_RUN_CLIENT_ID }}
          RETALLY_OCI_RUN_CLIENT_SECRET: ${{ secrets.RETALLY_OCI_RUN_CLIENT_SECRET }}
        run: python deployment/oracle-always-free/oci_runcommand_canary.py
