name: RETALLY Oracle (read-only, no laptop)

on:
  pull_request:
    paths:
      - .github/workflows/retally-oracle-readonly.yml
      - deployment/oracle-always-free/retally_oci_readonly.py
      - deployment/oracle-always-free/test_retally_oci_readonly.py
      - deployment/oracle-always-free/GITHUB_OIDC_READONLY.md
  workflow_dispatch:
  schedule:
    - cron: "19 12 * * *"

permissions:
  contents: read

concurrency:
  group: retally-oracle-readonly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  offline-contract:
    name: Offline security contract (no OCI credentials)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Compile and test OIDC bindings, failures and read-only calls
        run: |
          python -m py_compile deployment/oracle-always-free/retally_oci_readonly.py
          python -m unittest discover -s deployment/oracle-always-free -p 'test_retally_oci_readonly.py' -v

  disabled-state:
    name: OCI NOT ACTIVATED — no Oracle network activity
    if: github.event_name != 'pull_request' && vars.RETALLY_OCI_BRIDGE_ENABLED != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - run: |
          echo '::warning::Oracle bridge is NOT CONFIGURED; this run did not inspect OCI.'
          echo '## Oracle automation inactive' >> "$GITHUB_STEP_SUMMARY"
          echo 'No live Oracle audit was performed. Configure identity, access and RETALLY_OCI_BRIDGE_ENABLED=true only after approval.' >> "$GITHUB_STEP_SUMMARY"

  observe:
    name: OCI live synthetic-only metadata observation
    if: >-
      github.repository == 'P00NSMASHER/github-value-hunt-ledger' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') &&
      vars.RETALLY_OCI_BRIDGE_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    environment: retally-oci-readonly
    permissions:
      contents: read
      id-token: write
    env:
      RETALLY_OCI_IDENTITY_DOMAIN_URL: ${{ vars.RETALLY_OCI_IDENTITY_DOMAIN_URL }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install pinned Oracle SDK (no OCI CLI config or user API key)
        run: python -m pip install --disable-pip-version-check 'oci==2.188.0'
      - name: Verify GitHub OIDC and use short-lived OCI resource identity
        # OAuth credentials are visible only to the final restricted OCI process,
        # never to checkout, Python setup, or the SDK package installer.
        env:
          RETALLY_OCI_OAUTH_CLIENT_ID: ${{ secrets.RETALLY_OCI_OAUTH_CLIENT_ID }}
          RETALLY_OCI_OAUTH_CLIENT_SECRET: ${{ secrets.RETALLY_OCI_OAUTH_CLIENT_SECRET }}
        run: python deployment/oracle-always-free/retally_oci_readonly.py
