name: RETALLY Lab 14 Original-Finding Disposition Integrity (Mission 40)
on:
  pull_request:
    paths:
      - '.github/workflows/retally-original-finding-ledger-m40.yml'
      - 'freight/lab_experiment_ledger.py'
      - 'freight/lab_historical_disposition_m40.py'
      - 'freight/test_lab_historical_disposition_m40.py'
      - 'freight/lab_phase4_experiments.py'
      - 'freight/lab_phase4_control_center.py'
      - 'freight/research/LAB_FINDINGS_CUMULATIVE.json'
      - 'freight/RESEARCH_HISTORICAL_FINDING_INTEGRITY_M40.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  register-ledger-and-fourteen-labs:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install existing offline research dependencies
        run: |
          python -m pip install -r production/requirements-ci.txt
          python -m pip install cryptography==46.0.4 openpyxl==3.1.5
      - name: Test independent ledger identity, verdict, chain and 26 original dispositions
        run: |
          PYTHONPATH=. python -m pytest -q \
            freight/test_lab_historical_disposition_m40.py \
            freight/test_lab_experiment_ledger.py \
            freight/test_lab_phase4_experiments.py \
            freight/test_lab_cross_lab_assurance_m39.py \
            freight/test_lab_phase4_director.py \
            freight/test_research_claim_quarantine_m38.py \
            freight/test_research_pilot_preflight.py
      - name: Build existing original fourteen-lab control center and validate M40
        run: |
          PYTHONPATH=. python -m freight.lab_phase4_control_center --out /tmp/retally-m40-center
          python - <<'PY'
          from pathlib import Path
          import json
          p=Path('/tmp/retally-m40-center')
          d=json.loads((p/'phase4_control.json').read_text())
          r=json.loads((p/'historical_finding_disposition.json').read_text())
          assert len(d['lab_runs'])==14 and d['failed_or_blocked_labs']==[]
          assert d['cross_lab_integrity_m39']['all_fourteen_locally_executed'] is True
          assert d['actual_revenue_cents']==0
          assert r['scope']=='RETALLY_LAB14_M40_FROZEN_FINDING_LEDGER_AUDIT_NO_AUTOMATIC_CLOSURE'
          assert r['existing_lab_number']==14 and r['new_lab_created'] is False
          assert r['original_historical_findings']==26
          assert r['original_historical_findings_open']==26
          assert r['original_historical_findings_closed_by_local_reports']==0
          assert r['additional_research_gate_only_fixed_items']==2
          assert r['all_registered_items_including_gate_corrections']==28
          assert r['local_experiments_recorded']==4
          assert r['distinct_original_findings_with_experiments']==4
          assert r['independent_regression_or_repair_signoffs']==0
          assert r['independent_customer_human_pilot_gates_unmet']==18
          assert r['external_publication_authority'] is False
          assert len(r['historical_findings'])==26
          assert all(x['historical_defect_closed'] is False for x in r['historical_findings'])
          assert r['receipt_sha256']==d['historical_finding_disposition_m40']['receipt_sha256']
          assert 'historical_finding_disposition.html' in (p/'index.html').read_text()
          print('M40 original 26 unresolved, 2 gate-only fixes, four inconclusive local experiments, no auto-closure; existing 14 labs passed.')
          PY
      - name: Upload safe bounded internal disposition receipts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: retally-m40-internal-original-finding-ledger-receipt
          path: |
            /tmp/retally-m40-center/historical_finding_disposition.json
            /tmp/retally-m40-center/historical_finding_disposition.html
          if-no-files-found: error
          retention-days: 14

  independent-adversarial-rehashed-repair-proof:
    needs: register-ledger-and-fourteen-labs
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Rehash fraudulent verdict in isolated SQLite and demand rejection
        run: |
          PYTHONPATH=. python - <<'PY'
          from pathlib import Path
          import json,sqlite3,tempfile
          from freight.lab_assurance import digest
          from freight.lab_experiment_ledger import Experiment, ExperimentLedger
          from freight.lab_historical_disposition_m40 import audit
          with tempfile.TemporaryDirectory() as t:
              p=Path(t)/'tmp.sqlite3'
              ledger=ExperimentLedger(p)
              e=Experiment(experiment_id='m40-adversarial-test',finding_id='LAB-P0-01',
                  baseline_artifact_sha256=digest('a'),candidate_artifact_sha256=digest('b'),
                  frozen_input_sha256=digest('c'),independent_test_sha256=digest('d'),
                  original_counterexample_reproduced=False,
                  repaired_counterexample_rejected=False,
                  known_good_control_passed=True,measured_runtime_ms=10,
                  execution_scope='SYNTHETIC_OFFLINE')
              ledger.append(e)
              before=audit(ledger_path=p)
              assert before['original_historical_findings_open']==26
              assert before['local_repair_assertions_not_attested']==0
              con=sqlite3.connect(p)
              try:
                  con.execute('DROP TRIGGER no_experiment_update')
                  row=json.loads(con.execute('SELECT receipt_json FROM experiments').fetchone()[0])
                  row['verdict']='REPAIR_DEMONSTRATED_IN_STATED_TEST_SCOPE_ONLY'
                  forged=digest({'previous':None,'receipt':row})
                  con.execute('UPDATE experiments SET receipt_json=?,receipt_sha256=?',
                              (json.dumps(row,sort_keys=True),forged))
                  con.commit()
              finally:
                  con.close()
              for action in (ledger.read_and_verify,lambda:audit(ledger_path=p)):
                  try:
                      action()
                  except ValueError as err:
                      assert 'M40_EXPERIMENT_VERDICT_NOT_DERIVED_FROM_FLAGS' in str(err)
                  else:
                      raise AssertionError('rehashed unsupported repair approval accepted')
          print('M40 independent process rejected rehashed false repair; 26 historical findings remain open.')
          PY
