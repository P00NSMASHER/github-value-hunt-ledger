name: RETALLY Priority 4 Cross-Platform Adversarial Acceptance

on:
  pull_request:
    paths:
      - 'freight/priority4_adversarial_lab.py'
      - 'freight/test_priority4_adversarial_lab.py'
      - 'freight/fixtures/priority4_synthetic_stress_baseline_v1.json'
      - 'freight/PRIORITY4_RELIABILITY_ACCEPTANCE.md'
      - '.github/workflows/retally-priority4-adversarial.yml'
  push:
    branches: [main]
    paths:
      - 'freight/priority4_adversarial_lab.py'
      - 'freight/test_priority4_adversarial_lab.py'
      - 'freight/fixtures/priority4_synthetic_stress_baseline_v1.json'
      - '.github/workflows/retally-priority4-adversarial.yml'

permissions:
  contents: read

concurrency:
  group: retally-priority4-adversarial-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  cross-platform-replay:
    name: adversarial-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout exact tested commit without retaining credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Use pinned Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install pinned offline test runner
        run: python -m pip install --disable-pip-version-check --no-input pytest==8.4.2
      - name: Compile canonical adversarial suite
        run: python -m compileall -q freight/priority4_adversarial_lab.py freight/test_priority4_adversarial_lab.py
      - name: Replay deterministic customer stress, synthetic settlement and mutations
        run: python -m pytest -q freight/test_priority4_adversarial_lab.py
      - name: Protect source tree against accidental changes
        run: git diff --check

  financial-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check --no-input pytest==8.4.2
      - name: Require original P0-P3 payment, data rights and financial protections
        run: |
          python -m pytest -q \
            freight/test_priority0_financial_integrity.py \
            freight/test_priority1_financial_assurance.py \
            freight/test_priority2_evidence.py \
            freight/test_priority2_pipeline.py \
            freight/test_priority3_recovery_resilience.py \
            freight/test_phase3_accuracy.py \
            freight/test_sealed_real_accuracy_r3.py \
            freight/test_settlement_store.py \
            freight/test_settlement_lifecycle_workflow.py \
            freight/test_settlement_report.py \
            freight/test_real_document_lab.py \
            freight/test_pennine_republication_integrity.py
      - name: Assert raw private invoice/bank data not introduced to public repository
        shell: bash
        run: |
          set -euo pipefail
          ! git ls-files freight/fixtures | grep -Ei '\.(pdf|xlsx|csv|db|sqlite3)$'
          ! git ls-files freight | grep -Ei 'private.*(invoice|customer|bank).*\.(pdf|csv|db)$'
