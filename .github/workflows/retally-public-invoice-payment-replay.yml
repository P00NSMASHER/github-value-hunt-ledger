name: RETALLY Public Invoice-to-Payment Research Replay

on:
  pull_request:
    paths:
      - 'freight/research/public_invoice_payment_validation.py'
      - 'freight/test_public_invoice_payment_validation.py'
      - 'freight/research/real_document_engine_lab.py'
      - 'freight/test_real_document_engine_lab.py'
      - '.github/workflows/retally-public-invoice-payment-replay.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: retally-public-invoice-replay-${{ github.ref }}
  cancel-in-progress: false

jobs:
  synthetic-guards:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout proposed research code (read-only)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Compile and check synthetic-only audit guards
        run: |
          python -m py_compile freight/research/public_invoice_payment_validation.py freight/test_public_invoice_payment_validation.py
          PYTHONPATH=. python -m unittest -v freight.test_public_invoice_payment_validation

  public-live-profile:
    needs: synthetic-guards
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout proposed research code (read-only)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Reproduce April-August official OGL ledger and cross-period invoice matching
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          # Downloads only an exact public publisher CSV into process memory.
          # Logs aggregates + source SHA256 only; no invoices, names or bank data.
          # No raw data file, workflow artifact, export, or repository write.
          PYTHONPATH=. python -m freight.research.public_invoice_payment_validation --live-all

  real-document-engine-lab:
    needs: synthetic-guards
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'lab/retally-real-document-engines-')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - name: Checkout research-only proposed changes
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install standalone non-OCR PDF text reader
        run: python -m pip install --disable-pip-version-check --no-input 'pypdf==5.9.0'
      - name: Validate synthetic safety and financial control fixtures
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          PYTHONPATH=. python -m unittest -v freight.test_real_document_engine_lab
      - name: Ephemeral original-PDF ingress and real ledger kernel execution
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          # Source PDFs, CSV rows and payment refs exist only in process memory.
          # Never upload artifacts, add credentials, publish a bill, or modify main.
          PYTHONPATH=. python -m freight.research.real_document_engine_lab --live
