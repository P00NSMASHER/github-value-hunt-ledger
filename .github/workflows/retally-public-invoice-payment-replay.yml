name: RETALLY Public Invoice-to-Payment Research Replay

on:
  pull_request:
    paths:
      - 'freight/research/public_invoice_payment_validation.py'
      - 'freight/test_public_invoice_payment_validation.py'
      - '.github/workflows/retally-public-invoice-payment-replay.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: retally-public-invoice-replay-${{ github.ref }}
  cancel-in-progress: false

jobs:
  synthetic-guards:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout proposed research code (read-only)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Compile and check synthetic-only audit guards
        run: |
          python -m py_compile freight/research/public_invoice_payment_validation.py freight/test_public_invoice_payment_validation.py
          PYTHONPATH=. python -m unittest -v freight.test_public_invoice_payment_validation

  public-live-profile:
    needs: synthetic-guards
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout proposed research code (read-only)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Reproduce April-August official OGL ledger and cross-period invoice matching
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          # Downloads only an exact public publisher CSV into process memory.
          # Logs aggregates + source SHA256 only; no invoices, names or bank data.
          # No raw data file, workflow artifact, export, or repository write.
          PYTHONPATH=. python -m freight.research.public_invoice_payment_validation --live-all
