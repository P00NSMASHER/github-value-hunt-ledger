name: RETALLY R1 Financial Integrity and Exact-Money Regression

on:
  pull_request:
    paths:
      - 'freight/canonical_schema.py'
      - 'freight/enterprise_adapters.py'
      - 'freight/financial_integrity.py'
      - 'freight/scoped_reconciliation.py'
      - 'freight/test_financial_integrity_r1.py'
      - '.github/workflows/retally-r1-financial-integrity.yml'
  push:
    branches: [main]
    paths:
      - 'freight/canonical_schema.py'
      - 'freight/enterprise_adapters.py'
      - 'freight/financial_integrity.py'
      - 'freight/scoped_reconciliation.py'
      - 'freight/test_financial_integrity_r1.py'
      - '.github/workflows/retally-r1-financial-integrity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  financial-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check -r production/requirements-ci.txt
      - name: Exact money and provenance adversarial replay
        run: PYTHONPATH=. python -m pytest -q freight/test_financial_integrity_r1.py
      - name: Backward-compatible v1 source, rating and payment replay
        run: PYTHONPATH=. python -m pytest -q freight/test_phase0_recoveryos.py freight/test_phase1_recoveryos.py freight/test_phase2_recoveryos.py
      - name: Frozen synthetic benchmark cannot change
        run: PYTHONPATH=. python -m pytest -q freight/test_phase3_accuracy.py
      - name: Unchanged balance recovery claims must remain fail-closed
        run: |
          python - <<'PY'
          from freight.test_phase0_recoveryos import ltl_record
          from freight.financial_integrity import replay_financial_movements
          record = ltl_record()
          balance = replay_financial_movements(record, ())
          assert balance.verified_net_cash_cents == 0
          assert balance.remaining_balance_cents == record.billed_total_cents
          print('PASS: absent bank evidence remains unverified')
          PY
