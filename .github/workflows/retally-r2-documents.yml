name: RETALLY R2 Original PDF Evidence Replay

on:
  pull_request:
    paths:
      - 'freight/original_pdf_extraction.py'
      - 'freight/test_original_pdf_extraction_r2.py'
      - 'freight/R2_DOCUMENT_INTELLIGENCE.md'
      - 'freight/priority2_evidence.py'
      - 'freight/priority2_pipeline.py'
      - 'freight/test_priority2_evidence.py'
      - 'freight/test_priority2_pipeline.py'
      - 'freight/PRIORITY2_SOURCE_BOUND_ACCEPTANCE.md'
      - '.github/workflows/retally-r2-documents.yml'
  push:
    branches: [main]
    paths:
      - 'freight/original_pdf_extraction.py'
      - 'freight/test_original_pdf_extraction_r2.py'
      - 'freight/priority2_evidence.py'
      - 'freight/priority2_pipeline.py'
      - 'freight/test_priority2_evidence.py'
      - 'freight/test_priority2_pipeline.py'
      - '.github/workflows/retally-r2-documents.yml'

permissions:
  contents: read

jobs:
  original-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check --no-input pytest pymupdf==1.26.5
      - name: Isolated original PDF, strict rate and reconciliation evidence tests
        run: PYTHONPATH=. python -m pytest -q freight/test_original_pdf_extraction_r2.py freight/test_priority2_evidence.py freight/test_priority2_pipeline.py
      - name: Replay both frozen original court PDFs and typed discounts
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from freight.original_pdf_extraction import (
              fetch_frozen_public_original, parse_original_pdf, safe_summary,
          )
          from freight.priority2_pipeline import review_original_extraction
          originals = {}
          for issuer in ("GLOBALTRANZ", "ARCBEST"):
              raw = fetch_frozen_public_original(issuer)
              batch = parse_original_pdf(issuer, raw)
              originals[issuer] = safe_summary(batch)
              evidence = review_original_extraction(batch, original_pdf_bytes=raw)
              assert evidence.frozen_original_population_complete
              assert evidence.face_amounts_verified == batch.invoice_count
              assert evidence.invoices_missing_freight_accuracy_evidence == batch.invoice_count
              assert evidence.unresolved_invoice_count == batch.invoice_count
              assert evidence.commercially_recovered_cents == 0
              assert evidence.independently_adjudicated_freight_errors == 0
              assert evidence.bank_cleared_payment_receipts == 0
              assert evidence.real_precision is None and evidence.real_recall is None
          assert originals["GLOBALTRANZ"]["original_invoice_count"] == 100
          assert originals["GLOBALTRANZ"]["exact_original_invoice_amount_count"] == 100
          assert originals["GLOBALTRANZ"]["typed_discount_or_credit_invoice_count"] == 93
          assert originals["ARCBEST"]["original_invoice_count"] == 10
          assert originals["ARCBEST"]["exact_original_invoice_amount_count"] == 10
          assert originals["ARCBEST"]["missing_independent_line_item_invoices"] == 10
          assert originals["GLOBALTRANZ"]["claimable_recovery_cents"] == 0
          assert originals["ARCBEST"]["freight_error_accuracy"] is None
          print(json.dumps(originals, sort_keys=True, indent=2))
          PY
      - name: No original billing documents in Git history or CI artifacts
        run: |
          ! git ls-files | grep -E '(original.*(pdf|csv)$|pennine.*csv$)' || exit 1
