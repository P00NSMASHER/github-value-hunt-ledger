name: RETALLY historical synthetic red-team archive SHA verification

on:
  pull_request:
    paths:
      - 'research/retally-redteam-archive/**'
      - '.github/workflows/retally-redteam-archive-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archive-readback:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Source blob attestation, syntax only, no execution or network
        run: python research/retally-redteam-archive/verify_archive.py
