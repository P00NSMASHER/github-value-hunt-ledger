name: RETALLY Round 2 Financial and Evidence Integrity

on:
  pull_request:
    paths:
      - 'freight/settlement_store.py'
      - 'freight/payment_orchestration.py'
      - 'freight/recovery_resilience.py'
      - 'freight/currency_reporting.py'
      - 'freight/priority4_adversarial_lab.py'
      - 'freight/test_redteam_round2_repairs.py'
      - 'freight/test_pending_return_fee_quarantine.py'
      - 'freight/REDTEAM_ROUND2_REPAIR_ACCEPTANCE.md'
      - '.github/workflows/retally-redteam-round2-integrity.yml'
  push:
    branches: [main]
    paths:
      - 'freight/settlement_store.py'
      - 'freight/payment_orchestration.py'
      - 'freight/recovery_resilience.py'
      - 'freight/currency_reporting.py'
      - 'freight/priority4_adversarial_lab.py'
      - 'freight/test_redteam_round2_repairs.py'
      - 'freight/test_pending_return_fee_quarantine.py'
      - '.github/workflows/retally-redteam-round2-integrity.yml'

permissions:
  contents: read

concurrency:
  group: retally-round2-integrity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  return-payment-and-receipt-replay:
    name: redteam-returns-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout exact-source test commit without retained credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install bounded test dependencies
        run: python -m pip install --disable-pip-version-check --no-input pytest==8.4.2 tzdata==2025.2
      - name: Syntax check protected source and negative controls
        run: python -m compileall -q freight/settlement_store.py freight/payment_orchestration.py freight/recovery_resilience.py freight/priority4_adversarial_lab.py freight/test_redteam_round2_repairs.py freight/test_pending_return_fee_quarantine.py
      - name: Run red-team failure-before/passing-after suite
        run: python -m pytest -q freight/test_redteam_round2_repairs.py freight/test_pending_return_fee_quarantine.py
      - name: Preserve whitespace integrity
        run: git diff --check

  preserved-financial-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check --no-input pytest==8.4.2
      - name: Run immutable financial, reconciliation, claims and 3072-case source fixture controls
        run: |
          python -m pytest -q \
            freight/test_priority0_financial_integrity.py \
            freight/test_priority1_financial_assurance.py \
            freight/test_priority3_recovery_resilience.py \
            freight/test_priority4_adversarial_lab.py \
            freight/test_settlement_store.py \
            freight/test_settlement_review_workflow.py \
            freight/test_settlement_lifecycle_workflow.py \
            freight/test_settlement_report.py \
            freight/test_financial_integrity_r1.py \
            freight/test_recovery_claim_workflow.py
