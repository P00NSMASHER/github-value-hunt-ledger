      - 'freight/research_market_audit.py'
      - 'freight/test_research_market_audit.py'
      - 'freight/research/CFS_2022_SOURCE_AUDIT_20261011.json'
      - 'freight/RESEARCH_CFS_MARKET_AUDIT.md'
      - 'freight/research_cfs_archive_verifier.py'
