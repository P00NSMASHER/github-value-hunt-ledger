name: RETALLY Research Intelligence (Existing Lab 14)
on:
  pull_request:
    paths:
      - 'freight/research_intelligence.py'
      - 'freight/test_research_intelligence.py'
      - 'freight/research_public_campaign.py'
      - 'freight/test_research_public_campaign.py'
      - 'freight/research_source_acquisition.py'
      - 'freight/test_research_source_acquisition.py'
      - 'freight/research_evidence_gate.py'
      - 'freight/test_research_evidence_gate.py'
      - 'freight/research_change_impact.py'
      - 'freight/test_research_change_impact.py'
      - 'freight/RESEARCH_SOURCE_CHANGE_RADAR.md'
      - 'freight/research_validation_protocols.py'
      - 'freight/test_research_validation_protocols.py'
      - 'freight/research/VALIDATION_PROTOCOLS_20261010.json'
