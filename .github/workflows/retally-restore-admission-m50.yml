name: RETALLY Lab 14 Published Restore Admission and Rehashed Source Integrity (Mission 50)
on:
  pull_request:
    paths:
      - '.github/workflows/retally-restore-admission-m50.yml'
      - 'freight/restore_admission_m50.py'
      - 'freight/lab_recovery_admission_m50.py'
      - 'freight/test_lab_recovery_admission_m50.py'
      - 'freight/backup_restore.py'
      - 'freight/lab_phase4_director.py'
      - 'freight/lab_cross_lab_assurance_m39.py'
      - 'freight/test_lab_cross_lab_assurance_m39.py'
      - 'freight/lab_phase4_control_center.py'
      - 'freight/RESEARCH_RESTORE_ADMISSION_M50.md'
  workflow_dispatch:
permissions:
  contents: read

jobs:
  full-published-backup-restoration-and-fourteen-lab-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 38
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install original offline source/financial CI requirements
        run: |
          python -m pip install -r production/requirements-ci.txt
          python -m pip install cryptography==46.0.4 openpyxl==3.1.5
      - name: Run existing full settlement and audit and thirteen source-rehashed recovery attacks
        run: |
          PYTHONPATH=. python -m pytest -q \
            freight/test_lab_recovery_admission_m50.py \
            freight/test_lab_dual_ledger_backup_m49.py \
            freight/test_backup_restore.py \
            freight/test_lab_audit_trust_boundary_m48.py \
            freight/test_audit_store.py \
            freight/test_audit_ledger.py \
            freight/test_lab_file_continuity_m47.py \
            freight/test_lab_schema_integrity_m46.py \
            freight/test_lab_atomic_financial_m45.py \
            freight/test_lab_persistent_semantic_m44.py \
            freight/test_settlement_store.py \
            freight/test_settlement_report.py \
            freight/test_lab_settlement_source_m43.py \
            freight/test_lab_settlement_identity_m42.py \
            freight/test_lab_critical_counterexample_replay_m41.py \
            freight/test_lab_assurance.py \
            freight/test_lab_phase3_real_chain.py \
            freight/test_lab_phase4_director.py \
            freight/test_lab_cross_lab_assurance_m39.py \
            freight/test_lab_historical_disposition_m40.py \
            freight/test_lab_phase4_experiments.py \
            freight/test_lab_experiment_ledger.py \
            freight/test_research_pilot_preflight.py
      - name: Execute 13 locally rehashed false backup controls and original 14 labs
        run: |
          PYTHONPATH=. python -m freight.lab_recovery_admission_m50 \
            --as-of-date "$(date -u +%F)" --out /tmp/retally-m50
          PYTHONPATH=. python -m freight.lab_phase4_control_center \
            --out /tmp/retally-m50-control
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('/tmp/retally-m50/recovery_admission_m50.json').read_text())
          c=json.loads(Path('/tmp/retally-m50-control/phase4_control.json').read_text())
          assert r['scope']=='RETALLY_LAB14_M50_REHASHED_BACKUP_RESTORE_ADMISSION_SYNTHETIC_ONLY'
          assert r['existing_original_labs']==14 and r['new_lab_created'] is False
          assert r['valid_original_fictional_recovery_bundles']==13
          assert r['rehash_repaired_negative_bundle_attacks']==13
          assert r['current_exact_fail_closed_recovery_denials']==13
          assert r['full_tenant_audit_and_settlement_semantics_checked'] is True
          assert r['published_backup_and_restore_generations_reconciled'] is True
          assert r['hash_and_schema_checks_executed_read_only'] is True
          assert r['original_two_file_shared_atomic_commit_proven'] is False
          assert r['external_immutable_or_crypto_signed_backup_proven'] is False
          assert r['historical_original_recoveryos_findings_open']==26
          assert r['historical_original_recoveryos_findings_closed']==0
          assert r['first_customer_independent_human_approval_gates_unmet']==18
          assert r['real_customer_cash_recovered'] is None
          assert r['externally_publishable_empirical_claims_approved']==0
          assert len(r['cases'])==13
          assert all(x['original_good_bundle_accepted']
                     and x['mutated_local_receipts_rehashed_to_look_complete']
                     and x['predecessor_length_and_sha_only_gate_would_accept']
                     and x['current_read_only_restoration_admission_denied']
                     and x['all_four_sqlite_file_bytes_preserved_during_rejection']
                     and not x['original_historical_defect_closed']
                     for x in r['cases'])
          assert c['executed_labs']==list(range(1,15)) and len(c['lab_runs'])==14
          assert not c['failed_or_blocked_labs']
          assert c['cross_lab_integrity_m39']['all_fourteen_locally_executed'] is True
          assert c['recovery_admission_m50']['receipt_sha256']==r['receipt_sha256']
          assert c['dual_ledger_backup_m49']['current_code_exact_negative_denials']==9
          assert c['historical_finding_disposition_m40']['original_historical_findings_open']==26
          assert c['actual_revenue_cents']==0
          assert 'recovery_admission_m50.html' in Path('/tmp/retally-m50-control/index.html').read_text()
          print('M50: thirteen rehashed source/restore admissions denied against actual SQLite rows, all fourteen labs pass; 26 historical findings remain open.')
          PY
      - name: Retain only internal aggregate test metadata without underlying invoices or SQLite
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: retally-m50-thirteen-rehashed-backup-negatives
          path: |
            /tmp/retally-m50/recovery_admission_m50.json
            /tmp/retally-m50/recovery_admission_m50.html
          if-no-files-found: error
          retention-days: 14

  independent-pinned-previous-verifier-full-thirteen-case-differential:
    needs: full-published-backup-restoration-and-fourteen-lab-proof
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install inherited synthetic test fixture dependencies
        run: |
          python -m pip install -r production/requirements-ci.txt
      - name: Fetch exact ORIGINAL M49 source, not moving HEAD parent
        run: |
          git fetch --no-tags --depth=1 origin 8bcb1945a66b7b171e0637f306485bfb2ad79b01
          git show 8bcb1945a66b7b171e0637f306485bfb2ad79b01:freight/backup_restore.py > /tmp/m50_previous_backup_restore.py
          test -s /tmp/m50_previous_backup_restore.py
      - name: Independently prove same thirteen hash-repaired file sets pass predecessor but fail M50
        run: |
          PYTHONPATH=. python - <<'PY'
          from dataclasses import asdict
          import importlib.util,sys,tempfile
          from pathlib import Path
          from freight import backup_restore as fixed
          from freight.lab_recovery_admission_m50 import CASES,_mutate,_rebind_local_unkeyed_receipts
          from freight.test_backup_restore import populated
          name='m50_pinned_old_sha_only_validator'
          spec=importlib.util.spec_from_file_location(name,'/tmp/m50_previous_backup_restore.py')
          old=importlib.util.module_from_spec(spec)
          sys.modules[name]=old
          spec.loader.exec_module(old)
          old_false_admissions=new_exact_rejections=0
          for case,expected in CASES.items():
              with tempfile.TemporaryDirectory(prefix='m50-independent-old-new-') as td:
                  root=Path(td)
                  audit,settlement=populated(root)
                  final=root/'bundle'
                  known_good=fixed.run_backup_restore_drill(audit,settlement,work_dir=final)
                  adjusted=_rebind_local_unkeyed_receipts(
                      final,_mutate(final,case,known_good)
                  )
                  original_type=old.BackupRestoreResult(**asdict(adjusted))
                  # The immutable pinned M49 source checks only local
                  # proof/marker SHA, not recovered underlying source rows.
                  accepted=old.verify_backup_bundle(final,original_type)
                  assert accepted['proof_hash']==original_type.proof_hash,case
                  old_false_admissions+=1
                  try:
                      fixed.verify_backup_bundle(final,adjusted)
                  except ValueError as exc:
                      assert expected in str(exc),(case,str(exc))
                      new_exact_rejections+=1
                  else:
                      raise AssertionError('M50 accepted independently replayed '+case)
          assert (old_false_admissions,new_exact_rejections)==(13,13)
          print('M50 real pinned-source differential: 13 rehashed corrupted SQLite sources accepted by M49; exactly all 13 rejected by independent full-source M50 recovery admission.')
          PY
