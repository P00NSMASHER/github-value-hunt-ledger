name: RETALLY Source-Derived Return 100-Case Regression

on:
  pull_request:
    paths:
      - 'freight/synthetic_rehearsal.py'
      - 'freight/test_synthetic_rehearsal.py'
      - 'freight/redteam_100_unique_e2e_20261022.py'
      - '.github/workflows/retally-return-source-100-regression.yml'
  push:
    branches: [main]
    paths:
      - 'freight/synthetic_rehearsal.py'
      - 'freight/test_synthetic_rehearsal.py'
      - 'freight/redteam_100_unique_e2e_20261022.py'
      - '.github/workflows/retally-return-source-100-regression.yml'

permissions:
  contents: read

concurrency:
  group: retally-return-source-100-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  exact-source-original-rehearsal:
    name: original-100-return-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout exact patch and retain no credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Pin Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install bounded offline test runner
        run: python -m pip install --disable-pip-version-check --no-input pytest==8.4.2 tzdata==2025.2
      - name: Compile source and run independent source-counter regression tests
        run: |
          python -m compileall -q freight/synthetic_rehearsal.py freight/test_synthetic_rehearsal.py freight/redteam_100_unique_e2e_20261022.py
          python -m pytest -q freight/test_synthetic_rehearsal.py freight/test_settlement_store.py freight/test_settlement_report.py freight/test_settlement_lifecycle_workflow.py
      - name: Re-run 100 fully independent fictional customer sources with variable return amounts
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          RETALLY_SYNTHETIC_REPORT_DIR: retally-100-return-fixed-output
        run: python -m freight.redteam_100_unique_e2e_20261022
      - name: Fail if any original fraud or return accounting oracle disagrees
        if: always()
        shell: bash
        run: |
          if [ ! -f retally-100-return-fixed-output/summary.json ]; then
            echo "BLOCKED: No complete 100-case replay evidence."
            exit 1
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path("retally-100-return-fixed-output/summary.json").read_text())
          assert s["dataset_count"] == s["unique_dataset_sources"] == 100
          assert s["full_rehearsal_completed"] == 100
          assert s["full_all_invariants_passed"] == 100
          assert s["fault_guards_passed"] == 100
          assert s["sqlite_lifecycles_passed"] == 100
          assert s["findings_count"] == 0, s["failed_assertions"]
          assert not s["failed_assertions"], s["failed_assertions"]
          assert s["unique_full_audit_hashes"] == 100
          assert s["unique_commercial_report_hashes"] == 100
          assert s["real_customer_permissions"] is False
          assert s["actual_bank_settlement"] is False
          assert s["external_business_actions"] is False
          assert s["independently_adjudicated_real_freight_truth"] is False
          print("ORIGINAL_100_CASE_COUNTER_FIX_ACCEPTED", json.dumps({
              k: v for k,v in s.items() if k not in ("findings",)
          },sort_keys=True))
          PY
      - name: Preserve complete fictional input corpus and exact failure-ledger JSON
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: retally-original-100-return-fix-${{ matrix.os }}
          path: |
            retally-100-return-fixed-output/all_100_datasets.zip
            retally-100-return-fixed-output/report.json
            retally-100-return-fixed-output/summary.json
          if-no-files-found: error
          retention-days: 7
      - name: Ensure no production-source modification by tests
        run: git diff --exit-code -- freight .github
