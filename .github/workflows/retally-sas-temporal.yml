name: RETALLY Lab 14 Census SAS Six-Year Revisions (Mission 24)
on:
  pull_request:
    paths:
      - '.github/workflows/retally-sas-temporal.yml'
      - 'freight/research_sas_temporal.py'
      - 'freight/test_research_sas_temporal.py'
      - 'freight/research/SAS_TEMPORAL_2017_2022_20261011.json'
      - 'freight/RESEARCH_SAS_TEMPORAL_2017_2022.md'
      - 'freight/lab_phase4_director.py'
      - 'freight/lab_phase4_control_center.py'
  workflow_dispatch:
permissions:
  contents: read

jobs:
  offline-history-evidence-and-lab14:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install original Lab 14 test prerequisites
        run: |
          python -m pip install -r production/requirements-ci.txt
          python -m pip install cryptography==46.0.4
      - name: Run adversarial six-year source and preceding Census/regression tests
        run: |
          PYTHONPATH=. python -m pytest -q \
            freight/test_research_sas_temporal.py \
            freight/test_research_sas_peer_benchmark.py \
            freight/test_research_sas_benchmark.py \
            freight/test_research_aies_2022_lineage.py \
            freight/test_research_aies_historical_lineage.py \
            freight/test_research_aies_original_ftp.py \
            freight/test_research_ltl_revenue_bridge.py \
            freight/test_research_cfs_primary_replay.py \
            freight/test_research_cfs_mode_hierarchy.py \
            freight/test_lab_phase4_director.py
      - name: Build historical offline report and original 14-lab operator workbench
        run: |
          PYTHONPATH=. python -m freight.research_sas_temporal \
            --offline --as-of-date "$(date -u +%F)" \
            --out /tmp/retally-m24-offline
          PYTHONPATH=. python -m freight.lab_phase4_control_center \
            --out /tmp/retally-m24-control
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('/tmp/retally-m24-offline')
          r=json.loads((root/'sas_temporal_revisions.json').read_text())
          labs=json.loads(Path('/tmp/retally-m24-control/phase4_control.json').read_text())
          assert r['source_status']=='OFFLINE_PINNED_SOURCE_SNAPSHOT_ORIGINALS_NOT_REPLAYED_THIS_RUN'
          assert r['census_original_workbooks_replayed_this_run'] is False
          assert r['original_census_workbook_receipts']==[]
          assert r['naics_categories']==['484','484121','484122']
          assert r['publication_years']==[2017,2018,2019,2020,2021,2022]
          assert r['unique_naics_year_vintage_comparisons']==36
          assert r['original_excel_tax_population_year_cells_required']==72
          assert r['2017_unchanged_anchor_categories']==3
          assert r['source_year_cells_changed']==15
          assert r['2018_2022_downward_revised_categories_years']==15
          hist={x['naics']:x for x in r['industry_comparisons']}
          assert hist['484']['2017_to_2022_benchmarked_nominal_cumulative_growth_pct']=='45.69'
          assert hist['484121']['2017_to_2022_benchmarked_nominal_cumulative_growth_pct']=='53.61'
          assert hist['484122']['2017_to_2022_benchmarked_nominal_cumulative_growth_pct']=='42.21'
          assert hist['484122']['2017_to_2022_older_vintage_nominal_cumulative_growth_pct']=='48.10'
          assert r['recoverable_overpayment_market_usd'] is None
          assert r['actual_paid_customer_freight_invoice_sample_size']==0
          assert r['pilot_18_independent_external_controls_still_unmet'] is True
          assert len(labs['lab_runs'])==14 and labs['failed_or_blocked_labs']==[]
          assert labs['actual_revenue_cents']==0
          assert labs['pilot_preflight']['unmet_requirements']==18
          assert labs['sas_temporal_history']['receipt_sha256']==r['receipt_sha256']
          assert 'sas_temporal_revisions.html' in Path('/tmp/retally-m24-control/index.html').read_text()
          assert (root/'sas_temporal_revisions.html').is_file()
          print('Six-year SAS source snapshot, growth/vintage guards, 14 labs and 18 human pilot holds: PASS.')
          PY
      - name: Retain research-only offline report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: retally-lab14-sas-temporal-offline
          path: |
            /tmp/retally-m24-offline/sas_temporal_revisions.json
            /tmp/retally-m24-offline/sas_temporal_revisions.html
          if-no-files-found: error
          retention-days: 14

  verify-original-census-six-year-workbooks:
    needs: offline-history-evidence-and-lab14
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Download two Census originals and verify all 72 six-year source tax cells
        run: |
          PYTHONPATH=. python -m freight.research_sas_temporal \
            --fetch-originals --as-of-date "$(date -u +%F)" \
            --out /tmp/retally-m24-census
      - name: Fail closed on source errors and forbid paid-invoice/recovery claims
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('/tmp/retally-m24-census/sas_temporal_revisions.json').read_text())
          assert r['scope']=='LAB14_SAS_2017_2022_CENSUS_VINTAGE_REVISION_SURFACE_NOT_AUDIT_SPEND'
          assert r['lab']==14 and r['new_lab_created'] is False
          assert r['source_year_cells_changed']==15
          assert r['2017_unchanged_anchor_categories']==3
          assert r['2018_2022_downward_revised_categories_years']==15
          assert r['original_excel_tax_population_year_cells_required']==72
          assert r['source_year_2022_cv_zero_proves_perfect_precision'] is False
          assert r['historical_growth_changes_are_statistically_significant'] is False
          assert r['freight_invoice_error_rate_pct'] is None
          assert r['actual_paid_customer_freight_invoice_sample_size']==0
          assert r['recoverable_overpayment_market_usd'] is None
          assert r['actual_retally_recovered_cash_usd'] is None
          assert r['buyer_demand_study_completed'] is False
          assert r['permitted_commercial_publication_or_outreach'] is False
          assert r['pilot_18_independent_external_controls_still_unmet'] is True
          assert r['scheduled_tasks_created_or_modified'] is False
          assert len(r['receipt_sha256'])==64
          if r['source_status']=='CENSUS_SAS_2017_2022_ORIGINAL_XLSX_72_SOURCE_CELLS_VERIFIED':
              assert r['census_original_workbooks_replayed_this_run'] is True
              proof=r['original_census_workbook_receipts']
              assert len(proof)==2
              p={x['publication_vintage']:x for x in proof}
              assert p['revised_2026_sas']['original_source_sha256']=='cdfaaec9375064517da18e81623308fe4d62ae3ad102a232413ec2a6299310ac'
              assert p['legacy_2024_sas']['original_source_sha256']=='4aa1efe9533fb3b16f32806af4f0b1bd5c72e92f2db024e559f891e03f0bc33a'
              assert all(x['original_table_rows']==839 and
                         x['source_rows_replayed']==6 and
                         x['annual_source_values_replayed']==36 and
                         x['source_is_digitally_signed_by_census'] is False
                         for x in proof)
              assert sum(x['annual_source_values_replayed'] for x in proof)==72
              print('VERIFIED original Census 2017–2022 SAS years: 72 tax-population cells, two source vintages.')
          elif r['source_status']=='BLOCKED_CENSUS_SAS_SOURCE_NETWORK_NO_NEW_BYTE_VERIFICATION':
              assert r['census_original_workbooks_replayed_this_run'] is False
              assert r['original_census_workbook_receipts']==[]
              print('::warning::Census publisher network unavailable; no new source replay certified.')
          else:
              raise AssertionError('M24_SOURCE_STATUS_NOT_ALLOWED_OR_SOURCE_DATA_CHANGED')
          PY
      - name: Retain only read-only evidence report, never original government workbooks
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: retally-lab14-sas-temporal-original-evidence
          path: |
            /tmp/retally-m24-census/sas_temporal_revisions.json
            /tmp/retally-m24-census/sas_temporal_revisions.html
          if-no-files-found: error
          retention-days: 14
