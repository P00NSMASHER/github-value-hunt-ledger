name: RETALLY Lab 14 SEC Original Freight Contract Authority
on:
  pull_request:
    paths:
      - '.github/workflows/retally-sec-contract-authority.yml'
      - 'freight/public_sec_contract_authority_v1.py'
      - 'freight/test_public_sec_contract_authority_v1.py'
      - 'freight/fixtures/public_sec_2005_2007_original_carrier_rate_contracts.json'
      - 'freight/RESEARCH_SEC_ORIGINAL_CONTRACT_RATES_20261018.md'
      - 'freight/public_original_research_control.py'
      - 'freight/test_public_original_research_control.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sec-filed-original-carrier-rate-authority:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Exact original SEC exhibit identity, incompatible fuel index and false invoice negative tests
        run: |
          PYTHONPATH=. python -m unittest -v freight.test_public_sec_contract_authority_v1
          PYTHONPATH=. python -m unittest -v freight.test_public_original_research_control
      - name: Assert synthetic source-specific pricing is never promoted to verified customer money
        run: |
          PYTHONPATH=. python -m freight.public_sec_contract_authority_v1 > /tmp/sec_original_contracts.json
          PYTHONPATH=. python -m freight.public_original_research_control > /tmp/lab14_public_originals.json
          python - <<'PY'
          import json
          from pathlib import Path
          sec=json.loads(Path('/tmp/sec_original_contracts.json').read_text())
          whole=json.loads(Path('/tmp/lab14_public_originals.json').read_text())
          assert sec['scope']=='RETALLY_LAB14_ORIGINAL_SEC_HISTORICAL_CONTRACT_EXHIBITS_ONLY'
          assert sec['independently_published_original_SEC_agreements']==2
          assert sec['historical_governing_index_methods']=={
            'NEDAK_WESTERN_2007':'LOCAL_NONAFFILIATED_NO2_DIESEL_RETAIL_O_NEILL_NE',
            'SWIFT_LOAD_SOURCE_2005':'DOE_NATIONAL_AVERAGE_DIESEL_MON_OR_FEDERAL_HOLIDAY_TUE',
          }
          assert sec['NEDAK_illustration_not_actual_invoice']['hypothetical_unamended_freight_charge_usd']=='13.29'
          assert sec['SWIFT_illustration_not_actual_invoice']['hypothetical_FUEL_ONLY_charge_usd']=='1.50'
          assert sec['actual_RETALLY_customer_invoices']==0
          assert sec['actual_RETALLY_overcharge_cents'] is None
          assert sec['actual_RETALLY_recovery_cents']==0
          assert whole['total_bounded_observations']==307
          assert whole['separate_original_SEC_historical_carrier_agreements']==2
          assert whole['SEC_contracts_not_in_307_public_observation_count'] is True
          assert whole['original_historical_findings_still_open']==26
          assert whole['independent_first_customer_human_gates_unmet']==18
          assert whole['actual_RETALLY_cash_recovered_cents']==0
          assert whole['commercial_claim_clearance']=='NO_GO'
          print('SEC original contract-bound fuel schedules verified as historical hypothetical tests, never invoices or recoveries.')
          PY
