name: RETALLY Lab 14 Settlement Row Identity Hardening (Mission 42)
on:
  pull_request:
    paths:
      - '.github/workflows/retally-settlement-row-identity-m42.yml'
      - 'freight/lab_assurance.py'
      - 'freight/test_lab_assurance.py'
      - 'freight/lab_settlement_identity_m42.py'
      - 'freight/test_lab_settlement_identity_m42.py'
      - 'freight/lab_phase4_director.py'
      - 'freight/lab_cross_lab_assurance_m39.py'
      - 'freight/test_lab_cross_lab_assurance_m39.py'
      - 'freight/lab_phase4_control_center.py'
      - 'freight/RESEARCH_SETTLEMENT_ROW_IDENTITY_M42.md'
  workflow_dispatch:
permissions:
  contents: read

jobs:
  independent-source-and-fourteen-lab-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install inherited offline research dependencies
        run: |
          python -m pip install -r production/requirements-ci.txt
          python -m pip install cryptography==46.0.4 openpyxl==3.1.5
      - name: Test strict duplicate IDs and inherited provider-money guards
        run: |
          PYTHONPATH=. python -m pytest -q \
            freight/test_lab_settlement_identity_m42.py \
            freight/test_lab_assurance.py \
            freight/test_settlement_store.py \
            freight/test_lab_critical_counterexample_replay_m41.py \
            freight/test_lab_phase3_real_chain.py \
            freight/test_lab_phase4_director.py \
            freight/test_lab_cross_lab_assurance_m39.py \
            freight/test_lab_historical_disposition_m40.py \
            freight/test_lab_phase4_experiments.py \
            freight/test_research_pilot_preflight.py
      - name: Generate three exact current-code denials and the existing fourteen-lab control center
        run: |
          PYTHONPATH=. python -m freight.lab_settlement_identity_m42 \
            --as-of-date "$(date -u +%F)" --out /tmp/retally-m42
          PYTHONPATH=. python -m freight.lab_phase4_control_center \
            --out /tmp/retally-m42-control
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('/tmp/retally-m42/settlement_identity_m42.json').read_text())
          c=json.loads(Path('/tmp/retally-m42-control/phase4_control.json').read_text())
          assert m['scope']=='RETALLY_LAB14_M42_INDEPENDENT_SETTLEMENT_ROW_IDENTITY_SYNTHETIC_ONLY'
          assert m['unconstrained_duplicate_row_attacks']==3
          assert m['independent_verifier_expected_denials']==3
          assert [x['scenario'] for x in m['cases']]==['ALLOCATION','COUNTER','REVERSAL']
          assert all(x['negative_case_rejected_exactly'] for x in m['cases'])
          assert all(x['source_row_observation']['after_row_count']==2
                     and x['source_row_observation']['after_distinct_identity_count']==1
                     for x in m['cases'])
          assert m['historical_original_findings_closed']==0
          assert m['historical_original_findings_open']==26
          assert m['separate_human_pilot_controls_unmet']==18
          assert m['external_publication_claims_authorized']==0
          assert m['actual_verified_cash_recovered_usd'] is None
          assert len(c['lab_runs'])==14 and c['failed_or_blocked_labs']==[]
          assert c['cross_lab_integrity_m39']['all_fourteen_locally_executed'] is True
          assert c['settlement_identity_m42']['receipt_sha256']==m['receipt_sha256']
          assert c['critical_counterexamples_m41']['current_source_guards_rejected_attack']==4
          assert c['historical_finding_disposition_m40']['original_historical_findings_open']==26
          assert c['actual_revenue_cents']==0
          assert 'settlement_identity_m42.html' in Path('/tmp/retally-m42-control/index.html').read_text()
          print('M42: three untrusted SQLite duplicate ID classes fail closed, 14 original labs pass; 26 historical issues remain open.')
          PY
      - name: Retain synthetic, metadata-only settlement ID hardening receipts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: retally-m42-three-duplicate-identifier-negative-evidence
          path: |
            /tmp/retally-m42/settlement_identity_m42.json
            /tmp/retally-m42/settlement_identity_m42.html
          if-no-files-found: error
          retention-days: 14

  independent-raw-sqlite-duplicate-proof:
    needs: independent-source-and-fourteen-lab-regression
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Independently inject duplicate rows in untrusted SQLite snapshots
        run: |
          PYTHONPATH=. python - <<'PY'
          import sqlite3,tempfile
          from pathlib import Path
          from freight.test_lab_assurance import populate,BUYER,BU,assertions_and_fees,verifier
          from freight.lab_assurance import verify_settlement,AssuranceRejected
          attack=(
            ('allocations',"INSERT INTO allocations SELECT * FROM allocations WHERE allocation_id='allocation-400'",'DUPLICATE_ALLOCATION_ID'),
            ('counter_events',"INSERT INTO counter_events SELECT * FROM counter_events WHERE counter_id='return-500'",'DUPLICATE_COUNTER_ID'),
            ('reversal_edges',"UPDATE reversal_edges SET amount_cents=499 WHERE reversal_id='reversal-500';INSERT INTO reversal_edges SELECT buyer_id,business_unit,reversal_id,counter_id,allocation_id,1,created_at FROM reversal_edges WHERE reversal_id='reversal-500'",'DUPLICATE_OR_INVALID_REVERSAL_ID'),
          )
          for table,sql,code in attack:
              with tempfile.TemporaryDirectory() as td:
                  db=Path(td)/'legacy.sqlite'
                  populate(db)
                  p,f=assertions_and_fees()
                  kwargs=dict(buyer_id=BUYER,business_unit=BU,
                              assertions=p,fee_events=f,verifier=verifier())
                  assert verify_settlement(db,**kwargs).status=='PASS_SYNTHETIC_ONLY'
                  con=sqlite3.connect(db)
                  try:
                      con.executescript(sql)
                      con.commit()
                  finally:
                      con.close()
                  try:
                      verify_settlement(db,**kwargs)
                  except AssuranceRejected as exc:
                      assert exc.code==code,(table,exc.code)
                  else:
                      raise AssertionError('duplicated raw '+table+' accepted')
          print('Independent negative proof: all three raw duplicate identifiers rejected with exact code.')
          PY
