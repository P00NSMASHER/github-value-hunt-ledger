name: RETALLY Lab 14 Settlement Source and Chronology Hardening (Mission 43)
on:
  pull_request:
    paths:
      - '.github/workflows/retally-settlement-source-m43.yml'
      - 'freight/lab_assurance.py'
      - 'freight/lab_settlement_source_m43.py'
      - 'freight/test_lab_settlement_source_m43.py'
      - 'freight/lab_phase4_director.py'
      - 'freight/lab_cross_lab_assurance_m39.py'
      - 'freight/test_lab_cross_lab_assurance_m39.py'
      - 'freight/lab_phase4_control_center.py'
      - 'freight/RESEARCH_SETTLEMENT_SOURCE_M43.md'
  workflow_dispatch:
permissions:
  contents: read

jobs:
  twelve-current-code-negative-probes-and-fourteen-labs:
    runs-on: ubuntu-latest
    timeout-minutes: 23
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install original offline-only research dependencies
        run: |
          python -m pip install -r production/requirements-ci.txt
          python -m pip install cryptography==46.0.4 openpyxl==3.1.5
      - name: Adversarial settlement, real Python domain and original pilot controls
        run: |
          PYTHONPATH=. python -m pytest -q \
            freight/test_lab_settlement_source_m43.py \
            freight/test_lab_assurance.py \
            freight/test_settlement_store.py \
            freight/test_lab_settlement_identity_m42.py \
            freight/test_lab_critical_counterexample_replay_m41.py \
            freight/test_lab_phase3_real_chain.py \
            freight/test_lab_phase4_director.py \
            freight/test_lab_cross_lab_assurance_m39.py \
            freight/test_lab_historical_disposition_m40.py \
            freight/test_lab_phase4_experiments.py \
            freight/test_lab_experiment_ledger.py \
            freight/test_research_pilot_preflight.py
      - name: Real 12-scenario current-code report and all existing fourteen labs
        run: |
          PYTHONPATH=. python -m freight.lab_settlement_source_m43 \
            --as-of-date "$(date -u +%F)" --out /tmp/retally-m43
          PYTHONPATH=. python -m freight.lab_phase4_control_center \
            --out /tmp/retally-m43-control
          python - <<'PY'
          import json
          from pathlib import Path
          q=json.loads(Path('/tmp/retally-m43/settlement_source_m43.json').read_text())
          r=json.loads(Path('/tmp/retally-m43-control/phase4_control.json').read_text())
          assert q['scope']=='RETALLY_LAB14_M43_SYNTHETIC_SETTLEMENT_PROVENANCE_AND_CHRONOLOGY'
          assert q['existing_research_lab']==14 and q['new_lab_created'] is False
          assert q['current_verifier_negative_scenarios']==12
          assert q['known_good_synthetic_positive_controls']==12
          assert q['current_verifier_exact_negative_denials']==12
          assert len(q['cases'])==12
          assert all(c['positive_control_passed']
                     and c['actual_exact_denial']==c['expected_exact_denial']
                     and not c['historical_recoveryos_finding_closed']
                     for c in q['cases'])
          assert q['historical_original_findings_open']==26
          assert q['historical_original_findings_closed']==0
          assert q['unmet_independent_human_pilot_controls']==18
          assert q['external_empirical_claims_authorized']==0
          assert q['actual_customer_cash_recovered'] is None
          assert len(r['lab_runs'])==14 and not r['failed_or_blocked_labs']
          assert r['executed_labs']==list(range(1,15))
          assert r['cross_lab_integrity_m39']['all_fourteen_locally_executed'] is True
          assert r['settlement_source_m43']['receipt_sha256']==q['receipt_sha256']
          assert r['settlement_identity_m42']['independent_verifier_expected_denials']==3
          assert r['critical_counterexamples_m41']['current_source_guards_rejected_attack']==4
          assert r['historical_finding_disposition_m40']['original_historical_findings_open']==26
          assert r['actual_revenue_cents']==0
          assert 'settlement_source_m43.html' in Path('/tmp/retally-m43-control/index.html').read_text()
          print('M43: 12 original current-code negative guards, 14 original labs, no historical closures.')
          PY
      - name: Retain safe derived internal-only reports for fourteen days
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: retally-lab14-m43-source-integrity-synthetic-evidence
          path: |
            /tmp/retally-m43/settlement_source_m43.json
            /tmp/retally-m43/settlement_source_m43.html
          if-no-files-found: error
          retention-days: 14

  independent-prior-source-differential:
    needs: twelve-current-code-negative-probes-and-fourteen-labs
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Load immediate prior verifier source read-only, without promoting prior passes
        run: |
          # Pinned M42 source baseline: HEAD^ is NOT stable after later
          # chained research PRs or documentation/test follow-up commits.
          git fetch --no-tags --depth=1 origin 1be4320ef57256251e83e2c34eff914a19e53a06
          git show 1be4320ef57256251e83e2c34eff914a19e53a06:freight/lab_assurance.py > /tmp/m43-prior-verifier-source.py
          test -s /tmp/m43-prior-verifier-source.py
      - name: Independently compare prior source and fixed verifier against eleven identical financial counterexamples
        run: |
          PYTHONPATH=. python - <<'PY'
          import importlib.util,sys,tempfile
          from pathlib import Path
          from freight import lab_settlement_source_m43 as m43
          from freight.test_lab_assurance import (
              BUYER,BU,assertions_and_fees,populate,verifier
          )
          from freight.lab_assurance import verify_settlement,AssuranceRejected
          name='m43_prior_verifier'
          spec=importlib.util.spec_from_file_location(name,'/tmp/m43-prior-verifier-source.py')
          prior=importlib.util.module_from_spec(spec)
          sys.modules[name]=prior
          spec.loader.exec_module(prior)
          prior_passes=0
          # Reversal-before-allocation has an additional fee-timing consequence,
          # so it is tested by new-code exact denial, not an old-code PASS claim.
          cases=[c for c in m43.REJECTIONS if c!='REVERSAL_BEFORE_ALLOCATION']
          assert len(cases)==11
          for scenario in cases:
              with tempfile.TemporaryDirectory() as td:
                  db=Path(td)/'isolated.sqlite'
                  populate(db)
                  proofs,events=assertions_and_fees()
                  kwargs=dict(buyer_id=BUYER,business_unit=BU,
                              fee_events=events,verifier=verifier())
                  assert verify_settlement(db,assertions=proofs,**kwargs).status=='PASS_SYNTHETIC_ONLY'
                  altered=m43._mutate(db,scenario,proofs)
                  old=prior.verify_settlement(db,assertions=altered,**kwargs)
                  assert old.status=='PASS_SYNTHETIC_ONLY',scenario
                  prior_passes+=1
                  try:
                      verify_settlement(db,assertions=altered,**kwargs)
                  except AssuranceRejected as exc:
                      assert exc.code==m43.REJECTIONS[scenario],(scenario,exc.code)
                  else:
                      raise AssertionError('fixed verifier accepted '+scenario)
          assert prior_passes==11
          print('M43 independent differential: immediate prior verifier accepted 11 test-only invalid sources; fixed verifier rejects all with exact typed denial.')
          PY
