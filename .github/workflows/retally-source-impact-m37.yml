name: RETALLY Lab 14 Source-Revision Blast Radius (Mission 37)
on:
  pull_request:
    paths:
      - '.github/workflows/retally-source-impact-m37.yml'
      - 'freight/research_source_lineage_m37.py'
      - 'freight/test_research_source_lineage_m37.py'
      - 'freight/RESEARCH_SOURCE_IMPACT_M37.md'
      - 'freight/lab_phase4_director.py'
      - 'freight/lab_phase4_control_center.py'
      - 'freight/research_claim_clearance_m35.py'
      - 'freight/research/CLAIM_CLEARANCE_M35_20261012.json'
  workflow_dispatch:
permissions:
  contents: read

jobs:
  original-source-and-impact-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install inherited offline research test dependencies
        run: |
          python -m pip install -r production/requirements-ci.txt
          python -m pip install cryptography==46.0.4 openpyxl==3.1.5
      - name: Verify original 18 human gates and date-bound lineage blast radius
        run: |
          PYTHONPATH=. python -m pytest -q \
            freight/test_research_source_lineage_m37.py \
            freight/test_research_claim_clearance_m35.py \
            freight/test_research_pilot_preflight.py \
            freight/test_research_economic_denominator_m34.py \
            freight/test_research_bea_original_m33.py \
            freight/test_research_bls_sectoral_output_m31.py \
            freight/test_research_unified_blspci.py \
            freight/test_lab_phase4_director.py
      - name: Generate non-commercial report inside original fourteen-lab Control Center
        run: |
          PYTHONPATH=. python -m freight.research_source_lineage_m37 \
            --as-of-date "$(date -u +%F)" --out /tmp/retally-m37
          PYTHONPATH=. python -m freight.lab_phase4_control_center \
            --out /tmp/retally-m37-control
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('/tmp/retally-m37/source_change_impact.json').read_text())
          c=json.loads(Path('/tmp/retally-m37-control/phase4_control.json').read_text())
          assert r['lab']==14 and r['new_lab_created'] is False
          assert r['source_family_count']==5
          assert r['candidate_sources_submitted']==0
          assert r['source_original_publisher_replay_completed_in_this_run'] is False
          assert r['report_changes_prove_actual_publisher_revisions'] is False
          assert r['external_commercial_claims_authorized']==0
          assert r['original_pilot_human_signoffs_unmet']==18
          assert len(r['claims'])==16
          assert len(c['lab_runs'])==14 and not c['failed_or_blocked_labs']
          assert c['research_source_lineage_m37']['receipt_sha256']==r['receipt_sha256']
          assert 'source_change_impact.html' in Path('/tmp/retally-m37-control/index.html').read_text()
          print('M37: five date-bound local source families; 16 claims; 18 human gates unmet; 14 original labs.')
          PY
      - name: Retain metadata-only internal impact receipts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: retally-lab14-m37-offline-source-impact-receipts
          path: |
            /tmp/retally-m37/source_change_impact.json
            /tmp/retally-m37/source_change_impact.html
          if-no-files-found: error
          retention-days: 14

  independent-negative-source-mutation:
    needs: original-source-and-impact-regressions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install inherited offline research dependencies
        run: |
          python -m pip install -r production/requirements-ci.txt
          python -m pip install cryptography==46.0.4 openpyxl==3.1.5
      - name: Independently exercise original source family and forged approvals
        run: |
          PYTHONPATH=. python - <<'PY'
          from datetime import date
          from freight.research_source_lineage_m37 import (
              ROOTS, candidate_template, report_shell
          )
          today=date.today()
          expected={'BEA':5,'CENSUS':4,'BLS_PPI':2,'BLS_SECTORAL':1,'PILOT':0}
          for root in ROOTS:
              r=report_shell(as_of=today,candidate=candidate_template(
                  as_of=today,root=root,digest='0'*64))
              assert len(r['affected_internal_source_claim_ids'])==expected[root]
              assert len(r['affected_all_claim_ids_including_pilot_review'])==(
                  16 if root=='PILOT' else expected[root])
              assert r['external_commercial_claims_authorized']==0
              assert r['report_changes_prove_actual_publisher_revisions'] is False
              assert all(x['external_claims_authorized'] is False for x in r['claims'])
          fake=candidate_template(as_of=today,root='CENSUS',digest='f'*64)
          fake['external_publication_authorized']=True
          try:
              report_shell(as_of=today,candidate=fake)
          except ValueError:
              pass
          else:
              raise AssertionError('M37 forged marketing approval accepted')
          print('M37 independent negative proof: five what-if source roots, no original replay or commercial approvals')
          PY
