      - "freight/fixtures/gao_b*.json"
      - "freight/test_unified_research_ci_contract.py"
      - "freight/fixtures/nyc_dob_*_v1.json"
      - "freight/fixtures/*_candidate_v0.json"
      - "freight/test_nyc_dob_*_v1.py"
      - "freight/research_lab_worker*"
      - "freight/research_lab/**"
      - "freight/UNIFIED_RESEARCH_LAB.md"
      - "freight/research_eval_bridge.py"
      - "freight/test_research_eval_bridge.py"
      - "freight/real_world_eval_v1.py"
      - "freight/fixtures/real_world_eval_v1.json"
      - ".github/workflows/retally-unified-research-lab.yml"
      - ".github/workflows/retally-lab15-public-evidence.yml"
      - ".github/workflows/retally-lab15-evidence-acquisition.yml"
  push:
    branches: [main]
    paths:
      - "freight/unified_research_lab.py"
      - "freight/test_unified_research_lab.py"
      - "freight/research_lab_worker*"
      - "freight/research_lab_health.py"
      - "freight/test_research_lab_health.py"
      - "freight/research_source_review.py"
      - "freight/test_research_source_review.py"
      - "freight/research_publisher_provenance.py"
      - "freight/test_research_publisher_provenance.py"
      - "freight/official_nyc_issued_permit_lab.py"
      - "freight/test_official_nyc_issued_permit_lab.py"
      - "freight/official_capturebrief_award_lab.py"
      - "freight/test_official_capturebrief_award_lab.py"
      - "freight/capturebrief_sam_fy2027_asof.py"
      - "freight/test_capturebrief_sam_fy2027_asof.py"
      - "freight/gao_adjudication_chronology.py"
      - "freight/test_gao_adjudication_chronology.py"
