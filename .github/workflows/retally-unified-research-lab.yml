      - "freight/fixtures/cbca_rate_billing_controls_v1.json"
      - "freight/cbca_rail_detention_timeline.py"
      - "freight/test_cbca_rail_detention_timeline.py"
      - "freight/fixtures/cbca_rail_detention_timeline_v1.json"
      - "freight/public_freight_proof_ladder.py"
      - "freight/test_public_freight_proof_ladder.py"
      - "freight/fixtures/public_freight_rate_cash_proof_v1.json"
      - "freight/fmc_real_shipper_billing_lifecycle.py"
      - "freight/test_fmc_real_shipper_billing_lifecycle.py"
      - "freight/fixtures/fmc_real_shipper_billing_lifecycle_v1.json"
      - "freight/real_document_lab.py"
      - "freight/test_real_document_lab.py"
      - "freight/freight_evidence_chain_readiness.py"
      - "freight/test_freight_evidence_chain_readiness.py"
      - "freight/test_gao_b221594_negative_control.py"
      - "freight/test_gao_b189100_classification.py"
      - "freight/fixtures/gao_motor_freight_numeric_v1.json"
      - "freight/fixtures/gao_b*.json"
      - "freight/test_unified_research_ci_contract.py"
      - "freight/fixtures/nyc_dob_*_v1.json"
      - "freight/fixtures/*_candidate_v0.json"
      - "freight/test_nyc_dob_*_v1.py"
      - "freight/UNIFIED_RESEARCH_LAB.md"
      - "freight/research_eval_bridge.py"
      - "freight/test_research_eval_bridge.py"
      - "freight/real_world_eval_v1.py"
      - "freight/fixtures/real_world_eval_v1.json"
      - ".github/workflows/retally-unified-research-lab.yml"
  schedule:
    # Frequent bounded controller; 7/10 planned discovery slots prioritize FreightRecovery.
    - cron: "4-59/5 * * * *"
    # Expensive original-document and three-engine read-only replay.
    - cron: "19 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Compile and adversarially validate four lanes plus FreightRecovery feed
        run: |
          python -m py_compile freight/unified_research_lab.py freight/test_unified_research_lab.py freight/research_eval_bridge.py freight/test_research_eval_bridge.py freight/research_lab_health.py freight/test_research_lab_health.py freight/research_source_review.py freight/test_research_source_review.py freight/research_publisher_provenance.py freight/test_research_publisher_provenance.py freight/official_nyc_issued_permit_lab.py freight/test_official_nyc_issued_permit_lab.py freight/official_capturebrief_award_lab.py freight/test_official_capturebrief_award_lab.py freight/capturebrief_sam_fy2027_asof.py freight/test_capturebrief_sam_fy2027_asof.py freight/gao_adjudication_chronology.py freight/test_gao_adjudication_chronology.py freight/gao_motor_freight_numeric.py freight/test_gao_motor_freight_numeric.py freight/gao_adjudicated_billing_cases.py freight/test_gao_adjudicated_billing_cases.py freight/cbca_rate_billing_controls.py freight/test_cbca_rate_billing_controls.py freight/cbca_rail_detention_timeline.py freight/test_cbca_rail_detention_timeline.py freight/public_freight_proof_ladder.py freight/test_public_freight_proof_ladder.py freight/fmc_real_shipper_billing_lifecycle.py freight/test_fmc_real_shipper_billing_lifecycle.py freight/test_gao_b221594_negative_control.py freight/test_gao_b189100_classification.py
          python -m unittest -v freight.test_unified_research_lab freight.test_research_lab_health freight.test_research_source_review freight.test_research_publisher_provenance freight.test_official_nyc_issued_permit_lab freight.test_official_capturebrief_award_lab freight.test_capturebrief_sam_fy2027_asof freight.test_gao_adjudication_chronology freight.test_gao_motor_freight_numeric freight.test_gao_adjudicated_billing_cases freight.test_cbca_rate_billing_controls freight.test_cbca_rail_detention_timeline freight.test_public_freight_proof_ladder freight.test_fmc_real_shipper_billing_lifecycle freight.test_gao_b221594_negative_control freight.test_gao_b189100_classification
          python -m py_compile freight/freight_evidence_chain_readiness.py freight/test_freight_evidence_chain_readiness.py
          python -m unittest -q freight.test_freight_evidence_chain_readiness
      - name: Verify independent Cloudflare scheduler contract
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.23.4"
      - name: Verify October 2026 patched Node.js runtime
        run: |
          node --version
          node -e 'const [major,minor,patch]=process.versions.node.split(".").map(Number); if(major!==22 || minor<23 || (minor===23 && patch<4)) process.exit(1)'
      - name: Execute Cloudflare tests, bridge regressions and frozen evaluation
        run: |
          node --test freight/research_lab_worker.test.mjs
          python -m unittest -q freight.test_research_eval_bridge freight.test_unified_research_ci_contract
          python -m unittest -q freight.test_nyc_dob_source_scope_v1 freight.test_nyc_dob_excluded_scope_v1
          python -m freight.real_world_eval_v1
          python -m unittest -q freight.test_real_document_lab

  discover:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && github.event.schedule == '4-59/5 * * * *')
    runs-on: ubuntu-latest
    timeout-minutes: 18
    permissions:
      contents: write
    concurrency:
      group: retally-unified-research-ledger-writer
      cancel-in-progress: false
    steps:
      - name: Checkout approved controller on main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Switch to one isolated research-only branch
        env:
          DATA_BRANCH: research/retally-unified-data-lab
        run: |
          set -euo pipefail
          git fetch origin main
          if git ls-remote --exit-code --heads origin "$DATA_BRANCH" >/dev/null 2>&1; then
            git fetch origin "refs/heads/$DATA_BRANCH:refs/remotes/origin/$DATA_BRANCH"
            git switch -c "$DATA_BRANCH" --track "origin/$DATA_BRANCH"
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' merge --no-edit origin/main
          else
            git switch -c "$DATA_BRANCH" origin/main
          fi
      - name: Prove research safety properties before public network access
        run: python -m unittest -q freight.test_unified_research_lab
      - name: Discover real public-data source leads without storing source content
        env:
          # Optional official Data.gov v4 key; absent by default. No DEMO_KEY.
          RETALLY_DATAGOV_API_KEY: ${{ secrets.RETALLY_DATAGOV_API_KEY }}
        run: |
          set -euo pipefail
          # Bootstrap all official, non-identifying v1 references before the
          # existing real live-source scan and health/provenance receipt.
          for engine in freightrecovery permitplate capturebrief recoveryos; do
            python -m freight.unified_research_lab --engine "$engine" > /tmp/retally-seed-"$engine".json
          done
          # Each infrequent GitHub run mirrors all four independent Cloudflare
          # lanes before rotating its own live external search. This prevents
          # GitHub cron gaps from starving any one engine's branch publication.
          python -m freight.unified_research_lab --mirror-scout-all | tee /tmp/retally-scout-mirror.json
          python -m freight.unified_research_lab --live | tee /tmp/retally-research-run.json
          python - <<'PY'
          import json
          from freight.unified_research_lab import read_ledger
          summary = json.load(open('/tmp/retally-research-run.json', encoding='utf-8'))
          mirror = json.load(open('/tmp/retally-scout-mirror.json', encoding='utf-8'))
          assert mirror['third_party_documents_saved'] == 0
          assert mirror['customer_contact_actions'] == 0
          assert mirror['production_changes'] == 0
          ledger = read_ledger()
          assert summary['customer_contact_actions'] == 0
          assert summary['third_party_documents_saved'] == 0
          assert summary['approved_real_truth_cases'] == 0
          assert summary['production_changes'] == 0
          assert len(ledger['entries']) == summary['total_leads']
          from collections import Counter
          from pathlib import Path
          counts = Counter(engine for row in ledger['entries'] for engine in row['engines'])
          assert all(counts.get(engine, 0) > 0 for engine in ('freightrecovery','permitplate','capturebrief','recoveryos'))
          summary_lines = [
              '## RETALLY Unified Research Lab — live discovery',
              f"- Engine scanned: {summary['engine']}",
              f"- New real-world source references (rotated live lane): {summary['new_leads']}",
              f"- New source references mirrored across four Cloudflare lanes: {mirror['new_leads']}",
              f"- Indexed source references: {summary['total_leads']}",
              f"- Public metadata provider errors: {len(summary['feed_errors'])}",
              '- External documents saved: 0',
              '- Financial truth or customer releases claimed: 0',
          ]
          summary_lines += [f"- {name}: {counts[name]} source references" for name in sorted(counts)]
          if summary['feed_errors'] or mirror['feed_errors']:
              summary_lines += ['### Provider warnings'] + [
                  '- '+x for x in summary['feed_errors'] + mirror['feed_errors']]
          Path(__import__('os').environ['GITHUB_STEP_SUMMARY']).write_text('\n'.join(summary_lines) + '\n')
          print('Four-engine metadata-only ledger validated; source counts:', dict(counts))
          PY
      - name: Preserve both existing Lab 15 collectors inside the unified branch
        env:
          RETALLY_LAB15_PUBLIC_FETCH_ENABLED: "1"
        run: |
          set -euo pipefail
          python - <<'PY' > /tmp/retally-legacy-due
          from datetime import datetime, timezone
          from freight.unified_research_lab import current_engine
          now = datetime.now(timezone.utc)
          print("yes" if current_engine(now) == "freightrecovery" and int(now.timestamp() // 1200) % 18 == 0 else "no")
          PY
          if [ "$(cat /tmp/retally-legacy-due)" = "yes" ]; then
            python -m freight.lab15_acquisition --live --report /tmp/retally-lab15-acquisition.json
            python -m freight.lab15_triage --out freight/lab15/triage_queue.json
            python -m freight.lab15_evidence_harvester --network --report /tmp/retally-lab15-discovery.json
          fi
          # The legacy queue is a derived view and may not exist on fresh
          # branches. Generate it deterministically before trying to stage.
          python -m freight.lab15_triage --out freight/lab15/triage_queue.json
      - name: Generate versioned FreightRecovery feed from all three research catalogs
        run: |
          set -euo pipefail
          python -m unittest -q freight.test_unified_research_lab freight.test_research_eval_bridge
          python -m freight.research_eval_bridge --output freight/research_lab/evaluation_feed_v1.json
          python -m freight.research_eval_bridge --output freight/research_lab/evaluation_feed_v1.json --verify
          python -m freight.real_world_eval_v1 > /tmp/retally-v1-frozen-evaluation.json

      - name: Publish reproducible four-engine metadata quality receipt
        run: |
          set -euo pipefail
          python -m unittest -q freight.test_research_lab_health
          python -m freight.research_lab_health --output freight/research_lab/source_health_v1.json
          python -m freight.research_lab_health --output freight/research_lab/source_health_v1.json --verify
      - name: Publish bounded review priorities and missing evidence for all four engines
        run: |
          set -euo pipefail
          python -m freight.research_source_review --output freight/research_lab/source_review_queue_v1.json
          python -m freight.research_source_review --output freight/research_lab/source_review_queue_v1.json --verify
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('freight/research_lab/source_review_queue_v1.json').read_text())
          assert data['commercial_recovery_allowed'] is False
          assert data['external_document_bytes_saved'] == 0
          assert data['independent_outcome_labels_promoted'] == 0
          lines = [
              '### Four-engine evidence-review priorities',
              '- All source URLs, license checks and original-document outcomes remain UNVERIFIED.',
          ]
          lines.extend(
              f"- {engine}: {v['ranked_for_manual_evidence_review']} URL candidates queued; "
              f"{v['url_only_topic_exclusions_not_deleted']} historical topic flags held"
              for engine, v in sorted(data['engines'].items())
          )
          with Path(__import__('os').environ['GITHUB_STEP_SUMMARY']).open('a') as out:
              out.write('\n'.join(lines) + '\n')
          PY
      - name: Observe pinned original publisher responses with bounded HEAD and SHA-256
        run: |
          set -euo pipefail
          # Once per UTC day (cached when public anchor custody is unchanged).
          # Never fetch unpinned repositories, source payloads over 256 KiB,
          # customer material, or independently invent a rights/truth label.
          python -m freight.research_publisher_provenance --live --output freight/research_lab/publisher_provenance_v1.json | tee /tmp/retally-publisher-status.json
          python -m freight.research_publisher_provenance --verify --output freight/research_lab/publisher_provenance_v1.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          x = json.loads(Path('/tmp/retally-publisher-status.json').read_text())
          assert x['commercial_reuse_approved'] is False
          assert x['independent_outcome_labels_verified'] == 0
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a') as out:
              out.write(
                  "### Publisher provenance (NOT benchmark validation)\n"
                  f"- Pinned public URLs checked: {x['pinned_public_sources_checked']}\n"
                  f"- HTTP 200 HEAD observations: {x['publisher_http_responses_observed']}\n"
                  f"- Complete responses SHA-256 fingerprinted (<=256 KiB): "
                  f"{x['complete_bounded_public_responses_fingerprinted']}\n"
                  "- Commercial rights and independent outcome labels: unverified\n"
              )
          PY
      - name: Replay bounded original NYC DOB NOW issued-permit publisher records
        run: |
          set -euo pipefail
          # Only official permit records; bounded 20-row sample plus three
          # exact publisher identity readbacks per UTC day; no body persisted.
          python -m freight.official_nyc_issued_permit_lab \
            --output freight/research_lab/official_nyc_issued_permit_replay_v1.json \
            | tee /tmp/retally-real-permit-source-report.json
          python -m freight.official_nyc_issued_permit_lab \
            --verify --output freight/research_lab/official_nyc_issued_permit_replay_v1.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          x = json.loads(Path('/tmp/retally-real-permit-source-report.json').read_text())
          assert x['source_specific_rights_verified'] is False
          assert x['independent_labels'] == 0
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a') as out:
              out.write(
                  '### Original NYC DOB NOW public record readback\n'
                  f"- Publisher observation status: {x['status']}\n"
                  f"- Original sampled source rows: {x['source_rows_replayed']}\n"
                  f"- Distinct row identities: {x['distinct_publisher_source_identities']}\n"
                  f"- Repeated publisher source rows: {x['repeated_publisher_source_rows']}\n"
                  f"- Independent publisher re-read requests: {x['original_publisher_second_reads']}\n"
                  f"- Ambiguous or unavailable re-reads: {x['ambiguous_or_unavailable_second_reads']}\n"
                  f"- Publisher-consistent row re-reads: {x['publisher_consistent_reads']}\n"
                  f"- Changed or conflicting record snapshots: {x['publisher_data_changed']}\n"
                  '- Customer opportunity outcomes and commercial-use rights: NOT independently verified\n'
              )
          PY
      - name: Replay bounded original USAspending contract award facts for CaptureBrief
        run: |
          set -euo pipefail
          # Read-only public search: 12 max original award rows and two exact
          # award-ID publisher readbacks per UTC day. No recipient records,
          # source JSON body, contract contacts, or customer data persisted.
          python -m freight.official_capturebrief_award_lab \
            --output freight/research_lab/official_capturebrief_award_readback_v1.json \
            | tee /tmp/retally-capturebrief-award-report.json
          python -m freight.official_capturebrief_award_lab \
            --verify --output freight/research_lab/official_capturebrief_award_readback_v1.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          x = json.loads(Path('/tmp/retally-capturebrief-award-report.json').read_text())
          assert x['source_specific_commercial_reuse_verified'] is False
          assert x['independently_verified_solicitation_outcomes'] == 0
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a') as out:
              out.write(
                  '### CaptureBrief original federal contract award readback\n'
                  f"- Publisher readback status: {x['status']}\n"
                  f"- Original USAspending contract awards sampled: {x['sample_contract_awards']}\n"
                  f"- Distinct original internal award IDs: {x['distinct_publisher_award_ids']}\n"
                  f"- Official publisher second reads: {x['publisher_second_reads']}\n"
                  f"- Official second reads matching exactly: {x['publisher_second_reads_exact']}\n"
                  f"- Second-read HTTP/status error categories: {x['publisher_readback_error_codes']}\n"
                  f"- Separate publisher award-detail GETs attempted: {x['publisher_detail_lookup_attempted']}\n"
                  f"- Award-detail ID-and-amount matches (not date or outcome proof): {x['publisher_detail_identity_amount_matched']}\n"
                  f"- Award-detail source failures: {x['publisher_detail_error_codes']}\n"
                  '- Independent live solicitations/award outcomes: NOT established\n'
              )
          PY
      - name: Prove SAM FY2027 original public archive bytes and anti-lookahead scope
        run: |
          set -euo pipefail
          # Research-only first-party-listed file, not an approved CaptureBrief
          # production catalog. Only bounded source bytes in runner memory;
          # file digest and aggregate source counts enter data branch.
          python -m freight.capturebrief_sam_fy2027_asof \
            --output freight/research_lab/capturebrief_sam_fy2027_asof_v1.json \
            | tee /tmp/retally-sam-fy2027-public-replay.json
          python -m freight.capturebrief_sam_fy2027_asof --verify \
            --output freight/research_lab/capturebrief_sam_fy2027_asof_v1.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          x = json.loads(Path('/tmp/retally-sam-fy2027-public-replay.json').read_text())
          assert x['production_catalog_approved'] is False
          assert x['real_cross_source_award_labels'] == 0
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a') as out:
              out.write(
                  '### CaptureBrief SAM FY2027 archive research chronology (NOT release-approved)\n'
                  f"- Original source state: {x['source_status']}\n"
                  f"- Original archive rows parsed: {x['source_rows']}\n"
                  f"- Distinct public original notice IDs: {x['unique_notice_ids']}\n"
                  f"- Source rows quarantined for solicitation control characters: {x['source_rows_quarantined_solicitation_control']}\n"
                  f"- Current original SHA matches archived Oct 19 digest: {x['source_digest_matches_historical_oct19']}\n"
                  f"- Source failure categories: {x['source_error_codes']}\n"
                  '- Independent as-of SAM-to-USAspending award outcomes: ZERO\n'
              )
          PY
      - name: Enforce 1986 GAO reconsideration over superseded 1984 ruling
