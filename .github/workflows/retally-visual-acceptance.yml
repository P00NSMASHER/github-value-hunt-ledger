name: RETALLY Visual Acceptance

on:
  push:
    branches:
      - audit/retally-visual-acceptance-20261008
    paths:
      - 'freight/site/**'
      - '.github/workflows/retally-visual-acceptance.yml'
  pull_request:
    paths:
      - 'freight/site/**'
      - '.github/workflows/retally-visual-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout proposed website
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: after
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Checkout original website baseline
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: before
          ref: ${{ github.event.pull_request.base.sha || 'main' }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install headless Chromium and Playwright
        run: |
          python -m pip install 'playwright==1.56.0'
          python -m playwright install --with-deps chromium
      - name: Build isolated public-only before bundle
        working-directory: before
        run: |
          PYTHONPATH=. python - <<'PY'
          from pathlib import Path
          from freight.site.build import build
          build(Path('../bundle-before'), 'sales@freightfixture.com', True)
          PY
      - name: Build isolated public-only after bundle
        working-directory: after
        run: |
          PYTHONPATH=. python - <<'PY'
          from pathlib import Path
          from freight.site.build import build
          build(Path('../bundle-after'), 'sales@freightfixture.com', True)
          PY
      - name: Capture 35 baseline screenshots at five widths
        run: python after/freight/site/visual_acceptance.py --site bundle-before --out evidence/before
      - name: Capture and validate 35 candidate screenshots at five widths
        run: python after/freight/site/visual_acceptance.py --site bundle-after --out evidence/after --fail-on-issues
      - name: Install pinned accessibility rules
        if: github.head_ref == 'audit/retally-visual-acceptance-20261008' || github.ref_name == 'audit/retally-visual-acceptance-20261008'
        run: npm install --no-save --ignore-scripts --prefix qa_node axe-core@4.10.3
      - name: Independently test hosted staging pages, mobile form and WCAG rules
        if: github.head_ref == 'audit/retally-visual-acceptance-20261008' || github.ref_name == 'audit/retally-visual-acceptance-20261008'
        run: |
          python after/freight/site/hosted_acceptance.py \
            --base-url https://789f9877.retally-web.pages.dev/ \
            --out evidence/hosted \
            --axe-js qa_node/node_modules/axe-core/axe.min.js
      - name: Upload before and after evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: retally-visual-acceptance-${{ github.run_id }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 14
