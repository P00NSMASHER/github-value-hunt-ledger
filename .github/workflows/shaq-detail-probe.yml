name: SHAQ Read-Only Detail Probe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - production/fmc_tariff_ledger/SHAQ_DETAIL_NOW

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: production/fmc_tariff_ledger
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: production/fmc_tariff_ledger/requirements-shaq.txt
      - run: python -m pip install -r requirements-shaq.txt
      - name: Fetch public OpenAPI and one detailed read-only lane
        env:
          SHAQ_DETAIL_OUTPUT: shaq_detail_probe.json
        run: python probe_shaq_detail.py
      - uses: actions/upload-artifact@v4
        with:
          name: shaq-readonly-detail
          path: production/fmc_tariff_ledger/shaq_detail_probe.json
          retention-days: 30
          if-no-files-found: error
