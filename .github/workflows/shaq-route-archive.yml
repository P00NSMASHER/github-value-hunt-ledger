name: SHAQ Public Route Rate Archive

on:
  workflow_dispatch:
    inputs:
      shard_count:
        description: Deterministic route-page shards
        required: true
        default: "8"
        type: string
      retention_days:
        description: Raw evidence retention
        required: true
        default: "90"
        type: string
  push:
    branches: [main]
    paths:
      - production/fmc_tariff_ledger/SHAQ_ROUTE_FULL_NOW

permissions:
  contents: read

concurrency:
  group: shaq-public-route-rate-archive
  cancel-in-progress: false

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.make.outputs.shards }}
    steps:
      - id: make
        env:
          SHARD_COUNT: ${{ inputs.shard_count || '8' }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          n = int(os.environ["SHARD_COUNT"])
          if not 1 <= n <= 32:
              raise SystemExit("shard_count must be 1..32")
          print("shards=" + json.dumps(list(range(n))))
          PY

  crawl:
    needs: matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: ${{ fromJSON(needs.matrix.outputs.shards) }}
    defaults:
      run:
        working-directory: production/fmc_tariff_ledger
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: production/fmc_tariff_ledger/requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: Archive deterministic public route shard
        env:
          SHARD: ${{ matrix.shard }}
          SHARD_COUNT: ${{ inputs.shard_count || '8' }}
        run: |
          mkdir -p "shaq-route-shards/shard-${SHARD}"
          python shaq_route_crawl.py \
            --out "shaq-route-shards/shard-${SHARD}" \
            --db shaq_routes.sqlite \
            --shard-count "${SHARD_COUNT}" \
            --shard-index "${SHARD}" \
            --workers 1 \
            --min-host-interval 0.75
      - name: Validate authority boundary and prepare metadata
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          python - <<'PY'
          import json, os, sqlite3
          from pathlib import Path

          shard = os.environ["SHARD"]
          root = Path(f"shaq-route-shards/shard-{shard}")
          db = sqlite3.connect(root / "shaq_routes.sqlite")
          qa = {
              "route_pages": db.execute("select count(*) from shaq_route_pages").fetchone()[0],
              "rates": db.execute("select count(*) from shaq_rates").fetchone()[0],
              "lanes": db.execute("select count(distinct origin_raw || '->' || destination_raw) from shaq_rates").fetchone()[0],
              "carriers": db.execute("select count(distinct carrier_raw) from shaq_rates").fetchone()[0],
              "validity_covered": db.execute("select count(*) from shaq_rates where valid_from is not null or valid_to is not null").fetchone()[0],
              "authority_ready": db.execute("select count(*) from shaq_rate_authority_view where authority_readiness='AUTHORITY_READY'").fetchone()[0],
              "benchmark_only": db.execute("select count(*) from shaq_rate_authority_view where authority_readiness='BENCHMARK_ONLY'").fetchone()[0],
          }
          db.close()
          if qa["route_pages"] == 0:
              raise SystemExit("shard captured zero route pages")
          if qa["authority_ready"] != 0:
              raise SystemExit("public route page unexpectedly became contract authority")
          (root / "qa.json").write_text(json.dumps(qa, indent=2) + "\n")
          print(json.dumps(qa, indent=2))
          PY
          mkdir -p "shaq-route-metadata/shard-${SHARD}"
          cp "shaq-route-shards/shard-${SHARD}/shaq_routes.sqlite" "shaq-route-metadata/shard-${SHARD}/shaq_routes.sqlite"
          cp "shaq-route-shards/shard-${SHARD}/summary.json" "shaq-route-metadata/shard-${SHARD}/summary.json"
          cp "shaq-route-shards/shard-${SHARD}/discovery.json" "shaq-route-metadata/shard-${SHARD}/discovery.json"
          cp "shaq-route-shards/shard-${SHARD}/qa.json" "shaq-route-metadata/shard-${SHARD}/qa.json"
      - name: Upload raw immutable route evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: shaq-route-evidence-shard-${{ matrix.shard }}
          path: production/fmc_tariff_ledger/shaq-route-shards/shard-${{ matrix.shard }}/
          retention-days: ${{ inputs.retention_days || 90 }}
          compression-level: 3
          if-no-files-found: error
      - name: Upload compact route metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: shaq-route-metadata-shard-${{ matrix.shard }}
          path: production/fmc_tariff_ledger/shaq-route-metadata/shard-${{ matrix.shard }}/
          retention-days: ${{ inputs.retention_days || 90 }}
          compression-level: 6
          if-no-files-found: error

  merge:
    needs: crawl
    if: always() && needs.crawl.result == 'success'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: production/fmc_tariff_ledger
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: production/fmc_tariff_ledger/requirements.txt
      - run: python -m pip install -r requirements.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: shaq-route-metadata-shard-*
          path: production/fmc_tariff_ledger/shaq-route-metadata
      - name: Merge compact route ledgers
        run: |
          mkdir -p shaq-route-merged
          python shaq_merge.py \
            --input-root shaq-route-metadata \
            --db shaq-route-merged/shaq_routes.sqlite \
            --summary shaq-route-merged/summary.json
          python -m json.tool shaq-route-merged/summary.json
          python - <<'PY'
          import json
          from pathlib import Path

          summary = json.loads(Path("shaq-route-merged/summary.json").read_text())
          if summary["authority_ready"] != 0:
              raise SystemExit("merged public route corpus contains unauthorized authority-ready rows")
          if summary["merged_route_pages"] < 1000:
              raise SystemExit("unexpectedly low public route coverage")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: shaq-public-route-rate-ledger-merged
          path: production/fmc_tariff_ledger/shaq-route-merged/
          retention-days: ${{ inputs.retention_days || 90 }}
          compression-level: 6
          if-no-files-found: error
