name: SHAQ Public Sitemap Probe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - production/fmc_tariff_ledger/SHAQ_SITEMAP_NOW

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: production/fmc_tariff_ledger
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Discover public route indexes
        run: python probe_shaq_sitemap.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: shaq-public-sitemap-probe
          path: production/fmc_tariff_ledger/shaq_sitemap_probe.json
          retention-days: 30
          if-no-files-found: error
