name: Technology Intelligence System

on:
  push:
    paths:
      - "hunters/**"
      - "intelligence/**"
      - "tools/ti_*.py"
      - "CAPABILITIES.md"
      - "SEARCH_SKILLS.md"
      - "SEARCH_QUEUE.md"
      - "OUTCOMES.md"
      - "KNOWLEDGE_GRAPH.md"
      - "EXPERIMENTS.md"
      - "benchmark/BENCHMARK_TASKS.md"
      - "benchmark/STRATEGY_MEASUREMENT_PROTOCOL.md"
      - "freight/GAP_REGISTER.json"
      - ".github/workflows/technology-intelligence.yml"
  pull_request:
    paths:
      - "hunters/**"
      - "intelligence/**"
      - "tools/ti_*.py"
      - "CAPABILITIES.md"
      - "SEARCH_SKILLS.md"
      - "SEARCH_QUEUE.md"
      - "OUTCOMES.md"
      - "KNOWLEDGE_GRAPH.md"
      - "EXPERIMENTS.md"
      - "benchmark/BENCHMARK_TASKS.md"
      - "benchmark/STRATEGY_MEASUREMENT_PROTOCOL.md"
      - "freight/GAP_REGISTER.json"
      - ".github/workflows/technology-intelligence.yml"

permissions:
  contents: read

concurrency:
  group: technology-intelligence-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Sync source-of-truth registries
        run: python tools/ti_sync.py
      - name: Recompute repository registry metrics
        run: python tools/ti_registry.py
      - name: Measure revision and catalog provenance debt
        run: python tools/ti_revision_debt.py
      - name: Canonicalize query families and objectives
        run: python tools/ti_query_families.py
      - name: Derive attribution graph
        run: python tools/ti_graph.py
      - name: Measure instrumentation quality
        run: python tools/ti_quality.py
      - name: Learn from candidate dispositions
        run: python tools/ti_candidate_learning.py
      - name: Compute fractional outcome attribution
        run: python tools/ti_attribution.py
      - name: Aggregate reusable search objectives
        run: python tools/ti_objectives.py
      - name: Rebuild learning report
        run: python tools/ti_report.py
      - name: Recompute cautious adaptive search policy
        run: python tools/ti_policy.py
      - name: Measure V7 search saturation and redirect pressure
        run: python tools/ti_saturation.py
      - name: Validate V7 saturation neighborhoods
        run: python tools/ti_saturation_validate.py
      - name: Build V8 repository profile registry
        run: python tools/ti_profiles.py
      - name: Measure V8 blind-spot exploration coverage
        run: python tools/ti_coverage.py
      - name: Validate V8 exploration coverage
        run: python tools/ti_coverage_validate.py
      - name: Compile ranked next-hunt search seeds
        run: python tools/ti_seed_compiler.py
      - name: Validate V5 search seeds and seed attribution
        run: python tools/ti_seed_validate.py
      - name: Compile V6 adjacency expansion queue
        run: python tools/ti_adjacency.py
      - name: Validate V6 adjacency attribution
        run: python tools/ti_adjacency_validate.py
      - name: Build measurement-debt plan
        run: python tools/ti_measurement_plan.py
      - name: Build matched strategy measurement campaign
        run: python tools/ti_measurement_campaign.py
      - name: Analyze normalized search-surface yield
        run: python tools/ti_surface.py
      - name: Build V10 allocator learning policy
        run: python tools/ti_allocator_learning.py
      - name: Validate V10 allocator learning policy
        run: python tools/ti_allocator_learning_validate.py
      - name: Build V9/V10 unified hunt allocator
        run: python tools/ti_allocator.py
      - name: Validate V9 unified hunt allocation
        run: python tools/ti_allocator_validate.py
      - name: Build V11 hunt execution state
        run: python tools/ti_execution.py
      - name: Validate V11 hunt execution control plane
        run: python tools/ti_execution_validate.py
      - name: Build V12 worker profiles
        run: python tools/ti_worker_profiles.py
      - name: Build V13 routing outcome learner
        run: python tools/ti_routing_learning.py
      - name: Validate V13 routing outcome learner
        run: python tools/ti_routing_learning_validate.py
      - name: Build V12/V13 worker routing plan
        run: python tools/ti_worker_routing.py
      - name: Validate V12 worker routing
        run: python tools/ti_worker_routing_validate.py
      - name: Validate V18 controlled routing exploration
        run: python tools/ti_routing_exploration_validate.py
      - name: Build V14 dispatch tickets
        run: python tools/ti_dispatch.py
      - name: Validate V14/V15 dispatch binding
        run: python tools/ti_dispatch_validate.py
      - name: Build V15 dispatch backpressure
        run: python tools/ti_dispatch_backpressure.py
      - name: Validate V15 dispatch backpressure
        run: python tools/ti_dispatch_backpressure_validate.py
      - name: Build V16 worker presence
        run: python tools/ti_worker_presence.py
      - name: Validate V16 worker presence
        run: python tools/ti_worker_presence_validate.py
      - name: Build V16 activation broker
        run: python tools/ti_activation.py
      - name: Validate V16 activation broker
        run: python tools/ti_activation_validate.py
      - name: Build V17 activation response learning
        run: python tools/ti_activation_response_learning.py
      - name: Validate V17 activation response learning
        run: python tools/ti_activation_response_validate.py
      - name: Validate technology-intelligence system
        run: python tools/ti_validate.py
      - name: Check generated text for whitespace errors
        run: git diff --check

  persist-generated:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor != 'github-actions[bot]'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
