name: Technology Intelligence System

on:
  push:
    paths:
      - "hunters/**"
      - "intelligence/**"
      - "tools/ti_*.py"
      - "tests/test_ti_*.py"
      - "CAPABILITIES.md"
      - "MASTER.md"
      - "SEARCH_SKILLS.md"
      - "SEARCH_QUEUE.md"
      - "OUTCOMES.md"
      - "KNOWLEDGE_GRAPH.md"
      - "EXPERIMENTS.md"
      - "benchmark/BENCHMARK_TASKS.md"
      - "benchmark/STRATEGY_MEASUREMENT_PROTOCOL.md"
      - "freight/GAP_REGISTER.json"
      - ".github/workflows/technology-intelligence.yml"
  pull_request:
    paths:
      - "hunters/**"
      - "intelligence/**"
      - "tools/ti_*.py"
      - "tests/test_ti_*.py"
      - "CAPABILITIES.md"
      - "MASTER.md"
      - "SEARCH_SKILLS.md"
      - "SEARCH_QUEUE.md"
      - "OUTCOMES.md"
      - "KNOWLEDGE_GRAPH.md"
      - "EXPERIMENTS.md"
      - "benchmark/BENCHMARK_TASKS.md"
      - "benchmark/STRATEGY_MEASUREMENT_PROTOCOL.md"
      - "freight/GAP_REGISTER.json"
      - ".github/workflows/technology-intelligence.yml"

permissions:
  contents: read

concurrency:
  group: technology-intelligence-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Test action routing, telemetry intake and run preparation
        run: python -m unittest discover -s tests -p 'test_ti_*.py'
      - name: Ingest, rebuild and validate technology intelligence
        run: python tools/ti_build.py
      - name: Check generated text for whitespace errors
        run: git diff --check

  persist-generated:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor != 'github-actions[bot]'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Refresh main before generation
        shell: bash
        run: git pull --ff-only origin main
      - name: Test action routing, telemetry intake and run preparation
        run: python -m unittest discover -s tests -p 'test_ti_*.py'
      - name: Ingest, rebuild and validate technology intelligence
        run: python tools/ti_build.py
      - name: Check generated text for whitespace errors
        run: git diff --check

      - name: Persist generated intelligence on main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add intelligence/search_runs.jsonl \
                  intelligence/capabilities.jsonl \
                  intelligence/search_strategies.jsonl \
                  intelligence/query_families.jsonl \
                  intelligence/derived_edges.jsonl \
                  intelligence/LEARNING_REPORT.md \
                  intelligence/REGISTRY_REPORT.md \
                  intelligence/REVISION_DEBT_REPORT.md \
                  intelligence/DATA_QUALITY_REPORT.md \
                  intelligence/GRAPH_HEALTH.md \
                  intelligence/SEARCH_POLICY.md \
                  intelligence/QUERY_FAMILY_REPORT.md \
                  intelligence/OBJECTIVE_REPORT.md \
                  intelligence/ATTRIBUTION_REPORT.md \
                  intelligence/MEASUREMENT_PLAN.md \
                  intelligence/MEASUREMENT_CAMPAIGN.md \
                  intelligence/NEGATIVE_TRAINING_REPORT.md \
                  intelligence/SURFACE_REPORT.md \
                  intelligence/search_policy.json \
                  intelligence/registry_metrics.json \
                  intelligence/revision_debt_metrics.json \
                  intelligence/quality_metrics.json \
                  intelligence/objective_metrics.json \
                  intelligence/attribution_metrics.json \
                  intelligence/measurement_plan.json \
                  intelligence/measurement_campaign.json \
                  intelligence/candidate_learning_metrics.json \
                  intelligence/surface_metrics.json \
                  intelligence/search_seeds.jsonl \
                  intelligence/SEARCH_SEEDS.md \
                  intelligence/SEED_PERFORMANCE.md \
                  intelligence/seed_metrics.json \
                  intelligence/adjacency_queue.jsonl \
                  intelligence/ADJACENCY_QUEUE.md \
                  intelligence/ADJACENCY_PERFORMANCE.md \
                  intelligence/adjacency_metrics.json \
                  intelligence/research_neighborhoods.jsonl \
                  intelligence/redirect_queue.jsonl \
                  intelligence/SATURATION_REPORT.md \
                  intelligence/REDIRECT_QUEUE.md \
                  intelligence/saturation_metrics.json \
                  intelligence/repository_profiles.jsonl \
                  intelligence/coverage_targets.jsonl \
                  intelligence/exploration_gap_queue.jsonl \
