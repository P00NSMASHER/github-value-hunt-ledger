                  intelligence/dispatch_backpressure_metrics.json \
                  intelligence/DISPATCH_BACKPRESSURE.md \
                  intelligence/WORK_STEAL_QUEUE.md \
                  intelligence/worker_presence_state.jsonl \
                  intelligence/worker_presence_history.jsonl \
                  intelligence/worker_presence_metrics.json \
                  intelligence/WORKER_PRESENCE.md \
                  intelligence/activation_directives.jsonl \
                  intelligence/activation_claim_packets.jsonl \
                  intelligence/activation_history.jsonl \
                  intelligence/activation_metrics.json \
                  intelligence/ACTIVATION_BOARD.md \
