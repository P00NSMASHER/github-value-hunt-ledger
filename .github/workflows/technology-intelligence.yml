      - name: Refresh main before generation
        shell: bash
        run: git pull --ff-only origin main
      - name: Sync source-of-truth registries
        run: python tools/ti_sync.py
      - name: Recompute repository registry metrics
        run: python tools/ti_registry.py
      - name: Measure revision and catalog provenance debt
