name: Technology Intelligence System

on:
  push:
    paths:
      - "hunters/**"
      - "intelligence/**"
      - "production/**"
      - "tools/ti_*.py"
      - "tests/test_ti_*.py"
      - "CAPABILITIES.md"
      - "MASTER.md"
      - "SEARCH_SKILLS.md"
      - "SEARCH_QUEUE.md"
      - "OUTCOMES.md"
      - "KNOWLEDGE_GRAPH.md"
      - "EXPERIMENTS.md"
      - "benchmark/BENCHMARK_TASKS.md"
      - "benchmark/STRATEGY_MEASUREMENT_PROTOCOL.md"
      - "freight/GAP_REGISTER.json"
      - ".github/workflows/technology-intelligence.yml"
  pull_request:
    paths:
      - "hunters/**"
      - "intelligence/**"
      - "production/**"
      - "tools/ti_*.py"
      - "tests/test_ti_*.py"
      - "CAPABILITIES.md"
      - "MASTER.md"
      - "SEARCH_SKILLS.md"
      - "SEARCH_QUEUE.md"
      - "OUTCOMES.md"
      - "KNOWLEDGE_GRAPH.md"
      - "EXPERIMENTS.md"
      - "benchmark/BENCHMARK_TASKS.md"
      - "benchmark/STRATEGY_MEASUREMENT_PROTOCOL.md"
      - "freight/GAP_REGISTER.json"
      - ".github/workflows/technology-intelligence.yml"

permissions:
  contents: read

concurrency:
  group: technology-intelligence-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Test action routing, telemetry intake and run preparation
        run: python -m unittest discover -s tests -p 'test_ti_*.py'
      - name: Ingest, rebuild and validate technology intelligence
        env:
          TI_TRAINING_SPLIT_KEY: ${{ secrets.TI_TRAINING_SPLIT_KEY }}
        run: python tools/ti_build.py
      - name: Check generated text for whitespace errors
        run: git diff --check

  persist-generated:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor != 'github-actions[bot]'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Refresh main before generation
        shell: bash
        run: git pull --ff-only origin main
      - name: Test action routing, telemetry intake and run preparation
        run: python -m unittest discover -s tests -p 'test_ti_*.py'
      - name: Ingest, rebuild and validate technology intelligence
        env:
          TI_TRAINING_SPLIT_KEY: ${{ secrets.TI_TRAINING_SPLIT_KEY }}
        run: python tools/ti_build.py
      - name: Check generated text for whitespace errors
        run: git diff --check

      - name: Persist generated intelligence on main
        env:
          TI_TRAINING_SPLIT_KEY: ${{ secrets.TI_TRAINING_SPLIT_KEY }}
        run: >-
          python tools/ti_persist_generated.py
          --max-attempts 5
          --clean-untracked-on-rebuild
