name: TiC Payer MRF Ledger

on:
  workflow_dispatch:
    inputs:
      parse_indexes:
        description: Parse discovered live CMS index files
        required: true
        default: true
        type: boolean
      max_indexes:
        description: Maximum number of live index files to parse in this run
        required: true
        default: "25"
        type: string
      retention_days:
        description: Artifact retention
        required: true
        default: "90"
        type: string
  push:
    branches: [main]
    paths:
      - production/tic_mrf_ledger/RUN_NOW

permissions:
  contents: read

concurrency:
  group: tic-payer-mrf-ledger
  cancel-in-progress: false

jobs:
  authorize:
    name: Authenticate exact current main and bound external resource inputs
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out immutable triggering main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Admit immutable main and strictly bounded resource use
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_MAX_INDEXES: ${{ inputs.max_indexes || '25' }}
          INPUT_RETENTION_DAYS: ${{ inputs.retention_days || '90' }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          CURRENT="$(git ls-remote --exit-code "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/main | cut -f1)"
          test -n "$CURRENT" && test "$CURRENT" = "$EXPECTED_SHA" || { echo "::error::Missing or stale main source"; exit 1; }
          if [ "$EVENT_NAME" = "push" ]; then
            LIMIT="$(awk -F= '$1=="max_indexes"{print $2}' production/tic_mrf_ledger/RUN_NOW | tail -1)"
            LIMIT="${LIMIT:-25}"
          else
            LIMIT="$INPUT_MAX_INDEXES"
          fi
          [[ "$LIMIT" =~ ^[0-9]{1,3}$ ]] || { echo "::error::Malformed max_indexes"; exit 1; }
          COUNT=$((10#$LIMIT))
          (( COUNT>=1 && COUNT<=25 )) || { echo "::error::max_indexes exceeds bounded 1..25"; exit 1; }
          [[ "$INPUT_RETENTION_DAYS" =~ ^[0-9]{1,2}$ ]] || { echo "::error::Malformed retention_days"; exit 1; }
          RETAIN=$((10#$INPUT_RETENTION_DAYS))
          (( RETAIN>=1 && RETAIN<=90 )) || { echo "::error::Artifact retention must be 1..90"; exit 1; }
          echo "Authorized main resource limits: index/history=$COUNT, retention=$RETAIN"

  test:
    needs: authorize
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: production/tic_mrf_ledger
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: production/tic_mrf_ledger/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -v -p 'test_*.py'

  catalog:
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: production/tic_mrf_ledger
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: production/tic_mrf_ledger/requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: Catalog historical and live payer MRF universe
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PARSE_INDEXES: ${{ inputs.parse_indexes }}
          INPUT_MAX_INDEXES: ${{ inputs.max_indexes }}
        run: |
          PARSE=""
          if [ "$EVENT_NAME" = "push" ] || [ "$INPUT_PARSE_INDEXES" = "true" ]; then
            PARSE="--parse-indexes"
          fi
          if [ "$EVENT_NAME" = "push" ]; then
            MAX_INDEXES="$(awk -F= '$1=="max_indexes"{print $2}' RUN_NOW | tail -1)"
            MAX_INDEXES="${MAX_INDEXES:-25}"
          else
            MAX_INDEXES="${INPUT_MAX_INDEXES:-25}"
          fi
          echo "TiC catalog max_indexes=$MAX_INDEXES"
          python catalog.py \
            --out output \
            --db tic_mrf.sqlite \
            $PARSE \
            --max-indexes "$MAX_INDEXES" \
            --max-manifest-bytes 100000000 \
            --max-index-bytes 2000000000 \
            --snapshot-max-bytes 100000000
          python -m json.tool output/catalog_summary.json
          python coverage_debt.py --db output/tic_mrf.sqlite --output output/coverage_debt.json > /dev/null
          echo "=== TiC coverage debt ==="
          python -m json.tool output/coverage_debt.json
          echo "=== TiC ingestion errors ==="
          python - <<'PY'
          import json, sqlite3
          db = sqlite3.connect("output/tic_mrf.sqlite")
          db.row_factory = sqlite3.Row
          rows = db.execute(
              """SELECT source_key,url,stage,error_type,detail
                 FROM ingestion_errors ORDER BY id"""
          ).fetchall()
          print(json.dumps([dict(row) for row in rows], indent=2))
          db.close()
          PY
      - name: Upload TiC universe ledger
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tic-payer-mrf-ledger
          path: production/tic_mrf_ledger/output/
          retention-days: ${{ inputs.retention_days || 90 }}
          compression-level: 6
          if-no-files-found: error
