name: TiC Payer MRF Ledger

on:
  workflow_dispatch:
    inputs:
      parse_indexes:
        description: Parse discovered live CMS index files
        required: true
        default: true
        type: boolean
      max_indexes:
        description: Maximum number of live index files to parse in this run
        required: true
        default: "25"
        type: string
      retention_days:
        description: Artifact retention
        required: true
        default: "90"
        type: string
  push:
    branches: [main]
    paths:
      - production/tic_mrf_ledger/RUN_NOW

permissions:
  contents: read

concurrency:
  group: tic-payer-mrf-ledger
  cancel-in-progress: false

jobs:
  admission:
    name: Require exact current main before any crawl
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify main branch and immutable expected source
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/main'
          [[ "$EXPECTED_SHA" =~ ^[a-f0-9]{40}$ ]]
          REMOTE="$(git ls-remote --exit-code "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/main | cut -f1)"
          test "$REMOTE" = "$EXPECTED_SHA" || { echo 'Refusing stale or branch-selected ledger source.' >&2; exit 1; }
  test:
    needs: admission
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: production/tic_mrf_ledger
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: production/tic_mrf_ledger/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -v -p 'test_*.py'
      - name: Verify bounded input regression tests
        run: python ../../tests/test_ti_ledger_workload.py

  catalog:
    needs: [admission, test]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: production/tic_mrf_ledger
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: production/tic_mrf_ledger/requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: Check fresh current main and bound source workloads
        id: parameters
        shell: bash
        env:
          LEDGER_EVENT: ${{ github.event_name }}
          INPUT_MAX_INDEXES: ${{ inputs.max_indexes || '25' }}
          INPUT_RETENTION_DAYS: ${{ inputs.retention_days || '90' }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          REMOTE="$(git ls-remote --exit-code "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/main | cut -f1)"
          test "$REMOTE" = "$GITHUB_SHA" || { echo 'Main advanced; refusing outdated catalog.' >&2; exit 1; }
          python ../../tools/ledger_workload_parameters.py --lane tic --event "$LEDGER_EVENT" --value "$INPUT_MAX_INDEXES" --retention "$INPUT_RETENTION_DAYS" --run-now RUN_NOW >> "$GITHUB_OUTPUT"
      - name: Catalog historical and live payer MRF universe
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PARSE_INDEXES: ${{ inputs.parse_indexes }}
          MAX_INDEXES: ${{ steps.parameters.outputs.max_indexes }}
        run: |
          PARSE=""
          if [ "$EVENT_NAME" = "push" ] || [ "$INPUT_PARSE_INDEXES" = "true" ]; then
            PARSE="--parse-indexes"
          fi
          # Parameter bound by the separately verified immutable-main preflight.
          echo "TiC catalog max_indexes=$MAX_INDEXES"
          python catalog.py \
            --out output \
            --db tic_mrf.sqlite \
            $PARSE \
            --max-indexes "$MAX_INDEXES" \
            --max-manifest-bytes 100000000 \
            --max-index-bytes 2000000000 \
            --snapshot-max-bytes 100000000
          python -m json.tool output/catalog_summary.json
          python coverage_debt.py --db output/tic_mrf.sqlite --output output/coverage_debt.json > /dev/null
          echo "=== TiC coverage debt ==="
          python -m json.tool output/coverage_debt.json
          echo "=== TiC ingestion errors ==="
          python - <<'PY'
          import json, sqlite3
          db = sqlite3.connect("output/tic_mrf.sqlite")
          db.row_factory = sqlite3.Row
          rows = db.execute(
              """SELECT source_key,url,stage,error_type,detail
                 FROM ingestion_errors ORDER BY id"""
          ).fetchall()
          print(json.dumps([dict(row) for row in rows], indent=2))
          db.close()
          PY
      - name: Upload TiC universe ledger
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tic-payer-mrf-ledger
          path: production/tic_mrf_ledger/output/
          retention-days: ${{ steps.parameters.outputs.retention_days }}
          compression-level: 6
          if-no-files-found: error
