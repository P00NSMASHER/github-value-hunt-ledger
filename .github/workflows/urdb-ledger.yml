name: OpenEI URDB Ledger

on:
  workflow_dispatch:
    inputs:
      history_limit:
        description: Maximum monthly GitHub releases to preserve
        required: true
        default: "100"
        type: string
      retention_days:
        description: Artifact retention
        required: true
        default: "90"
        type: string
  push:
    branches: [main]
    paths:
      - production/urdb_ledger/RUN_NOW

permissions:
  contents: read

concurrency:
  group: openei-urdb-ledger
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: production/urdb_ledger
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: production/urdb_ledger/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -v -p 'test_*.py'

  ingest:
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: production/urdb_ledger
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: production/urdb_ledger/requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: Ingest official bulk and release history
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HISTORY_LIMIT: ${{ inputs.history_limit || '100' }}
        run: |
          python ingest.py \
            --out output \
            --db urdb.sqlite \
            --history-limit "$HISTORY_LIMIT"
          python -m json.tool output/summary.json
      - name: Upload URDB evidence ledger
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: openei-urdb-ledger
          path: production/urdb_ledger/output/
          retention-days: ${{ inputs.retention_days || 90 }}
          compression-level: 0
          if-no-files-found: error
