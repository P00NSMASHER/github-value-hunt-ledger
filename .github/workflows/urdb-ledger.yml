name: OpenEI URDB Ledger

on:
  workflow_dispatch:
    inputs:
      history_limit:
        description: Maximum monthly GitHub releases to preserve
        required: true
        default: "100"
        type: string
      retention_days:
        description: Artifact retention
        required: true
        default: "90"
        type: string
  push:
    branches: [main]
    paths:
      - production/urdb_ledger/RUN_NOW

permissions:
  contents: read

concurrency:
  group: openei-urdb-ledger
  cancel-in-progress: false

jobs:
  admission:
    name: Require exact current main before any crawl
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify main branch and immutable expected source
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/main'
          [[ "$EXPECTED_SHA" =~ ^[a-f0-9]{40}$ ]]
          REMOTE="$(git ls-remote --exit-code "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/main | cut -f1)"
          test "$REMOTE" = "$EXPECTED_SHA" || { echo 'Refusing stale or branch-selected ledger source.' >&2; exit 1; }
  test:
    needs: admission
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: production/urdb_ledger
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: production/urdb_ledger/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -v -p 'test_*.py'
      - name: Verify bounded input regression tests
        run: python ../../tests/test_ti_ledger_workload.py

  ingest:
    needs: [admission, test]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: production/urdb_ledger
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: production/urdb_ledger/requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: Check fresh current main and bound source workloads
        id: parameters
        shell: bash
        env:
          LEDGER_EVENT: ${{ github.event_name }}
          INPUT_HISTORY_LIMIT: ${{ inputs.history_limit || '100' }}
          INPUT_RETENTION_DAYS: ${{ inputs.retention_days || '90' }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          REMOTE="$(git ls-remote --exit-code "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/main | cut -f1)"
          test "$REMOTE" = "$GITHUB_SHA" || { echo 'Main advanced; refusing outdated catalog.' >&2; exit 1; }
          python ../../tools/ledger_workload_parameters.py --lane urdb --event "$LEDGER_EVENT" --value "$INPUT_HISTORY_LIMIT" --retention "$INPUT_RETENTION_DAYS" --run-now RUN_NOW >> "$GITHUB_OUTPUT"
      - name: Ingest official bulk and release history
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HISTORY_LIMIT: ${{ steps.parameters.outputs.history_limit }}
        run: |
          python ingest.py \
            --out output \
            --db urdb.sqlite \
            --history-limit "$HISTORY_LIMIT"
          python -m json.tool output/summary.json
      - name: Upload URDB evidence ledger
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: openei-urdb-ledger
          path: production/urdb_ledger/output/
          retention-days: ${{ steps.parameters.outputs.retention_days }}
          compression-level: 0
          if-no-files-found: error
