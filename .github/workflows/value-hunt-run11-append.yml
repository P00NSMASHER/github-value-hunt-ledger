name: value-hunt-run11-append
on:
  push:
permissions:
  contents: write
jobs:
  append:
    if: "${{ github.event.head_commit.message == 'Run value-hunt catalog append' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Append validated findings
        run: bash .github/value-hunt-run11-append.sh
