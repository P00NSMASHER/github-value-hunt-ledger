name: value-hunt-run11-append2
on:
  push:
permissions:
  contents: write
jobs:
  append:
    if: "${{ github.event.head_commit.message == 'Run value-hunt catalog append 2' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Append quarantine and reject entries
        shell: bash
        run: |
          git pull --ff-only
          if ! grep -q '^### Lonewolf-0/Smart-Farm-Field-Intelligence-Platform$' hunters/24.md; then
            cat >> hunters/24.md <<'EOF'

          ### Lonewolf-0/Smart-Farm-Field-Intelligence-Platform
          - URL: https://github.com/Lonewolf-0/Smart-Farm-Field-Intelligence-Platform
          - Exact commit / revision: `4eaa550c92d046e65827578ce8a3675a82a9f021`
          - Date inspected: 2026-09-19
          - Status: rejected / safety quarantine
          - What it contains: Public-facing smart-farm platform claiming field polygons, weather, soil history, crop suitability, irrigation/ET, Sentinel-derived NDVI, fertilizer/pest alerts and PostGIS-backed farm operations.
          - Why rejected / quarantined: Inspection was intentionally stopped because the public README exposed credential-like configuration material. No credential/authentication values were retained, reproduced or tested, and no attempt was made to use them. Safety takes priority over technical/commercial evaluation.
          - License / rights: Not assessed after quarantine; public visibility does not establish reuse rights.
          - Reuse classification: Excluded from hunt unless a future sanitized revision removes exposed authentication material and clear licensing is established.
          - Combination opportunities: None retained.
          - Next action: Do not revisit the affected revision.

          ### niketarora/KrishiNetra
          - URL: https://github.com/niketarora/KrishiNetra
          - Exact commit / revision: `21eb6c0a5895a991eb1fbe0e3bb37c2e945abf85`
          - Date inspected: 2026-09-19
          - Status: rejected / deprioritized
          - What it contains: India-focused FastAPI/React agriculture platform with Sentinel-1/2 feature extraction, crop classification, weather, soil-moisture estimation, irrigation/advisory endpoints, multilingual voice tooling and marketplace/dashboard layers.
          - Why rejected: The broad README surface is not matched by sufficiently deep agronomic decision logic to beat the existing OpenFarm/FTW/Agribound/Ricemapper/pyCropWat/AquaCrop stack. The inspected irrigation implementation reduces the decision to fixed soil-moisture bands rather than a calibrated ET/soil-water/crop-stage model. No root LICENSE was present at the inspected revision.
          - Likely buyer / user: Farm-management or agricultural advisory users, but no differentiated commercial wedge survives comparison with stronger retained assets.
          - Build-time or data advantage: Limited; perhaps weeks of integration/UI reference, not the 2+ months of rare domain/data compression targeted by this hunt.
          - Concrete evidence inspected: Exact latest commit; README/project architecture; `agriculture/advisory/irrigation.py`; code search for Sentinel/moisture/irrigation flow; failed root LICENSE lookup.
          - License / rights: No root LICENSE established; PASTIS-R/Sentinel/Sarvam/other upstream data and services have separate terms.
          - Reuse classification: Inspect/learn/clean-room only absent a valid license; do not reuse upstream datasets without their own rights review.
          - Value score: A 2/5, B 3/5, C 2/5, D 2/5, E 3/5, F 1/5 = **13/30**.
          - Combination opportunities: None that improves the current agriculture stack; the only useful lesson is to avoid replacing validated water-balance logic with simple moisture thresholds.
          - Next action: Do not revisit unless it adds a clear license plus field-validated ET/crop-stage/soil-water decision logic or a uniquely valuable lawful dataset.
          EOF
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hunters/24.md
          if ! git diff --cached --quiet; then
            git commit -m 'catalog: quarantine unsafe farm repo and reject weak advisory stack'
            git push
          fi
