name: value-hunt-run11-append2
on:
  push:
permissions:
  contents: write
jobs:
  append:
    if: "${{ github.event.head_commit.message == 'Run value-hunt catalog append 2' }}"
    runs-on: ubuntu-latest
    env:
      PAYLOAD_B64: " "
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Append quarantine and reject entries
        shell: bash
        run: |
          git pull --ff-only
          if ! grep -q '^### Lonewolf-0/Smart-Farm-Field-Intelligence-Platform$' hunters/24.md; then
            printf '\n' >> hunters/24.md
            printf '%s' "$PAYLOAD_B64" | base64 -d >> hunters/24.md
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hunters/24.md
          if ! git diff --cached --quiet; then
            git commit -m 'catalog: quarantine unsafe farm repo and reject weak advisory stack'
            git push
          fi
