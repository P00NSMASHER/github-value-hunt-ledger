name: x402 agents-net submission
on:
  push:
    branches:
      - ops/x402-free-distribution-20261002

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Submit PA Entity Lookup x402 to Agents.NET
        shell: python
        run: |
          import json, urllib.request, urllib.error
          payload = {
            "name": "PA Entity Lookup x402",
            "description": "Agent-ready Pennsylvania business-registry lookup API over x402. Resolve one best legal-entity match for $0.001 USDC or search registration records for $0.005, with filing number, registration type, registered address, county, and source-published principal/officer data.",
            "category": "Engineering",
            "contactEmail": "jayp19386@gmail.com",
            "apiEndpoint": "https://pa-entity-x402.floot.app/_api/pa-entity-one?q=OpenAI",
            "platform": "Custom API"
          }
          req=urllib.request.Request(
            "https://agents.net/api/agents/submit",
            data=json.dumps(payload).encode("utf-8"),
            headers={"Content-Type":"application/json","User-Agent":"AgentDataTools-x402-distribution/1.3"},
            method="POST"
          )
          try:
            with urllib.request.urlopen(req,timeout=60) as resp:
              print("RECEIPT AGENTS_NET HTTP",resp.status,resp.read().decode("utf-8","replace")[:6000])
          except urllib.error.HTTPError as exc:
            print("RECEIPT AGENTS_NET HTTP",exc.code,exc.read().decode("utf-8","replace")[:6000])
          except Exception as exc:
            print("RECEIPT AGENTS_NET ERROR",type(exc).__name__,str(exc))
