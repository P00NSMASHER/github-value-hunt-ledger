name: x402 free distribution
on:
  push:
    branches:
      - ops/x402-free-distribution-20261002
  workflow_dispatch:

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Submit live x402 routes to free directories
        shell: python
        run: |
          import json, urllib.request, urllib.error

          routes = [
            {
              "url": "https://pa-entity-x402.floot.app/_api/pa-entity-one?q=OpenAI",
              "name": "PA Entity Best Match",
              "description": "Resolve one best Pennsylvania business-registry match by company name.",
              "price_usd": 0.001,
              "category": "business-data",
            },
            {
              "url": "https://pa-entity-x402.floot.app/_api/pa-business?q=OpenAI&limit=1",
              "name": "PA Business Registry Search",
              "description": "Search Pennsylvania business-registration records by company name.",
              "price_usd": 0.005,
              "category": "business-data",
            },
            {
              "url": "https://api-v2.appdeploy.ai/app/pa-entity-lookup-x402-4fbm4s/api/vendor-intake-gate?name=OpenAI%20OpCo&address=600%20North%20Second%20Street%2C%20Suite%20401%2C%20Harrisburg%2C%20PA%2017101&domain=openai.com",
              "name": "PA Vendor Intake Gate",
              "description": "Agent-loop vendor intake decision with PA registry, Census, OFAC candidate screening, and RDAP evidence.",
              "price_usd": 0.020,
              "category": "compliance",
            },
            {
              "url": "https://api-v2.appdeploy.ai/app/sec-recent-filings-x402-f9qatj/api/sec-filings?ticker=AAPL&form=10-K&limit=1",
              "name": "SEC Recent Filings",
              "description": "Recent SEC EDGAR filing metadata by ticker or CIK.",
              "price_usd": 0.005,
              "category": "finance",
            },
            {
              "url": "https://api-v2.appdeploy.ai/app/us-census-address-geocoder-x402-23mj4x/api/us-address-geocode?address=4600%20Silver%20Hill%20Rd%2C%20Washington%2C%20DC%2020233",
              "name": "US Census Address Geocoder",
              "description": "Geocode a U.S. address to Census coordinates and geography identifiers.",
              "price_usd": 0.005,
              "category": "geospatial",
            },
            {
              "url": "https://api-v2.appdeploy.ai/app/ofac-sdn-name-screen-x402-m9ko96/api/ofac-sdn-screen?name=VLADIMIR%20PUTIN&limit=1&minScore=85",
              "name": "OFAC SDN Name Screen",
              "description": "Screen a name against current OFAC SDN primary names and aliases for review candidates.",
              "price_usd": 0.005,
              "category": "compliance",
            },
            {
              "url": "https://api-v2.appdeploy.ai/app/domain-rdap-lookup-x402-spdfnq/api/domain-rdap?domain=example.com",
              "name": "Domain RDAP Lookup",
              "description": "Live authoritative domain-registration metadata through RDAP.",
              "price_usd": 0.005,
              "category": "domain-data",
            },
            {
              "url": "https://api-v2.appdeploy.ai/app/treasury-average-interest-rates-x402-xeqftl/api/treasury-average-rates?security=Total%20Marketable",
              "name": "Treasury Average Interest Rates",
              "description": "Latest monthly average interest rates on outstanding U.S. Treasury securities.",
              "price_usd": 0.005,
              "category": "finance",
            },
          ]

          def post(label, url, payload):
            data = json.dumps(payload).encode("utf-8")
            req = urllib.request.Request(
              url,
              data=data,
              headers={
                "Content-Type": "application/json",
                "User-Agent": "AgentDataTools-x402-distribution/1.0",
              },
              method="POST",
            )
            try:
              with urllib.request.urlopen(req, timeout=60) as resp:
                body = resp.read().decode("utf-8", "replace")
                print(f"RECEIPT {label} HTTP {resp.status} {body[:4000]}")
            except urllib.error.HTTPError as exc:
              body = exc.read().decode("utf-8", "replace")
              print(f"RECEIPT {label} HTTP {exc.code} {body[:4000]}")
            except Exception as exc:
              print(f"RECEIPT {label} ERROR {type(exc).__name__}: {exc}")

          for route in routes:
            payload = {
              "url": route["url"],
              "name": route["name"],
              "protocol": "x402",
              "http_method": "GET",
              "description": route["description"],
              "price_usd": route["price_usd"],
              "payment_asset": "USDC",
              "payment_network": "Base",
              "category": route["category"],
              "provider": "Agent Data Tools x402",
              "contact_email": "jayp19386@gmail.com",
            }
            post("402INDEX " + route["name"], "https://402index.io/api/v1/register", payload)
            post("MARKET402 " + route["name"], "https://market402.com/submit", {"url": route["url"]})
