name: x402 free distribution
on:
  push:
    branches:
      - ops/x402-free-distribution-20261002
  workflow_dispatch:

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Register live PA x402 routes with x402dash
        shell: python
        run: |
          import json, urllib.request, urllib.error

          routes = [
            {
              "url": "https://pa-entity-x402.floot.app/_api/pa-entity-one?q=OpenAI",
              "name": "PA Entity Best Match",
              "description": "Resolve one best Pennsylvania business-registry match by company name.",
              "category": "Business Data",
              "tags": ["pennsylvania","business-registry","entity-resolution","vendor-verification","x402"],
            },
            {
              "url": "https://pa-entity-x402.floot.app/_api/pa-business?q=OpenAI&limit=1",
              "name": "PA Business Registry Search",
              "description": "Search Pennsylvania business-registration records by company name.",
              "category": "Business Data",
              "tags": ["pennsylvania","business-registry","company-data","due-diligence","x402"],
            },
          ]

          for route in routes:
            payload = dict(route)
            payload["contact"] = "jayp19386@gmail.com"
            req = urllib.request.Request(
              "https://api.x402dash.com/v1/register",
              data=json.dumps(payload).encode("utf-8"),
              headers={
                "Content-Type":"application/json",
                "User-Agent":"AgentDataTools-x402-distribution/1.2",
              },
              method="POST",
            )
            try:
              with urllib.request.urlopen(req,timeout=60) as resp:
                body=resp.read().decode("utf-8","replace")
                print(f"RECEIPT X402DASH {route['name']} HTTP {resp.status} {body[:6000]}")
            except urllib.error.HTTPError as exc:
              body=exc.read().decode("utf-8","replace")
              print(f"RECEIPT X402DASH {route['name']} HTTP {exc.code} {body[:6000]}")
            except Exception as exc:
              print(f"RECEIPT X402DASH {route['name']} ERROR {type(exc).__name__}: {exc}")
