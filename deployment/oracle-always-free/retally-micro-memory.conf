# Applied ONLY after a verified OCI VM.Standard.E2.1.Micro IMDS check.
# Leave at least ~256 MiB of 1 GiB guest RAM for Ubuntu/kernel/cloud-init.
# App remains synthetic-only and disabled until independent acceptance.
[Service]
MemoryAccounting=yes
MemoryHigh=640M
MemoryMax=768M
TasksMax=96
OOMPolicy=stop
