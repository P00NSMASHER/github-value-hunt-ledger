name: RETALLY Phase 2 Financial Research Gates
on:
  pull_request:
    paths:
      - 'freight/test_lab_phase2_existing_settlement_bridge.py'
      - 'freight/lab_archive_repairs/phase2/**'
      - '.github/workflows/freight-lab-phase2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-domain-and-independent-oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact proposed revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install pinned test dependencies
        run: python -m pip install -r production/requirements-ci.txt
      - name: Exercise real existing settlement and independent oracle
        run: PYTHONPATH=. python -m pytest -q freight/test_settlement_store.py freight/test_lab_intelligence.py freight/test_lab_phase2_existing_settlement_bridge.py
      - name: Preserve original finding ledger
        run: PYTHONPATH=. python -m pytest -q freight/test_lab_hunter_research_registry.py
      - name: Validate imported local patch and provenance receipt
        run: |
          python -m py_compile freight/lab_archive_repairs/phase2/phase2_audit_probe.py
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          root=Path('freight/lab_archive_repairs/phase2')
          receipt=json.loads((root/'PHASE2_VERIFY_RECEIPT.json').read_text())
          patch=(root/'PHASE2_UNIFIED_LAB.patch').read_bytes()
          assert hashlib.sha256(patch).hexdigest()==receipt['patch_sha256']
          assert receipt['five_original_audit_repro_before']
          assert receipt['five_original_audit_repro_after']
          assert sum(receipt['five_original_audit_repro_before'].values())==5
          assert sum(receipt['five_original_audit_repro_after'].values())==0
          assert receipt['total_test_suite_passed']==89
          print('Receipt and patch match; external offline archive regression must be independently repeated.')
          PY
      - name: Claim boundary
        run: |
          echo 'Independent local controls only. No hosted staging equivalence, bank reconciliation or real buyer authority.'
          echo 'Historical findings unchanged. No deployment, mail, payments, carrier actions or recurring tasks.'
