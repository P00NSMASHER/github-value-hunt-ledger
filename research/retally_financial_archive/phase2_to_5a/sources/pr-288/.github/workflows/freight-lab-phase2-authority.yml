name: RETALLY Phase 2 Independent Evidence & 14-Lab Research
on:
  pull_request:
    paths:
      - 'freight/lab_assurance.py'
      - 'freight/test_lab_assurance.py'
      - 'freight/test_lab_assurance_real_store.py'
      - 'freight/lab_operations_intelligence.py'
      - 'freight/test_lab_operations_intelligence.py'
      - 'freight/lab_phase2_pipeline.py'
      - 'freight/test_lab_phase2_pipeline.py'
      - 'freight/lab_customer_scenarios.py'
      - 'freight/test_lab_customer_scenarios.py'
      - 'freight/lab_experiment_ledger.py'
      - 'freight/test_lab_experiment_ledger.py'
      - 'freight/lab_phase2_demo.py'
      - 'freight/LAB_PHASE2_AUTHORITY_CONTINUATION.md'
      - '.github/workflows/freight-lab-phase2-authority.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  independent-finance-and-lab-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact proposed source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install approved pinned CI dependencies
        run: python -m pip install -r production/requirements-ci.txt
      - name: Preserve existing settlement domain regression behavior
        run: PYTHONPATH=. python -m pytest -q freight/test_settlement_store.py freight/test_lab_phase2_existing_settlement_bridge.py
      - name: Exercise independent evidence, route, customer and experiment contracts
        run: |
          PYTHONPATH=. python -W error::ResourceWarning -m unittest -v \
            freight.test_lab_assurance \
            freight.test_lab_operations_intelligence \
            freight.test_lab_phase2_pipeline \
            freight.test_lab_customer_scenarios \
            freight.test_lab_experiment_ledger \
            freight.test_lab_assurance_real_store
      - name: Demonstrate owner report and 14-lab work routing
        run: |
          PYTHONPATH=. python -m freight.lab_phase2_demo --output /tmp/retally-phase2
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('/tmp/retally-phase2/phase2_example.json').read_text())
          packet=data['financial']
          assert packet['status']=='RESEARCH_REVIEW_ONLY'
          assert data['production_deployed'] is False
          assert data['carrier_or_bank_activity'] is False
          assert packet['business_decision']['modeled_current_margin_cents']==-90
          assert packet['true_customer_recovery_proven'] is False
          items=packet['routed_lab_work']['lab_work_items']
          assert set(x['lab'] for x in items)==set(range(1,15))
          assert all(x['status']=='ROUTED_NOT_EXECUTED' for x in items)
          assert len(data['customer_reactions']['reactions'])>=2
          print('PASS: fictional evidence and 14-lab routing contract; no workers executed')
          PY
      - name: Keep the historical audit ledger explicitly open
        run: PYTHONPATH=. python -m pytest -q freight/test_lab_hunter_research_registry.py
      - name: Prevent unsupported product claims
        run: |
          echo 'Read-only research, public synthetic test HMAC keys.'
          echo 'No real bank/carrier/buyer attestation or hosted service equivalence.'
          echo 'No historical finding automatically closed; no merge or production deploy.'
