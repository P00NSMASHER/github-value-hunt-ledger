name: RETALLY Lab 14 FRED Distributor Parent BLS PPI Provenance (Mission 27)
on:
  pull_request:
    paths:
      - '.github/workflows/retally-fred-parent-ppi.yml'
      - 'freight/research_fred_parent_ppi.py'
      - 'freight/test_research_fred_parent_ppi.py'
      - 'freight/research/FRED_PARENT_484_PPI_2017_2024_20261012.json'
      - 'freight/RESEARCH_FRED_PARENT_PPI_BRIDGE.md'
      - 'freight/lab_phase4_director.py'
      - 'freight/lab_phase4_control_center.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-source-falsification-and-original-lab14:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install original 14-lab research prerequisites
        run: |
          python -m pip install -r production/requirements-ci.txt
          python -m pip install cryptography==46.0.4
      - name: Run FRED source robustness and prior BLS Census lab regressions
        run: |
          PYTHONPATH=. python -m pytest -q \
            freight/test_research_fred_parent_ppi.py \
            freight/test_research_bls_ppi_bridge.py \
            freight/test_research_sas_aies_bridge.py \
            freight/test_research_sas_temporal.py \
            freight/test_research_sas_peer_benchmark.py \
            freight/test_research_sas_benchmark.py \
            freight/test_research_aies_2022_lineage.py \
            freight/test_research_aies_historical_lineage.py \
            freight/test_research_aies_original_ftp.py \
            freight/test_research_ltl_revenue_bridge.py \
            freight/test_research_cfs_primary_replay.py \
            freight/test_research_cfs_mode_hierarchy.py \
            freight/test_lab_phase4_director.py
      - name: Keep original fourteen labs and eighteen human customer-pilot holds intact
        run: |
          PYTHONPATH=. python -m freight.research_fred_parent_ppi \
            --offline --as-of-date "$(date -u +%F)" \
            --out /tmp/retally-m27-offline
          PYTHONPATH=. python -m freight.lab_phase4_control_center \
            --out /tmp/retally-m27-control
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/retally-m27-offline/fred_parent_ppi_provenance.json')
          r=json.loads(p.read_text())
          q=json.loads(Path('/tmp/retally-m27-control/phase4_control.json').read_text())
          assert r['scope']=='LAB14_FRED_BLS_PARENT_TRUCKING_PPI_PROVENANCE_NOT_OFFICIAL_REAL_OUTPUT'
          assert r['source_status']=='FRED_PUBLIC_WEB_TABLE_SNAPSHOT_NOT_FRESH_CI_PUBLISHER_REPLAY'
          assert r['source_is_direct_bls_api_verified'] is False
          assert r['fresh_fred_distributor_http_replay_completed'] is False
          assert r['fresh_monthly_observations_verified_against_fred_http_this_run']==0
          assert r['parent_index_adjusted_estimate_can_be_marked_source_authenticated'] is False
          assert r['source_months_2017_2024_in_web_observed_snapshot']==96
          assert r['parent_2017_to_2024_nominal_census_growth_pct']=='38.65'
          assert r['parent_2017_to_2024_fred_displayed_price_index_change_pct']=='37.04'
          assert r['parent_2017_to_2024_provisional_price_adjusted_revenue_proxy_pct']=='1.18'
          assert len(r['m26_child_ppi_comparison'])==2
          assert {x['naics'] for x in r['m26_child_ppi_comparison']}=={'484121','484122'}
          assert r['m26_bls_original_api_parent_source_rejection_preserved'] is True
          assert r['adjusted_revenue_proxy_is_not_official_real_gross_output'] is True
          assert r['client_paid_ltl_invoice_rows_observed']==0
          assert r['freight_recoverable_market_tam_usd'] is None
          assert r['public_performance_claims_or_external_contacts_authorized'] is False
          assert r['human_customer_pilot_18_independent_requirements_still_unmet'] is True
          assert r['scheduled_tasks_created_or_modified'] is False
          assert r['lab']==14 and r['new_lab_created'] is False
          assert len(q['lab_runs'])==14 and q['failed_or_blocked_labs']==[]
          assert q['pilot_preflight']['unmet_requirements']==18
          assert q['actual_revenue_cents']==0
          assert q['fred_parent_484_ppi_provenance']['receipt_sha256']==r['receipt_sha256']
          assert 'fred_parent_ppi_provenance.html' in Path('/tmp/retally-m27-control/index.html').read_text()
          print('Lab 14 unchanged; 96 FRED-web source months provisional, NOT fresh HTTP verified; 18 real pilot controls still blocked.')
          PY
      - name: Preserve only offline source QA receipts, no raw FRED files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: retally-lab14-fred-parent-web-snapshot-m27
          path: |
            /tmp/retally-m27-offline/fred_parent_ppi_provenance.json
            /tmp/retally-m27-offline/fred_parent_ppi_provenance.html
          if-no-files-found: error
          retention-days: 14

  bounded-direct-fred-distributor-validation:
    needs: offline-source-falsification-and-original-lab14
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Check FRED original public HTML publisher source (12-second bounded access)
        run: |
          PYTHONPATH=. python -m freight.research_fred_parent_ppi \
            --fetch-fred --as-of-date "$(date -u +%F)" \
            --out /tmp/retally-m27-direct-fred
      - name: Never promote FRED redistribution to direct BLS or freight recovery proof
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('/tmp/retally-m27-direct-fred/fred_parent_ppi_provenance.json').read_text())
          assert r['source_series_id']=='PCU484484'
          assert r['source_is_bls_origin_but_fred_distributed'] is True
          assert r['source_is_direct_bls_api_verified'] is False
          assert r['m26_bls_original_api_parent_source_rejection_preserved'] is True
          assert r['source_months_2017_2024_in_web_observed_snapshot']==96
          assert r['parent_2017_to_2024_nominal_census_growth_pct']=='38.65'
          assert r['parent_2017_to_2024_provisional_price_adjusted_revenue_proxy_pct']=='1.18'
          assert r['adjusted_revenue_proxy_is_not_official_real_gross_output'] is True
          assert r['client_paid_ltl_invoice_rows_observed']==0
          assert r['freight_recoverable_market_tam_usd'] is None
          assert r['actual_refunds_or_cash_recoveries_usd'] is None
          assert r['human_customer_pilot_18_independent_requirements_still_unmet'] is True
          assert r['scheduled_tasks_created_or_modified'] is False
          assert len(r['receipt_sha256'])==64
          if r['source_status']=='FRED_DISTRIBUTOR_HTTP_96_MONTHS_REPLAYED_NOT_DIRECT_BLS_API':
            assert r['fresh_fred_distributor_http_replay_completed'] is True
            assert r['fresh_monthly_observations_verified_against_fred_http_this_run']==96
            assert len(r['fresh_fred_http_sha256'])==64
            assert r['parent_484_price_index_provenance_grade']=='DIRECT_FRED_DISTRIBUTOR_HTTP_NOT_DIRECT_BLS'
            assert r['parent_index_adjusted_estimate_can_be_marked_source_authenticated'] is True
            print('FRED DISTRIBUTOR original public HTML 96/96 months verified; original BLS API still NOT verified.')
          elif r['source_status']=='BLOCKED_FRED_DISTRIBUTOR_HTTP_NO_ORIGINAL_SOURCE_REPLAY':
            assert r['fresh_fred_distributor_http_replay_completed'] is False
            assert r['fresh_monthly_observations_verified_against_fred_http_this_run']==0
            assert r['fresh_fred_http_sha256'] is None
            assert r['parent_index_adjusted_estimate_can_be_marked_source_authenticated'] is False
            print('::warning::Original FRED publisher HTTP unavailable: NOT REPLAYED, FRED snapshot stays provisional.')
          else:
            raise AssertionError('FRED_SOURCE_STATUS_NOT_ALLOWED_OR_RETRIEVED_DATA_DRIFT')
          PY
      - name: Retain evidence statuses only, no raw HTML or customer data
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: retally-lab14-fred-parent-source-status-m27
          path: |
            /tmp/retally-m27-direct-fred/fred_parent_ppi_provenance.json
            /tmp/retally-m27-direct-fred/fred_parent_ppi_provenance.html
          if-no-files-found: error
          retention-days: 14
