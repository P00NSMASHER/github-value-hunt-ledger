name: RETALLY Lab 14 Original Federal Court Money Lineage
on:
  pull_request:
    paths:
      - '.github/workflows/retally-crowley-court-money-lineage.yml'
      - 'freight/public_crowley_court_money_lineage_v1.py'
      - 'freight/test_public_crowley_court_money_lineage_v1.py'
      - 'freight/fixtures/public_federal_crowley_gsa_2023_2025_original_court_timeline.json'
      - 'freight/RESEARCH_CROWLEY_COURT_GSA_MONEY_LINEAGE_20261018.md'
      - 'freight/public_original_research_control.py'
      - 'freight/test_public_original_research_control.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-court-docket-and-money-classification:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Exact original court and GSA cross-source status, no fake settlements
        run: |
          PYTHONPATH=. python -m unittest -v freight.test_public_crowley_court_money_lineage_v1
          PYTHONPATH=. python -m unittest -v freight.test_public_original_research_control
      - name: Hold promise versus paid budget report versus damages litigation as distinct
        run: |
          PYTHONPATH=. python -m freight.public_crowley_court_money_lineage_v1 > /tmp/crowley_gsa_original_court.json
          PYTHONPATH=. python -m freight.public_original_research_control > /tmp/lab14_original_sources.json
          python - <<'PY'
          import json
          from pathlib import Path
          court=json.loads(Path('/tmp/crowley_gsa_original_court.json').read_text())
          whole=json.loads(Path('/tmp/lab14_original_sources.json').read_text())
          assert court['source_documents']==3
          assert court['source_timeline_events']==4
          assert court['GSA_FY2023_reported_vendor_refund_approx_cents']==2960000000
          assert court['GSA_FY2023_bank_transfer_receipt_independently_authenticated'] is False
          assert court['must_not_double_count_29_6m_as_59_2m'] is True
          assert court['2023_separate_Ocean_USC9_refund_only_promised_cents']==3584043
          assert court['2023_Ocean_USC9_bank_payment_verified'] is False
          assert court['2025_11_8m_Claims_Court_damages_claim_cents']==1180000000
          assert court['2025_11_8m_claim_was_awarded_or_paid_by_appeal'] is False
          assert court['current_2026_parallel_docket_resolution'] is None
          assert court['private_RETALLY_can_issue_statutory_GSA_offsets'] is False
          assert court['RETALLY_customer_cash_recovered_cents']==0
          assert whole['court_budget_pair_not_two_independent_29_6m_payments'] is True
          assert whole['total_bounded_observations']==307
          assert whole['original_historical_findings_still_open']==26
          assert whole['independent_first_customer_human_gates_unmet']==18
          assert whole['commercial_claim_clearance']=='NO_GO'
          print('Original court/GSA sources reconcile: one historical GSA-reported $29.6m paid, separate unverified $35,840 promise, $11.8m litigated not awarded, zero RETALLY cash.')
          PY
